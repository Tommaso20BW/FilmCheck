<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Stasera Cosa Guardo</title>
<meta name="description" content="Scegli film, serie TV o anime da guardare stasera in 10 secondi.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link id="fav" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff3d52'/%3E%3Cpath d='M24 18l24 14-24 14V18z' fill='%23fff'/%3E%3C/svg%3E">
<link id="apple" rel="apple-touch-icon" href="">
<meta name="theme-color" content="#09070f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stasera">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#09070f;--s1:#13101d;--s2:#1a1627;--s3:#262036;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --fg:#f5f1fb;--mut:#a29bb5;--dim:#6f6885;
  --red:#ff3d52;--pink:#c13bd9;--vio:#8f62f8;--gold:#f6c653;
  --grad:linear-gradient(135deg,#ff3d52,#c13bd9 62%,#8f62f8);
  --r1:14px;--r2:20px;--r3:26px;--gut:18px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.85,.25,1);
  --fd:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --fb:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100%;font:16px/1.45 var(--fb);color:var(--fg);background:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
a{color:inherit;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sfondo ambientale */
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:110vmax;height:110vmax;border-radius:50%;will-change:transform}
body::before{left:-60vmax;top:-70vmax;background:radial-gradient(closest-side,rgba(143,98,248,.24),transparent);animation:d1 24s ease-in-out infinite alternate}
body::after{right:-60vmax;bottom:-75vmax;background:radial-gradient(closest-side,rgba(255,61,82,.17),transparent);animation:d2 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(30vmax,18vmax,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(-26vmax,-20vmax,0) scale(1.2)}}

/* backdrop sfocato (solo nel risultato) */
#bd{position:fixed;left:0;right:0;top:0;height:62%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
#bd.on{opacity:1}
#bd i{position:absolute;inset:-10%;background-size:cover;background-position:center top;filter:blur(34px) saturate(1.5) brightness(.55);transform:scale(1.2)}

/* struttura */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden}
.top{flex:none;padding-top:max(10px,calc(var(--sat) - 10px));position:relative;z-index:5}
/* barra alta: trasparente, nessun riquadro, un'unica linea continua di progresso */
.top-in{height:52px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 6px}
.slot{display:flex;align-items:center;min-width:0}
.slot.r{justify-content:flex-end;padding-right:12px}
.tb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .1s,background .2s}
.tb:active{transform:scale(.88);background:rgba(255,255,255,.12)}
.tb svg{width:24px;height:24px}
.cnt{font:700 .8rem var(--fd);letter-spacing:.08em;color:var(--mut);white-space:nowrap}
.cnt b{color:var(--fg);font-weight:800}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:.86rem;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em}
.mark{width:22px;height:22px;border-radius:7px;background:var(--grad);display:grid;place-items:center;box-shadow:0 3px 12px rgba(255,61,82,.45)}
.mark svg{width:10px;height:10px;margin-left:2px}
.prog{height:3px;margin:2px var(--gut) 8px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;transition:opacity .3s}
.prog.off{opacity:0}
.prog b{display:block;height:100%;width:0;border-radius:inherit;background:var(--grad);box-shadow:0 0 10px rgba(255,61,82,.6);transition:width .6s var(--ease)}

/* il contenuto sfuma sotto la barra: nessun taglio netto */
#stage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px var(--gut) 20px;
  -webkit-mask-image:linear-gradient(transparent,#000 14px);mask-image:linear-gradient(transparent,#000 14px)}
#stage::-webkit-scrollbar{display:none}

/* dock inferiore: resta SOPRA la zona della home-indicator, così i tasti si toccano sempre */
#dock{flex:none;position:relative;z-index:6;padding:12px var(--gut) calc(var(--sab)*.55 + 14px)}
#dock::before{content:"";position:absolute;left:0;right:0;top:-26px;height:26px;pointer-events:none;background:linear-gradient(transparent,var(--bg))}
#dock{background:var(--bg)}
.dock-in{display:flex;gap:8px}
.dock-in .btn{padding:0 6px;font-size:.92rem;border-radius:16px}
.btn{position:relative;overflow:hidden;flex:1;min-width:0;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 14px;
  border:1px solid var(--line2);background:var(--s2);font-weight:700;font-size:1rem;white-space:nowrap;text-decoration:none;color:var(--fg);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(1.2)}
.btn svg{width:20px;height:20px;flex:none}
.dock-in .btn{animation:rise .5s var(--ease) backwards}
.dock-in .btn:nth-child(2){animation-delay:.06s}
.dock-in .btn:nth-child(3){animation-delay:.12s}

/* banner installazione (dentro al dock) */
.ib{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 12px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--line)}
.ib[hidden]{display:none}
.ib p{margin:0;flex:1;font-size:.82rem}
.ib .btn{flex:none;height:40px;border-radius:12px;font-size:.82rem;padding:0 14px}

/* scelta */
.page{min-height:100%;display:flex;flex-direction:column;gap:18px}
.page h1{margin:4px 0 0;flex:none;font-family:var(--fd);font-weight:800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.02;letter-spacing:-.04em}
/* UN SOLO layout per tutte le domande: elenco a righe che riempie lo schermo */
.opts{flex:1;display:grid;gap:10px;grid-template-columns:1fr;grid-auto-rows:minmax(60px,1fr)}
.opt{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;padding:8px 16px 8px 12px;text-align:left;min-height:60px;
  border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:transform .1s,border-color .15s,background .15s,box-shadow .2s}
.opt:active{transform:scale(.97)}
.opt .em{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:1.7rem;line-height:1}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .t{font-weight:700;font-size:1.08rem;line-height:1.15}
.opt .s{font-size:.8rem;line-height:1.25;color:var(--mut)}
.opt .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:background .15s,border-color .15s}
/* 8 opzioni (voglie): righe più compatte, così ci stanno tutte senza scorrere */
.opts.n8{gap:8px;grid-auto-rows:minmax(48px,1fr)}
.opts.n8 .opt{min-height:48px;padding:5px 14px 5px 10px;gap:12px}
.opts.n8 .opt .em{width:34px;height:34px;font-size:1.45rem}
.opts.n8 .opt .t{font-size:1rem}
.opts.n8 .opt .s{font-size:.76rem}
.opt.on{border-color:var(--red);background:linear-gradient(135deg,rgba(255,61,82,.26),rgba(143,98,248,.22));box-shadow:0 0 0 1px var(--red) inset,0 10px 30px rgba(255,61,82,.2)}
.opt.on .ck{border-color:transparent;background:var(--grad)}
.opt.on .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media (hover:hover){.opt:hover{border-color:var(--line2)}}

/* caricamento / errore */
.load{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.spin{position:relative;width:84px;height:84px}
.spin i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,var(--red) 80%,#fff);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:sp 1s linear infinite}
.spin i+i{inset:14px;background:conic-gradient(from 0deg,transparent 0 30%,var(--vio) 85%,#fff);animation:sp 1.5s linear infinite reverse}
.spin b{position:absolute;inset:33px;border-radius:50%;background:radial-gradient(circle,var(--gold),var(--red));box-shadow:0 0 30px var(--red);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.65);opacity:.7}50%{transform:scale(1.2);opacity:1}}
@keyframes sp{to{transform:rotate(360deg)}}
.load p{margin:0;font-family:var(--fd);font-weight:700;font-size:1.3rem}
.err{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.err h2{margin:0;font-family:var(--fd);font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-.03em}
.err p,.err small{margin:0;color:var(--mut)}

/* risultato */
.res{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.poster{position:relative;width:min(54vw,224px);aspect-ratio:2/3;border-radius:var(--r2);overflow:hidden;background:var(--s2);border:1px solid var(--line2);cursor:zoom-in;
  box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 40px rgba(143,98,248,.25);touch-action:manipulation;transition:transform .15s}
.poster:active{transform:scale(.97)}
.poster img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .6s,transform .9s var(--ease)}
.poster img.ld{opacity:1;transform:none}
.poster::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);transform:translateX(-120%);animation:psweep 1.1s .7s ease-out forwards}
@keyframes psweep{to{transform:translateX(120%)}}
.zoom{position:absolute;right:8px;bottom:8px;z-index:3;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.zoom svg{width:16px;height:16px}
.poster.fb{display:flex;flex-direction:column;justify-content:space-between;padding:.9em;color:#fff;border:0;font-size:16px}
.poster.fb h3{margin:0;font-family:var(--fd);font-size:1.25em;line-height:1.1}
.poster.fb small{opacity:.8;font-size:.7em;letter-spacing:.1em;text-transform:uppercase}
.hero h2{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,7.5vw,2.3rem);line-height:1.03;letter-spacing:-.035em;word-break:break-word}
.tag{margin:-6px 0 0;font-size:.88rem;color:var(--mut);font-style:italic}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:.78rem;color:var(--fg);font-weight:600}
.chip.r{color:var(--gold);border-color:rgba(246,198,83,.4)}
.card{padding:16px;border:1px solid var(--line);border-radius:var(--r2);background:linear-gradient(160deg,var(--s2),var(--s1))}
.card h3{margin:0 0 12px;font:700 .7rem var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.card p{margin:0;font-size:.95rem}
.card p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.compat{display:flex;align-items:center;gap:16px}
.ringw{position:relative;flex:none;width:68px;height:68px}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:6;stroke-linecap:round}
.ringw .bgc{stroke:rgba(255,255,255,.1)}
.ringw .fgc{stroke:url(#rg);stroke-dasharray:169.65;stroke-dashoffset:169.65;transition:stroke-dashoffset 1.2s .35s var(--ease)}
.ringw .pn{position:absolute;inset:0;display:grid;place-items:center;font:800 1.05rem var(--fd)}
.compat b{display:block;font:800 1.1rem var(--fd);letter-spacing:-.01em}
.compat span.sub{font-size:.82rem;color:var(--mut)}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.why li{display:flex;gap:11px;align-items:flex-start}
.why li b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(246,198,83,.16);color:var(--gold);font-size:.7rem}
.lnk-btn{margin-top:10px;font-size:.84rem;font-weight:700;color:var(--gold)}

/* piattaforme: SOLO icone, sempre su una riga, si rimpiccioliscono per starci */
.pg+.pg{margin-top:14px}
.pg small{display:block;margin-bottom:8px;font-size:.72rem;color:var(--mut);font-weight:600}
.pl{display:flex;flex-wrap:nowrap;gap:8px}
.pv{flex:1 1 0;min-width:0;max-width:46px;aspect-ratio:1;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--s3);transition:transform .1s}
.pv img{width:100%;height:100%;object-fit:cover}
.pv.t{display:grid;place-items:center;font:800 .7rem var(--fd);color:var(--mut)}
a.more{display:inline-block;margin-top:14px;font-size:.82rem;color:var(--gold);text-decoration:none;font-weight:700}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;margin:0;font-size:.88rem}
.info dt{color:var(--mut)}
.info dd{margin:0}
.attr{margin:0;font-size:.62rem;line-height:1.4;color:var(--mut);opacity:.65;text-align:center;padding:2px 8px 8px}
.tmdbl{text-align:center;margin:0}

/* lightbox locandina */
#lb{position:fixed;inset:0;z-index:100;display:none}
#lb.on{display:block}
#lb .bg{position:absolute;inset:0;background:rgba(5,3,10,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);opacity:0;transition:opacity .4s}
#lb.show .bg{opacity:1}
#lb .card2{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:var(--r2);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(143,98,248,.3);touch-action:none;will-change:transform}
#lb .card2 img{width:100%;height:100%;object-fit:cover}
#lb .card2 .poster{width:100%;height:100%;border-radius:0;box-shadow:none;cursor:default;border:0}
#lb .x{position:absolute;top:calc(var(--sat) + 12px);right:14px;opacity:0;transition:opacity .4s .15s}
#lb.show .x{opacity:1}
#lb .hint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);text-align:center;font-size:.8rem;color:var(--mut);opacity:0;transition:opacity .4s .25s}
#lb.show .hint{opacity:1}

/* animazioni */
.in{animation:slide .45s var(--ease) backwards}
.out{animation:outx .2s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes slide{from{opacity:0;transform:translate3d(var(--dx,100%),0,0)}}
@keyframes rise{from{opacity:0;transform:translate3d(var(--dx,0px),var(--dy,16px),0) scale(.985)}}
@keyframes outx{to{opacity:0;transform:translate3d(var(--ox,-100%),0,0)}}
@keyframes rowIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes chipIn{from{opacity:0;transform:translateY(6px) scale(.6)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes sel{0%{box-shadow:0 0 0 0 rgba(255,61,82,.55)}100%{box-shadow:0 0 0 16px rgba(255,61,82,0)}}
.in .page h1{animation:rowIn .5s var(--ease) .04s backwards}
.in .opt{animation:rowIn .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*50ms + 70ms)}
.opt.hit{animation:sel .5s ease-out}
.opt.on .ck{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.in .res>*{animation:up .6s var(--ease) backwards;animation-delay:calc(var(--k,0)*70ms + 40ms)}
.in .chip{animation:chipIn .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.3s + var(--c,0)*60ms)}
.in .why li{animation:up .5s var(--ease) backwards;animation-delay:calc(.45s + var(--c,0)*100ms)}
.in .pv{animation:chipIn .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.5s + var(--c,0)*45ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div id="bd"><i></i></div>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="slot" id="tl"></div>
      <div class="brand"><span class="mark"><svg viewBox="0 0 12 12"><path d="M1 0l11 6L1 12z" fill="#fff"/></svg></span>Stasera</div>
      <div class="slot r" id="tr"></div>
    </div>
    <div class="prog off" id="prog"></div>
  </header>
  <main id="stage"></main>
  <div id="dock">
    <div class="ib" id="ib" hidden>
      <span style="font-size:22px">📲</span>
      <p>Aggiungila alla schermata Home per usarla come un'app.</p>
      <button type="button" class="btn primary" id="ibtn">Installa</button>
      <button type="button" class="tb" id="ix" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dock-in" id="dockin"></div>
  </div>
</div>
<div id="lb" aria-modal="true" role="dialog" aria-label="Locandina">
  <div class="bg"></div>
  <div class="card2" id="lbc"></div>
  <button type="button" class="tb x" id="lbx" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="hint">Tocca per chiudere</div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)], uniq=a=>[...new Set(a)], sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>{try{return new DOMParser().parseFromString(String(s||""),"text/html").body.textContent||"";}catch(e){return "";}};
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};

/* ---------- Icone ---------- */
const sv=(p,x)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"'+(x||'')+'>'+p+'</svg>';
const IC={
  back:sv('<path d="M15 5l-7 7 7 7"/>'),
  x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  share:sv('<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>'),

async function wdLinks(tid,movie){
  const q='SELECT ?pl ?v ?fu WHERE{?i wdt:'+(movie?'P4947':'P4983')+' "'+tid+'". ?i ?p ?v. ?pr wikibase:directClaim ?p; wikibase:propertyType wikibase:ExternalId; wdt:P1630 ?fu; rdfs:label ?pl. FILTER(LANG(?pl)="en") FILTER(REGEX(?pl,"Netflix|Disney|Apple TV|Prime Video|Amazon (Prime|video)|Paramount|RaiPlay","i"))} LIMIT 30';
  const rows=await Promise.race([sparql(q),sleep(9000).then(()=>[])]);
  const out={};
  rows.forEach(b=>{
    const lab=b.pl.value,k=pkey(lab);
    if(!k||out[k]||/person|actor|director|character|episode|season/i.test(lab))return;
    const url=b.fu.value.replace("$1",b.v.value);
    try{
      const u=new URL(url),re=PROVRE.find(p=>p[0]===k)[2];
      if(u.protocol==="https:"&&re.test(u.hostname))out[k]=url;
    }catch(e){}
  });
  return out;
}

function fbPoster(t,y){const h=Array.from(t).reduce((a,ch)=>((a*31+ch.charCodeAt(0))%360),0);return '<div class="poster fb" role="button" tabindex="0" aria-label="Ingrandisci" style="background:linear-gradient(135deg,hsl('+h+' 68% 42%),hsl('+((h+55)%360)+' 58% 30%))"><small>Stasera</small><h3>'+esc(t)+'</h3><small>'+esc(y||'')+'</small></div>';}
function why(r,sur){
  const a=S.a,d=r.d,m=r.m,g=m.genres||[],gs=G[S.cat==="cartoni"?(isFilmItem(m)?"film":"serie"):gkey(S.cat,a)],o=[];
  if(sur)o.push('È una scelta volutamente fuori dalla tua comfort zone.');
  if(hit(g,gs.mood[a.mood]))o.push('Cercavi '+MOOD_TXT[a.mood]+(d.glist&&d.glist.length?" e i suoi generi ("+d.glist.slice(0,3).join(', ')+") vanno in quella direzione.":"."));
  else o.push('Non è il genere più ovvio per chi cerca '+MOOD_TXT[a.mood]+(d.glist&&d.glist.length?" ("+d.glist.slice(0,3).join(', ')+")":"")+': lo propongo per gli altri criteri.');
  if(a.who==="family")o.push('Escluso il materiale più adatto a un pubblico adulto.');
  if(d.runtime)o.push(d.movie===false?'Episodi da '+d.runtime+' min.':'Dura '+fmtMin(d.runtime)+'.');
  if(!d.runtime&&d.episodes)o.push(d.episodes+' episodi.');
  if(d.rv)o.push('Voto '+(+d.rv).toFixed(1)+' / 10.');
  if(a.risk>=70)o.push('È abbastanza fuori dagli schemi da risultare interessante.');
  return o.slice(0,4);
}
function provUrl(name,title,fb){
  const q=encodeURIComponent(title||""),n=String(name||"").toLowerCase();
  if(/netflix/.test(n))return "https://www.netflix.com/search?q="+q;
  if(/prime video|amazon/.test(n))return "https://www.primevideo.com/search/?phrase="+q;
  if(/disney/.test(n))return "https://www.disneyplus.com/it-it/search?q="+q;
  if(/apple tv/.test(n))return "https://tv.apple.com/it/search?term="+q;
  if(/paramount/.test(n))return "https://www.paramountplus.com/it/search/?q="+q;
  if(/^now\b/.test(n))return "https://www.nowtv.it/watch/search?q="+q;
  if(/raiplay/.test(n))return "https://www.raiplay.it/ricerca.html?q="+q;
  if(/infinity/.test(n))return "https://www.mediasetinfinity.mediaset.it/search?q="+q;
  if(/youtube/.test(n))return "https://www.youtube.com/results?search_query="+q;
  if(/google play/.test(n))return "https://play.google.com/store/search?c=movies&q="+q;
  return fb||("https://www.justwatch.com/it/cerca?q="+q);
}
function provHtml(d){
  if(d.rl!=="TMDB"||!d.provKnown)return "";
  const groups=[["flat","In abbonamento"],["ads","Gratis con pubblicità"],["rent","Noleggio"],["buy","Acquisto"]];
  let h="";
  groups.forEach(g=>{
    const arr=(d.prov&&d.prov[g[0]])||[];if(!arr.length)return;
    h+='<div class="pg"><small>'+g[1]+'</small><div class="pl">'+arr.map(p=>{
      const nm=esc(p.provider_name),k=pkey(p.provider_name);
      return '<span class="pv'+(p.logo_path?'':' t')+'" title="'+nm+'" role="img" aria-label="'+nm+'">'+(p.logo_path?'<img src="https://image.tmdb.org/t/p/w92'+esc(p.logo_path)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'t\');this.parentNode.textContent=this.parentNode.title.slice(0,2);">':nm.slice(0,2))+'</span>';
    }).join('')+'</div></div>';
  });
  if(!h)h='<p>Al momento non risulta disponibile in Italia su piattaforme di streaming, noleggio o acquisto.</p>';
  return '<section class="card"><h3>Dove guardarlo in Italia</h3>'+h+'</section>';
}
function infoHtml(d){
  const eps=(d.seasons?d.seasons+(d.seasons>1?' stagioni':' stagione'):'')+(d.episodes?(d.seasons?' · ':'')+d.episodes+' episodi':'');
  const rows=[
    ["Generi",d.gt],["Titolo originale",d.orig],[d.isTv?"Ideata da":"Regia",d.dir],["Cast",d.cast],
    ["Rete",d.nets],["Paese",d.countries],["Lingua originale",d.lang],[d.isTv?"Prima messa in onda":"Uscita",d.date],
    ["Episodi",eps],["Stato",d.status],["Classificazione",d.cert],
    ["Voto pubblico",d.rv?(+d.rv).toFixed(1)+' / 10'+(d.vc?' · '+d.vc.toLocaleString('it-IT')+' voti':''):'']
  ].filter(x=>x[1]);
  if(!rows.length)return "";
  return '<section class="card"><h3>Scheda</h3><dl class="info">'+rows.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></section>';
}
function attrTxt(d){
  if(d.rl==='TMDB')return 'Dati e immagini: TMDB'+(d.provKnown?' · Dove guardarlo: JustWatch':'')+'. Questo prodotto usa le API di TMDB ma non è approvato né certificato da TMDB.';
  return 'Fonti: '+d.rl+(d.it?' · Wikipedia':'')+'. TMDB non utilizzato per questo risultato.';
}

/* ---------- Trailer: apre l'app YouTube se installata ---------- */
function openYt(e,key){
  const web="https://www.youtube.com/watch?v="+key,ua=navigator.userAgent||"";
  const android=/android/i.test(ua);
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(android){
    e.preventDefault();
    location.href="intent://www.youtube.com/watch?v="+key+"#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url="+encodeURIComponent(web)+";end";
    return;
  }
  if(ios&&navigator.standalone===true){
    e.preventDefault();
    const t=Date.now();
    location.href="youtube://www.youtube.com/watch?v="+key;
    setTimeout(()=>{if(!document.hidden&&Date.now()-t<2500){try{window.open(web,"_blank");}catch(x){}}},1000);
    return;
  }
  /* iOS Safari e desktop: il link https normale (iOS lo passa all'app tramite universal link) */
}

/* ---------- Condividi ---------- */
async function share(){
  const d=S.cur&&S.cur.d;if(!d)return;
  const text=d.title+(d.year?" ("+d.year+")":"")+" — stasera guardo questo!";
  try{
    if(navigator.share){await navigator.share({title:d.title,text,url:d.tmdbUrl||location.href});return;}
    await navigator.clipboard.writeText(text+(d.tmdbUrl?" "+d.tmdbUrl:""));
  }catch(e){}
}

/* ---------- Locandina grande (lightbox con animazione di ingrandimento) ---------- */
let LB=null;
const EASE="cubic-bezier(.2,.85,.25,1)";
const bigUrl=u=>String(u||"").replace("/t/p/w500/","/t/p/w780/").replace(/\?width=\d+$/,"?width=900");
function fromTo(sr,T){return "translate("+(sr.left-T.x)+"px,"+(sr.top-T.y)+"px) scale("+(sr.width/T.w)+","+(sr.height/T.h)+")";}
function openLb(el){
  if(LB)return;
  const lb=$("lb"),card=$("lbc"),sr=el.getBoundingClientRect();
  const vw=innerWidth,vh=innerHeight,padX=20,padT=76,padB=64;
  const maxW=vw-padX*2,maxH=vh-padT-padB;
  const w=Math.min(maxW,maxH*2/3,520),h=w*1.5,T={x:(vw-w)/2,y:padT+(maxH-h)/2,w,h};
  card.style.cssText="left:"+T.x+"px;top:"+T.y+"px;width:"+T.w+"px;height:"+T.h+"px";
  const im=el.querySelector("img");
  if(im){
    card.innerHTML='<img alt="" referrerpolicy="no-referrer">';
    const ci=card.firstChild;ci.src=im.currentSrc||im.src;
    const bu=bigUrl(im.currentSrc||im.src);
    if(bu!==ci.src){const pre=new Image();pre.referrerPolicy="no-referrer";pre.onload=()=>{if(LB)ci.src=bu;};pre.src=bu;}
  }else{
    const cl=el.cloneNode(true);cl.style.fontSize=(16*T.w/Math.max(60,sr.width))+"px";
    card.innerHTML="";card.appendChild(cl);
  }
  LB={el,T,card,lb,moved:false};
  lb.classList.add("on");void lb.offsetWidth;lb.classList.add("show");
  el.style.visibility="hidden";
  card.animate([{transform:fromTo(sr,T)},{transform:"none"}],{duration:RM()?1:470,easing:EASE});
  try{history.pushState({lb:1},"");}catch(e){}
}
function closeLb(){
  if(!LB)return;
  try{if(history.state&&history.state.lb){history.back();return;}}catch(e){}
  doCloseLb();
}
function doCloseLb(){
  if(!LB)return;
  const L=LB;LB=null;
  const sr=L.el.getBoundingClientRect(),cur=getComputedStyle(L.card).transform;
  L.lb.classList.remove("show");
  let done=false;const fin=()=>{if(done)return;done=true;L.lb.classList.remove("on");L.card.innerHTML="";L.el.style.visibility="";};
  const a=L.card.animate([{transform:cur==="none"?"none":cur},{transform:fromTo(sr,L.T)}],{duration:RM()?1:360,easing:EASE,fill:"forwards"});
  a.onfinish=fin;setTimeout(fin,700);
}
(function(){
  const lb=$("lb"),card=$("lbc");
  let y0=0,drag=false,dy=0;
  card.addEventListener("pointerdown",e=>{if(!LB)return;drag=true;y0=e.clientY;dy=0;LB.moved=false;try{card.setPointerCapture(e.pointerId);}catch(x){}});
  card.addEventListener("pointermove",e=>{
    if(!drag||!LB)return;dy=e.clientY-y0;
    if(Math.abs(dy)>6){LB.moved=true;
      card.style.transform="translateY("+dy+"px) scale("+(1-Math.min(.15,Math.abs(dy)/1600))+")";
      lb.querySelector(".bg").style.opacity=String(Math.max(.1,1-Math.abs(dy)/380));}
  });
  const up=()=>{
    if(!drag)return;drag=false;
    if(!LB)return;
    lb.querySelector(".bg").style.opacity="";
    if(Math.abs(dy)>100){closeLb();card.style.transform="";}
    else if(LB.moved){card.animate([{transform:card.style.transform},{transform:"none"}],{duration:260,easing:EASE});card.style.transform="";}
  };
  card.addEventListener("pointerup",up);card.addEventListener("pointercancel",up);
  lb.addEventListener("click",()=>{if(LB&&LB.moved){LB.moved=false;return;}closeLb();});
  $("lbx").addEventListener("click",e=>{e.stopPropagation();closeLb();});
  addEventListener("popstate",()=>{if(LB)doCloseLb();});
  addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();});
})();

/* ---------- Schermata risultato ---------- */
function polish(p,r){
  const pn=$('pn');
  if(pn){
    if(RM())pn.textContent=p;
    else{const t0=performance.now(),D=950,W=350;(function f(t){const k=Math.max(0,Math.min(1,(t-t0-W)/D)),e=1-Math.pow(1-k,3);pn.textContent=Math.round(p*e);if(t-t0<W+D)requestAnimationFrame(f);else pn.textContent=p;})(t0);}
  }
  const fg=stage.querySelector('.fgc');
  if(fg)requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.strokeDashoffset=String(169.65*(1-p/100));}));
  [['.chips>*'],['.why li'],['.pv']].forEach(q=>stage.querySelectorAll(q[0]).forEach((el,i)=>el.style.setProperty('--c',i)));
  stage.querySelectorAll('.poster img').forEach(im=>{const ok=()=>im.classList.add('ld');if(im.complete)ok();else{im.addEventListener('load',ok);im.addEventListener('error',ok);}});
  const pe=stage.querySelector('.poster');
  if(pe){pe.onclick=()=>{tap();openLb(pe);};pe.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLb(pe);}};}
  const pl=$('plot'),pm=$('pmore');
  if(pl&&pm)pm.onclick=()=>{const c=pl.classList.toggle('clamp');pm.textContent=c?'Leggi tutto':'Riduci';};
}
function show(r,sur){
  S.cur=r;const d=r.d;let p=pct(r.s);if(sur)p=Math.max(60,p-6);
  const poster=d.poster
    ?'<div class="poster" role="button" tabindex="0" aria-label="Ingrandisci la locandina"><img src="'+esc(d.poster)+'" alt="Locandina di '+esc(d.title)+'" referrerpolicy="no-referrer"><span class="zoom">'+IC.expand+'</span></div>'
    :fbPoster(d.title,d.year);
  const chips=[];
  if(d.year)chips.push('<span class="chip">'+esc(d.year)+'</span>');
  if(S.cat==='anime'||S.cat==='cartoni')chips.push('<span class="chip">'+(d.movie?'Film':'Serie')+'</span>');
  if(d.seasons)chips.push('<span class="chip">'+d.seasons+(d.seasons>1?' stagioni':' stagione')+'</span>');
  if(d.runtime)chips.push('<span class="chip">'+d.runtime+' min'+(d.movie===false?' / ep.':'')+'</span>');
  if(d.cert)chips.push('<span class="chip">'+esc(d.cert)+'</span>');
  if(d.rv)chips.push('<span class="chip r">★ '+(+d.rv).toFixed(1)+'</span>');
  const long=(d.overview||'').length>220;
  const h='<div class="res">'+
    '<div class="hero">'+poster+'<h2>'+esc(d.title)+'</h2>'+(d.tagline?'<p class="tag">'+esc(d.tagline)+'</p>':'')+'<div class="chips">'+chips.join('')+'</div></div>'+
    (d.ytKey?'<a class="btn" href="https://www.youtube.com/watch?v='+esc(d.ytKey)+'" data-yt="'+esc(d.ytKey)+'" target="_blank" rel="noopener" style="flex:none;color:var(--fg)"><span style="color:var(--red);display:grid">'+IC.play+'</span>Guarda il trailer</a>':'')+
    '<section class="card compat"><div class="ringw"><svg viewBox="0 0 64 64"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c653"/><stop offset="1" stop-color="#ff3d52"/></linearGradient></defs><circle class="bgc" cx="32" cy="32" r="27"/><circle class="fgc" cx="32" cy="32" r="27"/></svg><div class="pn"><span><span id="pn">0</span>%</span></div></div><div><b>Compatibilità</b><span class="sub">Quanto combacia con le tue risposte</span></div></section>'+
    '<section class="card"><h3>Perché fa per te</h3><ul class="why">'+why(r,sur).map(x=>'<li><b>✓</b><span>'+esc(x)+'</span></li>').join('')+'</ul></section>'+
    provHtml(d)+
    '<section class="card"><h3>Trama</h3><p class="'+(long?'clamp':'')+'" id="plot">'+esc(d.overview||'Trama non disponibile.')+'</p>'+(long?'<button type="button" class="lnk-btn" id="pmore">Leggi tutto</button>':'')+'</section>'+
    infoHtml(d)+
    (d.tmdbUrl?'<p class="tmdbl"><a class="more" style="margin:0" href="'+esc(d.tmdbUrl)+'" target="_blank" rel="noopener">Scheda completa su TMDB ↗</a></p>':'')+
    '<p class="attr">'+esc(attrTxt(d))+'</p>'+
  '</div>';
  swap(h);
  const rs=stage.querySelectorAll('.res>*');rs.forEach((el,i)=>el.style.setProperty('--k',i));
  polish(p,r);
  setBd(d.poster);
  ui({
    l:tbtn('back','back','Modifica risposte'),
    r:tbtn('share','share','Condividi'),
    d:bb('re','Ricomincia')+bb('sur','Sorprendimi')+bb('oth','Un altro'),
    a:{back:()=>{DIR=-1;home();},share,re:restart,sur:()=>run(true,false),oth:()=>run(false,false)}
  });
}

/* ---------- Altezza reale dell'app (iOS: a volte la pagina finisce sopra il bordo basso) ---------- */
function fit(){
  const a=$("app");a.style.bottom="0px";
  if(navigator.standalone!==true)return;
  const portrait=innerHeight>=innerWidth,sh=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
  const gap=Math.round(sh-a.getBoundingClientRect().bottom);
  if(gap>6&&gap<140)a.style.bottom=(-gap)+"px";
}
fit();addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,300));
