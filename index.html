<meta name="theme-color" content="#09070f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reelax">

<style>
:root{
  --bg:#09070f;--s1:#13101d;--s2:#1a1627;--s3:#262036;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --fg:#f5f1fb;--mut:#a29bb5;--dim:#6f6885;
  --red:#ff3d52;--pink:#c13bd9;--vio:#8f62f8;--gold:#f6c653;
  --grad:linear-gradient(135deg,#ff3d52,#c13bd9 62%,#8f62f8);
  --r1:14px;--r2:20px;--r3:26px;--gut:18px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bandb:0px;
  --ease:cubic-bezier(.2,.85,.25,1);
  --fd:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --fb:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
body{margin:0;height:100%;font:16px/1.45 var(--fb);color:var(--fg);background:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
a{color:inherit;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sfondo ambientale */
body::before,body::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:110vmax;height:110vmax;border-radius:50%;}
body::before{left:-60vmax;top:-10vmax;background:radial-gradient(closest-side,rgba(143,98,248,.24),transparent)}
body::after{right:-60vmax;bottom:-75vmax;background:radial-gradient(closest-side,rgba(255,61,82,.17),transparent)}

/* backdrop sfocato (solo nel risultato) */
#bd{position:absolute;left:0;right:0;top:0;height:62%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
#bd.on{opacity:1}
#bd::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(110px + var(--sat));z-index:2;background:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.6) 40%,transparent 100%)}
#bd i{position:absolute;inset:-10%;background-size:cover;background-position:center top;filter:blur(22px) brightness(.6);transform:scale(1.2) translateZ(0)}

/* struttura */
#app{position:fixed;left:0;right:0;top:0;bottom:0;z-index:1;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow-x:clip}
.top{flex:none;padding-top:calc(var(--sat) + 6px);position:relative;z-index:5}
/* barra alta: trasparente, nessun riquadro, un'unica linea continua di progresso */
.top-in{height:52px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 6px}
.slot{display:flex;align-items:center;min-width:0}
.slot.r{justify-content:flex-end;padding-right:12px}
.tb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .1s,background .2s}
.tb:active{transform:scale(.88);background:rgba(255,255,255,.12)}
.tb svg{width:24px;height:24px}
.cnt{font:700 .8rem var(--fd);letter-spacing:.08em;color:var(--mut);white-space:nowrap}
.cnt b{color:var(--fg);font-weight:800}

/* il contenuto sfuma sotto la barra: nessun taglio netto */

/* dock inferiore: resta SOPRA la zona della home-indicator, così i tasti si toccano sempre */
#dock{flex:none;position:relative;z-index:6;padding:12px var(--gut) 16px}

/* banner installazione (dentro al dock) */
.ib{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 12px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--line)}

.opts{flex:1;display:grid;gap:10px;grid-template-columns:1fr;grid-auto-rows:minmax(60px,1fr)}

  border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:transform .1s,border-color .15s,background .15s,box-shadow .2s}

/* caricamento / errore */

.tag{margin:-6px 0 0;font-size:.88rem;color:var(--mut);font-style:italic}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}

@property --f{syntax:'<length>';inherits:false;initial-value:0px}
.card p#plot{overflow:hidden;--f:0px;transition:height .6s cubic-bezier(.25,.8,.25,1),--f .6s ease;
  -webkit-mask-image:linear-gradient(#000 calc(100% - var(--f)),transparent);mask-image:linear-gradient(#000 calc(100% - var(--f)),transparent)}

.pg+.pg{margin-top:14px}

a.more{display:inline-block;margin-top:14px;font-size:.82rem;color:var(--gold);text-decoration:none;font-weight:700}

/* ricerca manuale */
.sin{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;flex:none}

.sr{display:flex;align-items:center;gap:14px;width:100%;padding:8px 14px 8px 8px;text-align:left;border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:transform .1s}
.sr:active{transform:scale(.98)}
.sr .th{flex:none;width:46px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--s3);display:grid;place-items:center;font-size:1.3rem}

/* lightbox locandina */
#lb{position:fixed;inset:0;z-index:100;display:none}

@property --ms{syntax:'<length>';inherits:false;initial-value:0px}

#lg{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(var(--sat) + 24px) var(--gut) calc(var(--sab) + 24px);
  background:radial-gradient(120% 55% at 50% 38%,rgba(143,98,248,.16),transparent 62%),radial-gradient(90% 50% at 100% 100%,rgba(255,61,82,.14),transparent 60%),var(--bg)}

@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.lgbg{position:fixed;left:0;right:0;top:-60vh;bottom:-60vh;z-index:0;overflow:hidden;pointer-events:none}

async function searchTitles(q){

  try{
    const r=await tm("/3/search/multi",P);

  }catch(e){err=e;}
  try{
    const r=await Promise.all([tm("/3/search/movie",P).catch(()=>null),tm("/3/search/tv",P).catch(()=>null)]);

function fromTo(sr,T){const k=sr.width/T.w;return "translate("+(sr.left-T.x)+"px,"+(sr.top-T.y)+"px) scale("+k+")";}

(function(){

// Nel file ci sono solo sale + impronta PBKDF2 delle credenziali: nome utente e password non sono scritti in chiaro.
const AUTH_SALT="stasera-v1-e6a19200dd53b736",AUTH_HASH="9e9b0a27b4792394b2150ac7fb5694b5ddc96498063b88f8ec2bdfa2d253fd32",AUTH_KEY="stasera_auth";
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
async function authHash(u,p){
  const enc=new TextEncoder(),k=await crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(AUTH_SALT),iterations:200000,hash:"SHA-256"},k,256));
}
const isAuthed=()=>{try{return localStorage.getItem(AUTH_KEY)===AUTH_HASH;}catch(e){return false;}};
const lg=$("lg");
function lockApp(){
  document.body.classList.add("locked");lg.hidden=false;lg.style.top=lg.style.bottom=lg.style.height="";
  $("lgu").value="";$("lgp").value="";$("lge").textContent="";$("lgb").disabled=false;
  const c=$("lgf");c.classList.remove("bad","busy");
  if(!RM()&&lg.animate)lg.animate([{opacity:0,filter:"blur(14px)"},{opacity:1,filter:"blur(0)"}],{duration:600,easing:"cubic-bezier(.22,1,.36,1)"});
  setTimeout(()=>{try{$("lgu").focus();}catch(e){}},50);
}
function resetScroll(){try{scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;}catch(e){}}
function unlockApp(){
  document.body.classList.remove("locked");
  try{document.activeElement&&document.activeElement.blur();}catch(e){}
  resetScroll();[100,300,600,1000].forEach(t=>setTimeout(()=>{resetScroll();fit();},t));
  if(!RM()&&lg.animate){lg.animate([{opacity:1,filter:"blur(0)"},{opacity:0,filter:"blur(16px)"}],{duration:600,easing:"cubic-bezier(.4,0,.6,1)",fill:"forwards"}).onfinish=()=>{lg.hidden=true;lg.getAnimations().forEach(x=>x.cancel());};setTimeout(()=>{lg.hidden=true;},900);}
  else lg.hidden=true;
  home();   // la prima pagina compare con la sfocatura incrociata mentre il login svanisce
}
function doLogout(){
  try{localStorage.removeItem(AUTH_KEY);}catch(e){}
  Object.assign(S,{cat:"",fmt:"",mood:"",time:"",who:"",effort:"",era:"",style:"",step:0,seen:[],cands:[],cur:null});
  stage.innerHTML="";FIRST=true;
  lockApp();
}
let lgBusy=false;
$("lgf").addEventListener("submit",async e=>{
  e.preventDefault();if(lgBusy)return;lgBusy=true;
  const c=$("lgf"),er=$("lge"),btn=$("lgb");btn.disabled=true;er.textContent="";c.classList.remove("bad");c.classList.add("busy");const t0=Date.now();
  let ok=false,fail="";
  try{ok=(await authHash($("lgu").value,$("lgp").value))===AUTH_HASH;}
  catch(x){fail="Impossibile verificare l'accesso su questa connessione.";}
  await sleep(Math.max(0,1300-(Date.now()-t0)));   // il logo pulsa almeno un attimo, così si vede che sta entrando
  lgBusy=false;
  if(ok){try{localStorage.setItem(AUTH_KEY,AUTH_HASH);}catch(x){}unlockApp();return;}
  c.classList.remove("busy");btn.disabled=false;er.textContent=fail||"Nome utente o password non corretti.";
  void c.offsetWidth;c.classList.add("bad");$("lgp").value="";try{$("lgp").focus();}catch(x){}
});
/* avvio: aspetta font e primo disegno, poi parte l'animazione (altrimenti scatta mentre la pagina si carica) */
const boot=()=>{document.body.classList.remove("pre");if(isAuthed())home();else lockApp();};
const fontsOk=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,sleep(1200)]):Promise.resolve();
fontsOk.then(()=>requestAnimationFrame(()=>requestAnimationFrame(boot)));
let dp=null;const ib=$("ib");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;try{if(!localStorage.getItem("stasera_ix"))ib.hidden=false;}catch(x){ib.hidden=false;}});
$("ibtn").onclick=()=>{ib.hidden=true;if(dp){dp.prompt();dp=null;}};
$("ix").onclick=()=>{ib.hidden=true;try{localStorage.setItem("stasera_ix","1");}catch(x){}};
try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;if(ios&&!stand&&!localStorage.getItem("stasera_ix")){ib.querySelector("p").innerHTML="Per usarla come app: tocca <b>Condividi</b> ⬆️ e poi <b>Aggiungi a Home</b>.";$("ibtn").hidden=true;ib.hidden=false;}}catch(e){}
addEventListener("appinstalled",()=>{ib.hidden=true;});
})();
</script>
