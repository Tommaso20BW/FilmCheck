<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)], uniq=a=>[...new Set(a)], sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>\""]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const CATS={film:{l:"Film",ic:"🎬",sub:"dal grande cinema",c:"#ff3d52"},serie:{l:"Serie TV",ic:"📺",sub:"dal piccolo schermo",c:"#5ec8ff"},anime:{l:"Anime",ic:"⛩️",sub:"giapponesi: serie e film",c:"#9061f9"},cartoni:{l:"Cartoni",ic:"🧸",sub:"animazione e familiare",c:"#ffb74d"}};

  ["feelgood","😊","Leggero","Niente pensieri"],

  anime:[['short','⏱️','Fino a 13 eps'],['mid','🎬','Una stagione'],['long','🍿','Saga lunga'],['any','🔥','Tutto ok']],
  cartoni:[['short','⏱️','Veloce'],['mid','🎬','Normale'],['long','🍿','Lungo'],['any','🔥','Tutto ok']]
};
const STYLE=[['safe','🛋️','Sicuro'],['balanced','🍿','Equilibrato'],['surprise','🎲','Sorprendimi']];
const riskLabel=n=>n<=15?"Sul sicuro":n<=35?"Un po' di sorpresa":n<=60?"Equilibrio perfetto":n<=80?"Fuori dalle righe":"Sorpresa totale";
const G={
 film:{mood:{feelgood:["comedy film","family film"],laugh:["comedy film","romantic comedy film","romantic comedy"],love:["romance film","romantic drama film","romantic comedy film"],cry:["drama film","romance film"],scare:["horror film"],thrill:["action film","thriller film","adventure film"],mindbend:["mystery film","psychological thriller film","science fiction film"],epic:["fantasy film","science fiction film","adventure film"]},avoid:{horror:["horror film"],romance:["romance film","romantic comedy film"],violence:["horror film","war film","slasher film"],sex:["erotic film"]},heavy:["drama film","mystery film","war film"],light:["comedy film","family film","adventure film"]},
 serie:{mood:{feelgood:["Comedy","Family"],laugh:["Comedy"],love:["Romance"],cry:["Drama","Romance"],scare:["Horror"],thrill:["Action","Thriller","Crime"],mindbend:["Mystery","Thriller","Science-Fiction"],epic:["Fantasy","Science-Fiction","Adventure"]},avoid:{horror:["Horror"],romance:["Romance"],violence:["Horror","War","Crime"],sex:["Romance"]},heavy:["Drama","Mystery","War"],light:["Comedy","Family","Adventure"]},
 anime:{mood:{feelgood:["Comedy","Slice of Life"],laugh:["Comedy"],love:["Romance"],cry:["Drama","Romance"],scare:["Horror"],thrill:["Action","Suspense"],mindbend:["Mystery","Psychological","Suspense"],epic:["Fantasy","Adventure","Sci-Fi"]},avoid:{horror:["Horror"],romance:["Romance"],violence:["Horror","Gore"],sex:["Ecchi","Hentai"]},heavy:["Drama","Psychological","Mystery"],light:["Comedy","Slice of Life","Adventure"]}
};
const MOOD_TXT={feelgood:"qualcosa di leggero",laugh:"ridere",love:"una storia d'amore",cry:"commuoverti",scare:"avere paura",thrill:"azione e adrenalina",mindbend:"un colpo di scena assurdo",epic:"un'avventura epica"};
const WHO_TXT={solo:"da sola/o",partner:"in coppia",friends:"con gli amici",family:"con la famiglia",convince:"con chi va convinto"};
const S={cat:"film",step:0,a:null,cands:[],seen:[],cur:null};
const resetA=()=>({fmt:null,mood:"feelgood",effort:"1",time:"any",who:"solo",risk:55,avoid:[]});
const stage=$("stage");
function setProg(n,l){if($("bf")){$("bf").style.width=(n/6*100)+"%";$("bw").setAttribute("aria-valuenow",n);$("count").textContent=l||"";}}
function swap(h){stage.classList.remove("stage");void stage.offsetWidth;stage.classList.add("stage");stage.innerHTML=h;scrollTo(0,0)};

function gkey(cat,a){cat=cat==="cartoni"?(a&&a.fmt==="movie"?"film":"serie"):cat; return cat==="film"?"film":cat==="anime"?"anime":"serie";}
function optKey(){const c=S.cat,mv=S.a&&S.a.fmt==="movie";return c==="film"||(mv&&(c==="anime"||c==="cartoni"))?"film":c==="anime"?"anime":"serie";}
const without=(cat,a)=>{cat=gkey(cat,a); let w=[]; (a.avoid||[]).forEach(k=>{if(G[cat].avoid[k]) w=w.concat(G[cat].avoid[k]);}); if(a.who==="family") w=w.concat(cat==="film"?["horror film","erotic film","war film"]:cat==="anime"?["Horror","Ecchi","Hentai"]:["Horror","War","Crime"]); return uniq(w);};

function renderCats(){
  S.a = S.a || resetA();
  S.a.cat = S.cat;
  const selectedCat = S.cat;
  const selectedMood = S.a.mood || "feelgood";
  const selectedTime = S.a.time || "any";
  const selectedEffort = String(S.a.effort || "1");
  const selectedRisk = Number(S.a.risk || 55);
  const timeOptions = TIME_BY_CAT[selectedCat] || TIME_BY_CAT.film;
  const moodOptions = MOOD;
  const effortOptions = [['0','🛋️','Testa spenta'],['1','🍿','Equilibrato'],['2','🔥','Più coinvolgente']];

  const h = `
    <div class="q-wrap">
      <div class="q-header">
        <div>
          <h1>Trova qualcosa da guardare</h1>
          <p class="hint">4 scelte, una ricerca. Quasi come una app, non come un quiz.</p>
        </div>
        <div class="header-score">
          <span class="pill"><span class="dot"></span>${CATS[selectedCat].l}</span>
        </div>
      </div>
      <div class="quick-grid">
        <section class="choice-card full">
          <h2>Tipo</h2>
          <div class="choice-options">
            ${Object.keys(CATS).map(k=>`<button type="button" class="choice-btn ${selectedCat===k?'is-active':''}" data-group="cat" data-value="${k}"><span class="emoji">${CATS[k].ic}</span><span class="title">${CATS[k].l}</span><span class="sub">${CATS[k].sub}</span></button>`).join('')}
          </div>
        </section>
        <section class="choice-card">
          <h2>Vibe</h2>
          <div class="choice-options">
            ${moodOptions.map(([v,ic,title,sub])=>`<button type="button" class="choice-btn ${selectedMood===v?'is-active':''}" data-group="mood" data-value="${v}"><span class="emoji">${ic}</span><span class="title">${title}</span>${sub?`<span class="sub">${sub}</span>`:''}</button>`).join('')}
          </div>
        </section>
        <section class="choice-card">
          <h2>Tempo</h2>
          <div class="choice-options">
            ${timeOptions.map(([v,ic,title])=>`<button type="button" class="choice-btn ${selectedTime===v?'is-active':''}" data-group="time" data-value="${v}"><span class="emoji">${ic}</span><span class="title">${title}</span></button>`).join('')}
          </div>
        </section>
        <section class="choice-card single">
          <h2>Intensità</h2>
          <div class="choice-options">
            ${effortOptions.map(([v,ic,title])=>`<button type="button" class="choice-btn ${selectedEffort===v?'is-active':''}" data-group="effort" data-value="${v}"><span class="emoji">${ic}</span><span class="title">${title}</span></button>`).join('')}
          </div>
          <div class="range-wrap">
            <div class="range-row"><span>Livello sorpresa</span><b>${selectedRisk}</b></div>
            <input type="range" min="0" max="100" value="${selectedRisk}" id="risk-range" aria-label="Livello sorpresa">
            <div class="range-row"><span>${riskLabel(selectedRisk)}</span></div>
          </div>
        </section>
      </div>
      <div class="quick-actions">
        <button type="button" class="btn secondary" id="surprise-btn">🎲 Sorprendimi</button>
        <button type="button" class="btn primary" id="go-btn">Trova titolo</button>
      </div>

  swap(h);

  document.querySelectorAll('[data-group]').forEach(btn=>{
    btn.onclick=()=>{
      const group=btn.dataset.group, val=btn.dataset.value;
      if(group==='cat'){ S.cat=val; S.a = Object.assign(resetA(), {cat:val, mood:'feelgood', time:'any', effort:'1', risk:55}); renderCats(); return; }
      if(group==='mood'){ S.a.mood=val; renderCats(); }
      if(group==='time'){ S.a.time=val; renderCats(); }
      if(group==='effort'){ S.a.effort=val; renderCats(); }
    };
  });

  const range=$('#risk-range');
  if(range){
    range.oninput=()=>{
      S.a.risk=+range.value;
      renderCats();
    };
  }

  $('#go-btn').onclick=()=>{ S.seen=[]; S.cands=[]; run(false,true); };
  $('#surprise-btn').onclick=()=>run(true,false);
}

function loading(){
  const t = ["Cerco un titolo adatto a te...","Poi lo confronto con i tuoi gusti...","Uno secondo..." ];
  swap('<div class="q-wrap"><div class="loading" style="display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:220px;gap:20px;text-align:center"><svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><rect x="14" y="44" width="82" height="52" rx="8" fill="#1c1728" stroke="#9061f9" stroke-width="3"/><g class="arm"><rect x="26" y="26" width="18" height="42" rx="8" fill="#ff3d52" transform="rotate(-12 35 40)"/></g><path d="M28 64h54M33 76h44" stroke="#a7a0b7" stroke-width="3" stroke-linecap="round"/><g opacity=".9"><circle cx="60" cy="48" r="4" fill="#f5c451"/></g></svg><p style="margin:0;font-family:var(--fd);font-size:1.4rem;">'+esc(t[0])+'</p><div class="mini-label">in corso</div></div></div>');
  let i=0; const p=stage.querySelector('p');

function showError(e){
  const off=navigator.onLine===false, empty=e&&e.message==="EMPTY";
  const msg=off?"Sembra che il telefono sia offline: controlla la connessione e riprova.":empty?"Nessun titolo trovato con queste regole. Prova a cambiare un po' le preferenze.":"Non riesco a trovare un risultato adesso.";
  swap('<div class="q-wrap"><div style="display:flex;flex-direction:column;gap:16px"><h2 style="margin:0;font-family:var(--fd);font-size:2rem;line-height:1">Qualcosa non va</h2><p style="margin:0;color:var(--mut)">'+esc(msg)+'</p>'+(empty||off?'':'<small style="color:var(--mut);word-break:break-all">Dettaglio: '+esc(e&&e.message||'errore')+'</small>')+'<div class="quick-actions"><button type="button" class="btn secondary" id="retry-btn">Riprova</button><button type="button" class="btn primary" id="back-btn">Modifica</button></div></div></div>');
  $('#retry-btn').onclick=()=>{S.seen=[];S.cands=[];run(false,true)};
  $('#back-btn').onclick=renderCats;
}

const LOAD={film:["Sfoglio l'archivio...","Controllo i generi...","Ci siamo quasi..."],serie:["Sfoglio il palinsesto...","Controllo le stagioni...","Ci siamo quasi..."],anime:["Sfoglio il catalogo anime...","Controllo i generi...","Ci siamo quasi..."]};
const KW=/film|serie|anime|televisiv|animazione|manga|telefilm|sitcom/i;
const VALS=l=>l.map(x=>'"'+x+'"@en').join(' ');
function fj(url,ms,opts){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);return fetch(url,Object.assign({signal:c.signal},opts||{})).then(r=>{clearTimeout(t);if(r.status===429){const e=new Error("429");e.retry=1;throw e;}if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).catch(e=>{clearTimeout(t);throw e;});}
const fjr=(url,ms)=>fj(url,ms).catch(e=>e&&e.retry?sleep(1000).then(()=>fj(url,ms)):Promise.reject(e));
const without=(cat,a)=>{cat=gkey(cat,a);let w=[]; (a.avoid||[]).forEach(k=>{if(G[cat].avoid[k]) w=w.concat(G[cat].avoid[k]);}); if(a.who==="family") w=w.concat(cat==="film"?["horror film","erotic film","war film"]:cat==="anime"?["Horror","Ecchi","Hentai"]:["Horror","War","Crime"]); return uniq(w);};
function tier(list,tests){let last=[]; for(const t of tests){const r=list.filter(t); if(r.length>=5) return r; if(r.length) last=r;} return last.length ? last : list;}
const wsum=t=>fjr("https://it.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.trim().replace(/\s+/g,"_")),8000);
async function enrich(title,kind){const ok=r=>r&&r.extract&&r.type!=='disambiguation'&&KW.test(r.extract.slice(0,300)); const out=r=>({extract:r.extract,thumb:r.thumbnail&&r.thumbnail.source}); try{const r=await wsum(title); if(ok(r)) return out(r);}catch(e){} try{const s=await fjr("https://it.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=3&srsearch="+encodeURIComponent(title+" "+kind),8000); for(const x of (s.query&&s.query.search)||[]){try{const r=await wsum(x.title); if(ok(r)) return out(r);}catch(e){}}}catch(e){} return null; }

async function wdFilms(a,strict,anim){const wn=without("film",a); let genres=(G.film.mood[a.mood]||["drama film"]).filter(x=>wn.indexOf(x)<0&&x!=="animated film"); if(!anim&&!genres.length) genres=["drama film","comedy film"]; const useMood=anim?(strict&&genres.length>0):true; const minL=Math.max(2,Math.round((a.risk<30?40:a.risk<60?18:a.risk<80?8:3)/(strict?1:3)/(anim?2:1))); const AN='?film wdt:P136 ?ga. ?ga rdfs:label "animated film"@en. '; const q="SELECT ?film ?filmLabel ?sl ?d ?rt ?img WHERE{"+(useMood?"VALUES ?gl{"+VALS(genres)+"} ?g rdfs:label ?gl. ?film wdt:P136 ?g. ":"")+"?film wdt:P31 wd:Q11424; wikibase:sitelinks ?sl. FILTER(?sl>="+minL+") "+(anim?AN+"FILTER NOT EXISTS{?film wdt:P495 wd:Q17} ":"FILTER NOT EXISTS{"+AN+"} ")+(strict&&wn.length?"FILTER NOT EXISTS{?film wdt:P136 ?b. ?b rdfs:label ?bl. VALUES ?bl{"+VALS(wn)+"}} ":"")+"OPTIONAL{?film wdt:P577 ?d} OPTIONAL{?film wdt:P2047 ?rt} OPTIONAL{?film wdt:P18 ?img} SERVICE wikibase:label{bd:serviceParam wikibase:language \"it,en\"}} LIMIT 200"; const seen={},out=[]; (await sparql(q)).forEach(b=>{const id=b.film.value.split("/").pop(),t=b.filmLabel&&b.filmLabel.value;if(seen[id]||!t||/^Q\d+$/.test(t))return;seen[id]=1; out.push({id,title:t,year:b.d?b.d.value.slice(0,4):"",sl:+b.sl.value,runtime:b.rt?Math.round(+b.rt.value):null,img:b.img?b.img.value.replace(/^http:/,"https:")+"?width=500":null,genres:useMood?genres:[],movie:true});}); return out; }
async function wpFilms(a,anim){const wn=without("film",a),term=anim?'"film d\'animazione" -giapponese':MOOD_TXT[a.mood]+(wn.indexOf("horror film")>=0?" -horror":""); const url="https://it.wikipedia.org/w/api.php?action=query&generator=search&format=json&origin=*&gsrnamespace=0&gsrlimit=30&gsroffset="+rand(200)+"&gsrsearch="+encodeURIComponent('hastemplate:Film "è un film" '+term)+"&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=4&exlimit=30&piprop=thumbnail&pithumbsize=500"; const d=await fj(url,12000),p=d.query&&d.query.pages?Object.values(d.query.pages):[]; return p.filter(x=>x.extract&&/film/i.test(x.extract.slice(0,200))).map(x=>({id:"wp"+x.pageid,title:x.title.replace(/\s*\(film.*\)$/,""),year:(x.extract.match(/\b(19|20)\d\d\b/)||[""])[0],sl:10,runtime:null,genres:[],movie:true,pre:{extract:x.extract,thumb:x.thumbnail&&x.thumbnail.source}}));}
async function filmDiscover(a,anim){ let list=[],err=null; try{list=await wdFilms(a,true,anim); const rtMin=a.time==="mid"?85:a.time==="long"?115:0, rtMax=a.time==="short"?95:a.time==="mid"?125:a.avoid.indexOf("long")>=0?130:999, ym=a.avoid.indexOf("old")>=0?1995:0; const mx=a.avoid.indexOf("long")>=0?Math.min(rtMax,130):rtMax; list=tier(list,[m=>(!m.runtime||(m.runtime>=rtMin&&m.runtime<=mx))&&(!ym||!m.year||+m.year>=ym),m=>!ym||!m.year||+m.year>=ym,()=>true]); }catch(e){err=e;} if(list.length<5){try{list=list.concat(await wdFilms(a,false,anim))}catch(e){err=err||e;}} if(list.length<3){try{list=list.concat(await wpFilms(a,anim))}catch(e){err=err||e;}} if(!list.length&&err) throw err; return list; }
async function wdMeta(id){ if(!/^Q\d+$/.test(id)) return {}; try{const q='SELECT ?gl ?dl WHERE{OPTIONAL{wd:'+id+' wdt:P136 ?g. ?g rdfs:label ?gl. FILTER(LANG(?gl)="it")} OPTIONAL{wd:'+id+' wdt:P57 ?dr. ?dr rdfs:label ?dl. FILTER(LANG(?dl)="en")}}'; const rows=await Promise.race([sparql(q),sleep(8000).then(()=>{throw new Error("t")})]); const gl=[],dr=[]; rows.forEach(b=>{if(b.gl) gl.push(b.gl.value.replace(/^film\s+(di\s+|d['’]\s*)?/i,"")); if(b.dl) dr.push(b.dl.value);}); return{glist:uniq(gl).slice(0,4),dir:uniq(dr).slice(0,2).join(", ")};}catch(e){return{}} }

function fmtMin(m){return m>=60?Math.floor(m/60)+" h"+(m%60?" "+String(m%60).padStart(2,'0'):""):m+" min";}
const GIT={"Comedy":"Commedia","Drama":"Drammatico","Romance":"Sentimentale","Horror":"Horror","Action":"Azione","Adventure":"Avventura","Fantasy":"Fantasy","Science-Fiction":"Fantascienza","Sci-Fi":"Fantascienza","Mystery":"Mistero","Thriller":"Thriller","Suspense":"Suspense","Slice of Life":"Vita quotidiana","Psychological":"Psicologico","Family":"Famiglia","Crime":"Crimine"};
const itg=a=>uniq((a||[]).map(x=>GIT[x]||x));
