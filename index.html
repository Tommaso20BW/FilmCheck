  serie:[["short","⏱️","Un episodio e via"],["mid","🎬","Un paio di episodi"],["long","🍿","Binge watching"],["any","🔥","Non mi importa"]],

 {id:"who",q:"Con chi lo guardi?",o:[["solo","👤","Da sola/o"],["partner","❤️","Con il/la partner"],["friends","👯","Con gli amici"],["family","👨‍👩‍👧‍👦","Con la famiglia"],["convince","😈","Con qualcuno difficile da accontentare"]]},

const G={
 film:{mood:{feelgood:["comedy film","family film","animated film"],laugh:["comedy film","romantic comedy film","romantic comedy"],love:["romance film","romantic drama film","romantic comedy film"],cry:["drama film","romance film"],scare:["horror film"],thrill:["action film","thriller film","adventure film"],mindbend:["mystery film","psychological thriller film","psychological thriller","science fiction film"],epic:["fantasy film","science fiction film","adventure film"]},

  avoid:{horror:["Horror"],romance:["Romance"],violence:["Horror","War","Crime"],sex:["Romance"]},heavy:["Drama","Mystery","War"],light:["Comedy","Family","Adventure"]},

  avoid:{horror:["Horror"],romance:["Romance"],violence:["Horror","Gore"],sex:["Ecchi","Hentai"]},heavy:["Drama","Psychological","Mystery"],light:["Comedy","Slice of Life","Adventure"]}
};

function fj(url,ms,opts){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);

}

/* ---------- Italiano da Wikipedia ---------- */
const KW=/film|serie|anime|televisiv|animazione|manga|telefilm|sitcom/i;
const wsum=t=>fjr("https://it.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.trim().replace(/\s+/g,"_")),8000);
async function enrich(title,kind){
  const ok=r=>r&&r.extract&&r.type!=="disambiguation"&&KW.test(r.extract.slice(0,300));
  const out=r=>({extract:r.extract,thumb:r.thumbnail&&r.thumbnail.source});

    for(const x of (s.query&&s.query.search)||[]){try{const r=await wsum(x.title);if(ok(r))return out(r)}catch(e){}}
  }catch(e){}

async function sparql(q){const d=await fj("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(q),30000);return(d.results&&d.results.bindings)||[]}
const vals=l=>l.map(x=>'"'+x+'"@en').join(" ");
async function wdFilms(a,strict){
  const g=G.film,wn=without("film",a),genres=(g.mood[a.mood]||["drama film"]).filter(x=>wn.indexOf(x)<0);
  const minL=(a.risk<30?40:a.risk<60?18:a.risk<80?8:3)/(strict?1:3);
  const q="SELECT ?film ?filmLabel ?sl ?d ?rt WHERE{VALUES ?gl{"+vals(genres.length?genres:["drama film","comedy film"])+"} ?g rdfs:label ?gl. ?film wdt:P31 wd:Q11424; wdt:P136 ?g; wikibase:sitelinks ?sl. FILTER(?sl>="+Math.max(2,Math.round(minL))+") "+
   (strict&&wn.length?"FILTER NOT EXISTS{?film wdt:P136 ?b. ?b rdfs:label ?bl. VALUES ?bl{"+vals(wn)+"}} ":"")+
   "OPTIONAL{?film wdt:P577 ?d} OPTIONAL{?film wdt:P2047 ?rt} SERVICE wikibase:label{bd:serviceParam wikibase:language \"it,en\"}} LIMIT 200";
  const seen={},out=[];
  (await sparql(q)).forEach(b=>{const id=b.film.value.split("/").pop(),t=b.filmLabel&&b.filmLabel.value;if(seen[id]||!t||/^Q\d+$/.test(t))return;seen[id]=1;
    out.push({id,title:t,year:b.d?b.d.value.slice(0,4):"",sl:+b.sl.value,runtime:b.rt?Math.round(+b.rt.value):null,genres:genres})});

}

   "&gsrsearch="+encodeURIComponent('hastemplate:Film "è un film" '+MOOD_IT[a.mood]+neg)+"&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=4&exlimit=30&piprop=thumbnail&pithumbsize=500";
  const d=await fj(url,12000),p=d.query&&d.query.pages?Object.values(d.query.pages):[];
  return p.filter(x=>x.extract&&/film/i.test(x.extract.slice(0,200))).map(x=>({id:"wp"+x.pageid,title:x.title.replace(/\s*\(film.*\)$/,""),year:(x.extract.match(/\b(19|20)\d\d\b/)||[""])[0],sl:10,runtime:null,genres:G.film.mood[a.mood],pre:{extract:x.extract,thumb:x.thumbnail&&x.thumbnail.source}}));
}
async function filmDiscover(a){
  const g=G.film;let list=[],err=null;
  try{list=await wdFilms(a,true);
    const rtMin=a.time==="mid"?85:a.time==="long"?115:0,rtMax=a.time==="short"?95:a.time==="mid"?125:a.avoid.indexOf("long")>=0?130:999,ym=a.avoid.indexOf("old")>=0?1995:0;
    if(a.avoid.indexOf("long")>=0&&a.time!=="short"&&a.time!=="mid")list=list; // gestito sotto
    const mx=a.avoid.indexOf("long")>=0?Math.min(rtMax,130):rtMax;
    list=tier(list,[m=>(!m.runtime||(m.runtime>=rtMin&&m.runtime<=mx))&&(!ym||!m.year||+m.year>=ym),m=>!ym||!m.year||+m.year>=ym,()=>true]);
  }catch(e){err=e}
  if(list.length<5){try{list=list.concat(await wdFilms(a,false))}catch(e){err=err||e}}
  if(list.length<3){try{list=list.concat(await wpFilms(a))}catch(e){err=err||e}}
  if(!list.length&&err)throw err;
  return list;
}
async function filmDetails(c){
  const w=c.pre||await enrich(c.title,"film");
  return{title:c.title,year:c.year,runtime:c.runtime,overview:(w&&w.extract)||"Trama non ancora disponibile su Wikipedia in italiano.",it:!!(w&&w.extract),poster:w&&w.thumb,pop:c.sl};
}

/* ---------- SERIE TV: TVmaze ---------- */
async function tvDiscover(a){
  const wn=without("serie",a),want=G.serie.mood[a.mood]||["Drama","Comedy"],ym=a.avoid.indexOf("old")>=0?1995:0;
  const pages=uniq(Array.from({length:6},()=>rand(240)));
  const lists=await Promise.all(pages.map(p=>fjr("https://api.tvmaze.com/shows?page="+p,9000).catch(()=>[])));
  const all=[].concat(...lists);
  if(!all.length)throw new Error("rete/TVmaze non raggiungibile");
  const items=all.filter(s=>s.genres&&s.genres.length).map(s=>({id:s.id,title:s.name,year:s.premiered?s.premiered.slice(0,4):"",genres:s.genres,rating:s.rating&&s.rating.average,runtime:s.averageRuntime||s.runtime,image:s.image&&(s.image.original||s.image.medium),summary:strip(s.summary),lang:s.language}));
  const ov=m=>m.genres.some(x=>want.indexOf(x)>=0), bad=m=>m.genres.some(x=>wn.indexOf(x)>=0);
  return tier(items,[
    m=>ov(m)&&!bad(m)&&(!ym||!m.year||+m.year>=ym)&&m.rating>=6.5&&(a.risk>=60||m.lang==="English"||m.lang==="Italian"),
    m=>ov(m)&&!bad(m)&&(!ym||!m.year||+m.year>=ym)&&(!m.rating||m.rating>=5.5),
    m=>ov(m)&&!bad(m), m=>ov(m)]);
}
async function tvDetails(c){const w=await enrich(c.title,"serie televisiva");
  return{title:c.title,year:c.year,runtime:c.runtime,overview:(w&&w.extract)||c.summary||"Trama non disponibile.",it:!!(w&&w.extract),poster:(w&&w.thumb)||c.image,rl:"TVmaze",rv:c.rating,gt:(c.genres||[]).join(" · ")}}

/* ---------- ANIME: Jikan, una richiesta per genere (evita l'AND dei generi) ---------- */
const JID={"Action":1,"Adventure":2,"Comedy":4,"Drama":8,"Fantasy":10,"Horror":14,"Mystery":7,"Romance":22,"Sci-Fi":24,"Slice of Life":36,"Supernatural":37,"Suspense":41,"Psychological":40,"Ecchi":9,"Hentai":12,"Gore":58};
const KIT={"Action":"action","Adventure":"adventure","Comedy":"comedy","Drama":"drama","Fantasy":"fantasy","Horror":"horror","Mystery":"mystery","Romance":"romance","Sci-Fi":"science-fiction","Slice of Life":"slice-of-life","Supernatural":"supernatural","Suspense":"thriller","Psychological":"psychological"};
async function jr(url){for(let i=0;i<3;i++){try{return await fj(url,12000)}catch(e){if(i===2)throw e;await sleep(1300*(i+1))}}}
async function jikanItems(want,ex){
  const out=[];let err=null;
  for(let i=0;i<want.length;i++){
    if(i)await sleep(750);
    const u=new URL("https://api.jikan.moe/v4/anime");
    u.searchParams.set("genres",JID[want[i]]);if(ex)u.searchParams.set("genres_exclude",ex);
    u.searchParams.set("order_by","score");u.searchParams.set("sort","desc");u.searchParams.set("min_score","6.3");u.searchParams.set("page",1+rand(3));u.searchParams.set("limit","25");u.searchParams.set("sfw","true");
    try{const r=await jr(u.toString());(r.data||[]).forEach(m=>out.push({id:m.mal_id,title:m.title_english||m.title,year:(m.aired&&m.aired.prop&&m.aired.prop.from&&m.aired.prop.from.year)||"",genres:(m.genres||[]).concat(m.themes||[]).map(g=>g.name),rating:m.score,episodes:m.episodes,image:m.images&&m.images.jpg&&(m.images.jpg.large_image_url||m.images.jpg.image_url),summary:m.synopsis}))}catch(e){err=e}
  }
  if(!out.length&&err)throw err;return out;
}
async function kitsuItems(want){
  const out=[];let err=null;
  for(const g of want){const slug=KIT[g];if(!slug)continue;
    try{const r=await fj("https://kitsu.io/api/edge/anime?filter[categories]="+slug+"&sort=-averageRating&page[limit]=20&page[offset]="+rand(4)*20,12000);
      (r.data||[]).forEach(x=>{const t=x.attributes;if(t.nsfw)return;out.push({id:"k"+x.id,title:(t.titles&&(t.titles.en||t.titles.en_us))||t.canonicalTitle,year:t.startDate?+t.startDate.slice(0,4):"",genres:[g],rating:t.averageRating?+t.averageRating/10:null,episodes:t.episodeCount,image:t.posterImage&&(t.posterImage.large||t.posterImage.medium),summary:t.synopsis})})}catch(e){err=e}}
  if(!out.length&&err)throw err;return out;
}
async function animeDiscover(a){
  const wn=without("anime",a);
  let want=(G.anime.mood[a.mood]||["Drama"]).filter(x=>JID[x]&&wn.indexOf(x)<0).slice(0,3);if(!want.length)want=["Comedy"];
  const ex=wn.filter(x=>JID[x]).map(x=>JID[x]).join(","),ym=a.avoid.indexOf("old")>=0?1995:0;
  const epMax=a.time==="short"?13:a.time==="mid"?26:a.avoid.indexOf("long")>=0?26:0;
  let all=[],e1=null;
  try{all=await jikanItems(want,ex)}catch(e){e1=e}
  if(!all.length){try{all=await kitsuItems(want)}catch(e){throw new Error("Jikan: "+(e1&&e1.message||"nessun dato")+" / Kitsu: "+e.message)}}
  const seen={},items=all.filter(m=>{if(seen[m.id])return false;seen[m.id]=1;return true});
  const ep=m=>!epMax||!m.episodes||m.episodes<=epMax,yr=m=>!ym||!m.year||m.year>=ym;
  return tier(items,[m=>ep(m)&&yr(m)&&m.rating>=7,m=>ep(m)&&yr(m),ep,()=>true]);
}
async function animeDetails(c){const w=await enrich(c.title,"anime");
  return{title:c.title,year:c.year,episodes:c.episodes,overview:(w&&w.extract)||c.summary||"Trama non disponibile.",it:!!(w&&w.extract),poster:(w&&w.thumb)||c.image,rl:"MyAnimeList",rv:c.rating,gt:(c.genres||[]).join(" · ")}}

const SRC={film:{d:filmDiscover,t:filmDetails},serie:{d:tvDiscover,t:tvDetails},anime:{d:animeDiscover,t:animeDetails}};

/* ---------- Punteggio ---------- */
const hit=(g,w)=>g&&w&&g.some(x=>w.indexOf(x)>=0)?1:0;
const mainstream=(cat,m)=>cat==="film"?Math.max(0,Math.min(1,Math.log10(Math.max(2,m.sl))/2.6)):m.rating?Math.max(0,Math.min(1,(m.rating-4)/5)):.4;
function score(cat,m,a){
  const g=m.genres||[],gs=G[cat],ms=mainstream(cat,m),e=+a.effort;
  const heavy=g.some(x=>gs.heavy.indexOf(x)>=0)||(m.rating||0)>=8.3,light=g.some(x=>gs.light.indexOf(x)>=0);
  return 45*hit(g,gs.mood[a.mood])+20*(e===2?(heavy?1:.3):e===0?(light?1:.3):.75)+20*Math.max(0,1-Math.abs((1-ms)*100-a.risk)/70)+15*(cat==="film"?ms:m.rating?Math.max(0,Math.min(1,(m.rating-5)/4)):.5)+Math.random()*6;
}
const pct=s=>Math.round(Math.min(98,52+46*Math.pow(Math.max(0,s)/100,1.3)));

/* ---------- Schermate ---------- */
function renderCats(){
  $("pill").hidden=true;setProg(0,"");
  let h='<h1 class="q">Cosa guardiamo stasera?</h1><p class="hint">Scegli il tipo di titolo, poi rispondi a qualche domanda veloce.</p><div class="grid" id="cg">';
  Object.keys(CATS).forEach(k=>{const c=CATS[k];h+='<button type="button" class="card" data-v="'+k+'" style="--c:'+c.c+'"><span class="ic" aria-hidden="true">'+c.ic+'</span><strong>'+c.l+'</strong><small>'+esc(c.sub)+'</small></button>'});
  swap(h+"</div>");
  $("cg").onclick=e=>{const b=e.target.closest(".card");if(!b)return;S.cat=b.dataset.v;S.step=0;S.a=resetA();S.cands=[];S.seen=[];renderStep()};
}
function renderStep(){
  const cat=CATS[S.cat],st=STEPS[S.step];
  $("pill").hidden=false;$("pdot").style.background=cat.c;$("pname").textContent=cat.l;setProg(S.step+1,(S.step+1)+"/"+TOTAL);
  const opts=st.byCat?st.byCat[S.cat]:st.o;
  let h='<h1 class="q">'+esc(st.q)+"</h1>";
  if(st.slider){const r=S.a.risk;
    h+='<p class="hint">Più sale il cursore, più il titolo sarà lontano da ciò che guardi di solito.</p><div class="sl"><div class="rn"><span id="rn">'+r+'</span><sup>%</sup></div><div class="rt" id="rt">'+esc(riskLabel(r))+'</div><input type="range" id="risk" min="0" max="100" value="'+r+'" aria-label="Livello di sorpresa"><div class="ends"><span>Sul sicuro</span><span>Fuori dagli schemi</span></div></div>';
  }else{
    if(st.multi)h+='<p class="hint">Puoi sceglierne più di una.</p>';
    h+='<div class="opts'+(st.two?" two":"")+'" id="opts">';
    opts.forEach(o=>{const on=st.multi?S.a.avoid.indexOf(o[0])>=0:S.a[st.id]===o[0];
      h+='<button type="button" class="opt" data-v="'+o[0]+'" aria-pressed="'+on+'"><span class="emo" aria-hidden="true">'+o[1]+'</span><span class="lab"><strong>'+esc(o[2])+"</strong>"+(o[3]?"<small>"+esc(o[3])+"</small>":"")+"</span></button>"});
    h+="</div>";
  }
  h+='<div class="nav"><button type="button" class="btn g" id="back">← Indietro</button>'+(st.slider?'<button type="button" class="btn p cta" id="next">Avanti →</button>':"")+(st.multi?'<button type="button" class="btn p cta" id="go">'+cat.ic+" Trova il mio titolo</button>":"")+"</div>";
  swap(h);
  $("back").onclick=()=>{if(S.step>0){S.step--;renderStep()}else renderCats()};
  if(st.slider){const rg=$("risk");rg.oninput=()=>{S.a.risk=+rg.value;$("rn").textContent=rg.value;$("rt").textContent=riskLabel(+rg.value)};$("next").onclick=()=>{S.step++;renderStep()};return}
  const box=$("opts");
  box.onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const v=b.dataset.v;
    if(st.multi){let av=S.a.avoid;if(v==="none")av=av.indexOf("none")>=0?[]:["none"];else{av=av.filter(x=>x!=="none");const i=av.indexOf(v);i>=0?av.splice(i,1):av.push(v)}S.a.avoid=av;
      [].forEach.call(box.children,c=>c.setAttribute("aria-pressed",av.indexOf(c.dataset.v)>=0))}
    else{S.a[st.id]=v;[].forEach.call(box.children,c=>c.setAttribute("aria-pressed",c===b));setTimeout(()=>{S.step++;renderStep()},260)}};
  if(st.multi)$("go").onclick=()=>{S.seen=[];S.cands=[];run(false,true)};
}
function loading(){
  setProg(TOTAL,TOTAL+"/"+TOTAL);const t=LOAD[S.cat];
  swap('<div class="loading"><svg class="clap" viewBox="0 0 110 110" aria-hidden="true"><rect x="14" y="44" width="82" height="52" rx="6" fill="#1f1929" stroke="#9061f9" stroke-width="3"/><g class="arm"><rect x="14" y="26" width="82" height="16" rx="4" fill="#f4effa"/><path d="M26 26l10 16M46 26l10 16M66 26l10 16M86 26l10 16" stroke="#ff3d52" stroke-width="7"/></g><path d="M28 66h54M28 78h36" stroke="#a89fba" stroke-width="3" stroke-linecap="round"/></svg><p id="lt" aria-live="polite">'+t[0]+"</p></div>");
  let i=0;const lt=$("lt"),iv=setInterval(()=>{i=(i+1)%t.length;if(lt.isConnected)lt.textContent=t[i]},1300);return()=>clearInterval(iv);
}
function showError(e){
  const off=navigator.onLine===false,empty=e&&e.message==="EMPTY";
  const msg=off?"Sembra che il telefono sia offline: controlla la connessione e riprova.":empty?"Nessun titolo trovato con queste regole. Togli qualche esclusione o alza il livello di sorpresa.":"Non riesco a contattare la fonte dati ("+CATS[S.cat].l+"). Può essere un intoppo momentaneo: riprova tra qualche secondo.";
  setProg(TOTAL,"");
  swap('<div class="err"><h2>Qualcosa non va</h2><p style="margin:0">'+esc(msg)+"</p>"+(empty||off?"":"<small>Dettaglio: "+esc(e&&e.message||"errore")+"</small>")+'<div class="nav" style="margin:0"><button class="btn p" id="retry">Riprova</button><button class="btn g" id="tq">Torna al quiz</button></div></div>');
  $("retry").onclick=()=>{S.seen=[];S.cands=[];run(false,true)};$("tq").onclick=()=>{S.step=TOTAL-1;renderStep()};
}

/* ---------- Flusso ---------- */
async function rank(a){
  const list=await SRC[S.cat].d(a);
  if(!list||!list.length)throw new Error("EMPTY");
  return list.map(m=>({m,s:score(S.cat,m,a)})).sort((x,y)=>y.s-x.s);
}
const pickFrom=(r,sur)=>{const p=r.filter(x=>S.seen.indexOf(x.m.id)<0);if(!p.length)return null;return sur?pick(p.slice(0,10)):p[0]};
async function run(surprise,fresh){
  const stop=loading(),wait=sleep(1800);
  try{
    let ranked=null,cand=null;
    if(!fresh&&!surprise)cand=pickFrom(S.cands,false);
    if(!cand){
      const a=surprise?Object.assign({},S.a,{risk:Math.max(S.a.risk+30,85)}):S.a;
      ranked=await rank(a);if(!surprise)S.cands=ranked;
      cand=pickFrom(ranked,surprise)||pick(ranked);
    }
    let d,tries=0;
    for(;;){
      S.seen.push(cand.m.id);d=await SRC[S.cat].t(cand.m);
      if(S.cat!=="film"||d.it||tries++>=4)break;
      const pool=ranked||S.cands,nx=pickFrom(pool,false);if(!nx)break;cand=nx;
    }
    await wait;stop();show({d,m:cand.m,s:cand.s},surprise);
  }catch(e){await wait;stop();showError(e)}
}
const hue=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h};
const fbPoster=(t,y)=>{const h=hue(t);return'<div class="poster fb" role="img" aria-label="Copertina non disponibile" style="background:linear-gradient(165deg,hsl('+h+' 72% 42%),hsl('+((h+55)%360)+' 60% 14%) 85%)"><small>Stasera</small><h3>'+esc(t)+"</h3><em style=\"font-style:normal\">"+esc(y||"")+"</em></div>"};
function why(r,sur){
  const a=S.a,g=r.m.genres||[],o=[];
  if(sur)o.push("È una scelta volutamente fuori dai tuoi binari, come hai chiesto.");
  o.push(hit(g,G[S.cat].mood[a.mood])?"Stasera volevi "+MOOD_TXT[a.mood]+" e questo titolo punta dritto lì.":"Non è la scelta più ovvia per chi vuole "+MOOD_TXT[a.mood]+", ma si sposa bene con il resto delle tue risposte.");
  const e=+a.effort;o.push(e===2?"Hai chiesto qualcosa che ti lasci un segno, non solo intrattenimento passeggero.":e===0?"Per spegnere il cervello e divertirti, è facile da seguire.":"Ha il giusto equilibrio tra storia e leggerezza che cercavi.");
  o.push("Funziona bene "+WHO_TXT[a.who]+".");return o.join(" ");
}
function verdict(d){
  if(S.cat==="film")return d.pop>=10?"Un film abbastanza noto da avere pagine Wikipedia in "+d.pop+" lingue diverse.":"Un film da scoprire, lontano dai titoli più battuti.";
  const v=d.rv;if(!v)return"Un titolo che vale la pena scoprire, anche se non ha ancora un voto consolidato.";
  return(v>=8?"Uno dei titoli più amati dal pubblico":v>=7?"Un titolo che piace davvero":"Un titolo che divide, nel modo giusto")+": "+(+v).toFixed(1)+" su 10 ("+d.rl+").";
}
function show(r,sur){
  S.cur=r;const d=r.d;let p=pct(r.s);if(sur)p=Math.max(60,p-6);
  setProg(TOTAL,"Fatto");
  const poster=d.poster?'<div class="poster"><img id="pimg" src="'+esc(d.poster)+'" alt="Copertina di '+esc(d.title)+'" referrerpolicy="no-referrer"></div>':fbPoster(d.title,d.year);
  let ch="";
  if(d.year)ch+='<span class="chip">'+esc(d.year)+"</span>";
  if(d.runtime)ch+='<span class="chip">'+d.runtime+(S.cat==="film"?" min":" min/ep")+"</span>";
  if(d.episodes)ch+='<span class="chip">'+d.episodes+" episodi</span>";
  if(d.rv)ch+='<span class="chip r">'+d.rl+" "+(+d.rv).toFixed(1)+"</span>";
  const h='<div class="res">'+(sur?'<span class="tag">🎲 Fuori dalla tua comfort zone</span>':"")+'<div class="hero">'+poster+'<div class="meta"><h2>'+esc(d.title)+'</h2><div class="chips">'+ch+"</div>"+(d.gt?'<div class="chips"><span class="chip">'+esc(d.gt)+"</span></div>":"")+
   '<div class="compat"><b>⭐ Compatibilità '+p+'%</b><div class="meter"><span style="width:'+p+'%"></span></div></div></div></div>'+
   '<section class="block"><h3>Perché fa per te</h3><p>'+esc(why(r,sur))+"</p></section>"+
   '<section class="block"><h3>Trama</h3><p>'+esc(d.overview)+'</p><p class="src">'+(d.it?"📖 Fonte: Wikipedia in italiano":"📖 Sinossi originale (nessuna voce italiana trovata)")+"</p></section>"+
   '<section class="block v"><h3>Il verdetto</h3><p>“'+esc(verdict(d))+'”</p></section>'+
   '<div class="row"><button class="btn" id="sur">🎲 Sorprendimi</button><button class="btn" id="oth">🔄 Un altro titolo</button><button class="btn" id="rst">'+CATS[S.cat].ic+" Cambia categoria</button></div></div>";
  swap(h);scrollTo(0,0);
  const im=$("pimg");if(im)im.onerror=()=>{im.parentNode.outerHTML=fbPoster(d.title,d.year)};
  $("oth").onclick=()=>run(false,false);$("sur").onclick=()=>run(true,false);$("rst").onclick=renderCats;
}
renderCats();

/* ---------- Banner "installa" ---------- */
let dp=null;const ib=$("ib");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;try{if(!localStorage.getItem("stasera_ix"))ib.hidden=false}catch(x){ib.hidden=false}});
$("ibtn").onclick=()=>{ib.hidden=true;if(dp){dp.prompt();dp=null}};
$("ix").onclick=()=>{ib.hidden=true;try{localStorage.setItem("stasera_ix","1")}catch(x){}};
addEventListener("appinstalled",()=>{ib.hidden=true});
})();
