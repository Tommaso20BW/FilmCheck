<style>
:root{
  --bg:#0b0911;--panel:#15121f;--panel-2:#1c1829;--line:#2a2540;
  --fg:#f4effa;--mut:#9d96ae;--red:#ff3d52;--vio:#9061f9;--gold:#f5c451;
  --r:16px;
  --fd:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --fb:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none}
body{
  margin:0;position:relative;height:var(--app-h,100%);display:flex;flex-direction:column;
  font:16px/1.45 var(--fb);color:var(--fg);
  background:radial-gradient(800px 420px at 90% -10%,rgba(144,97,249,.22),transparent 60%) no-repeat,
             radial-gradient(600px 360px at -10% 105%,rgba(255,61,82,.14),transparent 65%) no-repeat,var(--bg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* struttura app: header / contenuto / barra azioni */
.top{flex:none;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 10px}
.brand{font-family:var(--fd);font-weight:800;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--red)}
#stage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  width:100%;max-width:560px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right))}
#barhost{flex:none;position:relative;z-index:5}
.bar{border-top:1px solid var(--line);background:rgba(11,9,17,.96);
  padding:12px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:10px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}

/* pagina di scelta: una domanda, opzioni in elenco, riempie lo spazio senza scroll */
.page{height:100%;min-height:400px;display:flex;flex-direction:column;gap:14px}
.prog{flex:none;display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .2s}
.prog i.on{background:linear-gradient(90deg,var(--red),var(--vio))}
.page h1{margin:0;flex:none;font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,6.5vw,2.3rem);line-height:1.05;letter-spacing:-.035em}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}

/* UN SOLO tipo di riga di scelta */
.row{
  flex:1 1 0;min-height:50px;max-height:96px;width:100%;
  display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left;
  border-radius:var(--r);border:1px solid var(--line);background:var(--panel);
  transition:background .15s,border-color .15s,transform .08s;
}
.row .e{flex:none;width:38px;display:grid;place-items:center;font-size:1.75rem;line-height:1}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;font-size:1.05rem;line-height:1.2}
.row .s{font-size:.8rem;color:var(--mut);line-height:1.25}
.row .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);transition:border-color .15s,background .15s}
.list:not(.many) .row{max-height:116px}
.row:active{filter:brightness(1.25)}
.row.on{background:linear-gradient(135deg,rgba(255,61,82,.22),rgba(144,97,249,.20));border-color:var(--red)}
.row.on .ck{border-color:var(--red);background:radial-gradient(circle,var(--red) 0 42%,transparent 48%)}
@media (hover:hover){.row:hover{border-color:rgba(255,255,255,.24)}}
@media (max-height:780px){.list.many .s{display:none}.list.many .row{min-height:46px}.list.many .e{width:32px;font-size:1.45rem}.page{gap:10px}}
@media (min-width:900px){#stage{max-width:620px}.brand{font-size:1.05rem}}

/* bottoni azione */
.btn{
  min-width:0;min-height:54px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;
  font-weight:700;font-size:clamp(.82rem,4.2vw,.98rem);text-align:center;white-space:nowrap;overflow:hidden;transition:transform .08s,filter .15s;
}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:linear-gradient(135deg,var(--red),#b92fd8);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(255,61,82,.28)}
.btn.ico{font-size:1.4rem;padding:0}

/* caricamento / errore */
.load{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.spin{width:52px;height:52px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--red);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load p{margin:0;font-family:var(--fd);font-weight:700;font-size:1.3rem}
.err{height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 4px}
.err h2{margin:0;font-family:var(--fd);font-size:1.9rem;line-height:1.05}
.err p,.err small{margin:0;color:var(--mut)}

/* risultato */
.res{display:flex;flex-direction:column;gap:12px}
.hero{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:start}
.poster{width:100%;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster.fb{display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;border:0}
.poster.fb h3{margin:0;font-family:var(--fd);font-size:1rem;line-height:1.1}
.poster.fb small{opacity:.8;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.meta{display:flex;flex-direction:column;gap:10px;min-width:0}
.meta h2{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.05;letter-spacing:-.03em;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.74rem;color:var(--mut);font-weight:600}
.chip.r{color:var(--gold);border-color:rgba(245,196,81,.4)}
.compat b{font:700 .74rem var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.meter{height:8px;margin-top:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:inherit}
.block{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.block h3{margin:0 0 8px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.block p{margin:0;font-size:.93rem}
.block p.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.why li{display:flex;gap:10px;align-items:flex-start}
.why li b{color:var(--gold)}
.in{animation:rise .22s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* banner installazione */
.ib{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--panel-2);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.ib[hidden]{display:none}
.ib p{margin:0;flex:1;font-size:.82rem}
.ib .btn{min-height:42px;font-size:.82rem;padding:0 12px}

@media (prefers-reduced-motion:reduce){.in,.spin{animation:none}.opt,.btn{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="brand">Stasera cosa <i>guardo</i></div></header>
<main id="stage"></main>
<div id="barhost"></div>

<div class="ib" id="ib" hidden>
  <span style="font-size:22px">📲</span>
  <p>Aggiungila alla schermata Home per usarla come un'app.</p>
  <button class="btn primary" id="ibtn">Installa</button>
  <button class="btn" id="ix" aria-label="Chiudi">✕</button>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)], uniq=a=>[...new Set(a)], sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>{const d=document.createElement("div");d.innerHTML=s||"";return d.textContent||"";};

/* ---------- Dati ---------- */
const CATS=[["film","🎬","Film","Dal grande cinema"],["serie","📺","Serie TV","Dal piccolo schermo"],["anime","⛩️","Anime","Serie e film giapponesi"],["cartoni","🎨","Cartoni","Film e serie animate di ogni tipo"]];
const MOOD=[
  ["feelgood","😊","Leggero","Niente pensieri"],["laugh","😂","Ridere","Una bella commedia"],
  ["love","❤️","Amore","Una storia romantica"],["cry","🥺","Lacrime","Mi voglio commuovere"],
  ["scare","😱","Paura","Horror e tensione"],["thrill","⚡","Azione","Adrenalina pura"],
  ["mindbend","🧠","Twist","Colpo di scena"],["epic","🏰","Epico","Grandi avventure"]
];
const TIME_BY_CAT={
  film:[["short","⏱️","Corto","Sotto 90 minuti"],["mid","🎬","Normale","Circa 90–120 minuti"],["long","🍿","Lungo","Oltre 2 ore"],["any","🔥","Non importa","Qualsiasi durata"]],
  serie:[["short","⏱️","Un episodio","Una puntata e basta"],["mid","🎬","2–4 episodi","Una serata piena"],["long","🍿","Binge","Maratona"],["any","🔥","Non importa","Qualsiasi durata"]],
  anime:[["short","🎬","Un film","Si chiude stasera"],["mid","📺","Una stagione","Circa 12–26 episodi"],["long","🍿","Saga lunga","Tanti episodi"],["any","🔥","Non importa","Film o serie"]],
  cartoni:[["short","⏱️","Veloce","Un film corto o un episodio"],["mid","🎬","Normale","Un film o qualche episodio"],["long","🍿","Lungo","Film lungo o maratona"],["any","🔥","Non importa","Film o serie"]]
};
const STYLE=[["safe","🛋️","Sul sicuro","Titoli famosi e amati"],["balanced","🍿","Equilibrato","Un mix di noti e meno noti"],["surprise","🎲","Osa un po'","Qualcosa di inaspettato"]];
const RISK={safe:20,balanced:55,surprise:85};
const G={
 film:{mood:{feelgood:["comedy film","family film"],laugh:["comedy film","romantic comedy film","romantic comedy"],love:["romance film","romantic drama film","romantic comedy film"],cry:["drama film","romance film"],scare:["horror film"],thrill:["action film","thriller film","adventure film"],mindbend:["mystery film","psychological thriller film","science fiction film"],epic:["fantasy film","science fiction film","adventure film"]},avoid:{},heavy:["drama film","mystery film","war film"],light:["comedy film","family film","adventure film"]},
 serie:{mood:{feelgood:["Comedy","Family"],laugh:["Comedy"],love:["Romance"],cry:["Drama","Romance"],scare:["Horror"],thrill:["Action","Thriller","Crime"],mindbend:["Mystery","Thriller","Science-Fiction"],epic:["Fantasy","Science-Fiction","Adventure"]},avoid:{},heavy:["Drama","Mystery","War"],light:["Comedy","Family","Adventure"]},
 anime:{mood:{feelgood:["Comedy","Slice of Life"],laugh:["Comedy"],love:["Romance"],cry:["Drama","Romance"],scare:["Horror"],thrill:["Action","Suspense","Thriller"],mindbend:["Mystery","Psychological","Suspense","Thriller"],epic:["Fantasy","Adventure","Sci-Fi"]},avoid:{},heavy:["Drama","Psychological","Mystery"],light:["Comedy","Slice of Life","Adventure"]}
};
const JID={"Action":1,"Adventure":2,"Comedy":4,"Drama":8,"Fantasy":10,"Horror":14,"Mystery":7,"Romance":22,"Sci-Fi":24,"Slice of Life":36,"Suspense":41,"Psychological":40,"Gore":58,"Ecchi":9,"Hentai":12};
const MOOD_TXT={feelgood:"qualcosa di leggero",laugh:"ridere",love:"una storia d'amore",cry:"commuoverti",scare:"avere paura",thrill:"azione e adrenalina",mindbend:"un colpo di scena assurdo",epic:"un'avventura epica"};

/* ---------- Stato ---------- */
const S={cat:"",mood:"",time:"",style:"",step:0,seen:[],cands:[],cur:null,a:null};
const buildA=()=>({
  cat:S.cat,mood:S.mood,time:S.time,effort:"1",who:"solo",avoid:[],risk:RISK[S.style]||55,
  fmt:S.cat==="anime"?(S.time==="short"?"movie":S.time==="any"?"any":null):null
});
const stage=$("stage"), barhost=$("barhost");
function swap(h,anim){stage.innerHTML=h;if(anim!==false){stage.classList.remove("in");void stage.offsetWidth;stage.classList.add("in");stage.scrollTop=0;}}
let ACT={};
function setBar(h,acts){barhost.innerHTML=h;ACT=acts||{};}
function fireBar(e){
  const b=e.target&&e.target.closest?e.target.closest('button[data-act]'):null;
  if(!b||b.disabled)return;
  const now=Date.now();
  if(e.type==="pointerup")fireBar.p=now;
  else if(now-(fireBar.p||0)<700)return;   /* il click che segue lo stesso tocco: già gestito */
  const f=ACT[b.dataset.act];if(f){try{f();}catch(x){}}
}
barhost.addEventListener('pointerup',fireBar);
barhost.addEventListener('click',fireBar);
const bb=(act,label,cls)=>'<button type="button" class="btn'+(cls?' '+cls:'')+'" data-act="'+act+'">'+label+'</button>';
const barHtml=(...b)=>'<div class="bar"><div class="bar-in">'+b.join('')+'</div></div>';

function gkey(cat,a){cat=cat==="cartoni"?(a&&a.fmt==="movie"?"film":"serie"):cat; return cat==="film"?"film":cat==="anime"?"anime":"serie";}
const without=(cat,a)=>{cat=gkey(cat,a);let w=[];(a.avoid||[]).forEach(k=>{if(G[cat].avoid[k]) w=w.concat(G[cat].avoid[k]);}); if(a.who==="family") w=w.concat(cat==="film"?["horror film","erotic film","war film"]:cat==="anime"?["Horror","Ecchi","Hentai"]:["Horror","War","Crime"]); return uniq(w);};

/* ---------- Scelta a pagine ---------- */
const tap=()=>{try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}};
const STEPS=[
  {k:"cat",q:"Cosa guardi stasera?",get:()=>CATS},
  {k:"mood",q:"Che voglia hai?",get:()=>MOOD},
  {k:"time",q:"Quanto tempo hai?",get:()=>TIME_BY_CAT[S.cat]||TIME_BY_CAT.film},
  {k:"style",q:"Quanto vuoi osare?",get:()=>STYLE}
];
function row(g,o,on){return '<button type="button" class="row'+(on?' on':'')+'" data-g="'+g+'" data-v="'+o[0]+'" aria-pressed="'+(on?'true':'false')+'"><span class="e">'+o[1]+'</span><span class="tx"><span class="t">'+esc(o[2])+'</span>'+(o[3]?'<span class="s">'+esc(o[3])+'</span>':'')+'</span><span class="ck" aria-hidden="true"></span></button>';}
function home(anim){
  const st=STEPS[S.step],items=st.get();
  swap('<div class="page"><div class="prog" aria-hidden="true">'+STEPS.map((_,i)=>'<i class="'+(i<=S.step?'on':'')+'"></i>').join('')+'</div><h1>'+esc(st.q)+'</h1><div class="list'+(items.length>5?' many':'')+'" role="group" aria-label="'+esc(st.q)+'">'+items.map(o=>row(st.k,o,S[st.k]===o[0])).join('')+'</div></div>',anim);
  setBar(barHtml(S.step===0?bb('side','🎲 Sorprendimi'):bb('side','← Indietro')),{side:()=>{
    tap();
    if(S.step>0){S.step--;home();return;}
    S.cat=pick(CATS)[0];S.mood=pick(MOOD)[0];S.time="any";S.style="surprise";S.step=STEPS.length-1;
    S.seen=[];S.cands=[];run(true,true);
  }});
  let lock=false;
  stage.querySelectorAll('.row').forEach(b=>{b.onclick=()=>{
    if(lock)return;lock=true;tap();
    const g=b.dataset.g,v=b.dataset.v;S[g]=v;if(g==="cat")S.time="";
    stage.querySelectorAll('.row').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});
    setTimeout(()=>{if(S.step<STEPS.length-1){S.step++;home();}else{S.seen=[];S.cands=[];run(false,true);}},170);
  };});
}

function loading(){
  const t=["Cerco un titolo adatto a te...","Controllo i tuoi gusti...","Ci siamo quasi..."];
  setBar(barHtml(bb('cancel','Annulla')),{cancel:()=>{tap();RUN++;home();}});
  swap('<div class="load"><div class="spin" aria-hidden="true"></div><p id="lt">'+esc(t[0])+'</p></div>');
  let i=0;const iv=setInterval(()=>{i=(i+1)%t.length;const p=$('lt');if(p)p.textContent=t[i];},1300);
  return ()=>clearInterval(iv);
}

function showError(e){
  const off=navigator.onLine===false, empty=e&&e.message==="EMPTY";
  const msg=off?"Sembra che il telefono sia offline: controlla la connessione e riprova.":empty?"Nessun titolo trovato con queste regole. Prova a cambiare qualcosa.":"Non riesco a trovare un risultato adesso.";
  swap('<div class="err"><h2>Qualcosa non va</h2><p>'+esc(msg)+'</p>'+(empty||off?'':'<small style="word-break:break-all">Dettaglio: '+esc(e&&e.message||'errore')+'</small>')+'</div>');
  setBar(barHtml(bb('back','Modifica'),bb('retry','Riprova','primary')),{
    retry:()=>{tap();S.seen=[];S.cands=[];run(false,true);},
    back:()=>{tap();home();}});
}

/* ---------- Fonti dati (logica invariata) ---------- */
const KW=/film|serie|anime|televisiv|animazione|manga|telefilm|sitcom/i;
const VALS=l=>l.map(x=>'"'+x+'"@en').join(' ');
function fj(url,ms,opts){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);return fetch(url,Object.assign({signal:c.signal},opts||{})).then(r=>{clearTimeout(t);if(r.status===429){const e=new Error("429");e.retry=1;throw e;}if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).catch(e=>{clearTimeout(t);throw e;});}
const fjr=(url,ms,o)=>fj(url,ms,o).catch(e=>e&&e.retry?sleep(1000).then(()=>fj(url,ms,o)):Promise.reject(e));
function tier(list,tests){let last=[];for(const t of tests){const r=list.filter(t);if(r.length>=5)return r;if(r.length)last=r;}return last.length?last:list;}
const wsum=t=>fjr("https://it.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.trim().replace(/\s+/g,"_")),8000);
const normT=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g," ").replace(/[^a-z0-9]+/g," ").trim();
const sameTitle=(a,b)=>{const x=normT(a),y=normT(b);return !!x&&x===y;};
async function enrich(title,kind){const ok=r=>r&&r.extract&&r.type!=='disambiguation'&&KW.test(r.extract.slice(0,300))&&sameTitle(r.title,title);const out=r=>({extract:r.extract,thumb:r.thumbnail&&r.thumbnail.source});try{const r=await wsum(title);if(ok(r))return out(r);}catch(e){}try{const s=await fjr("https://it.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=3&srsearch="+encodeURIComponent(title+" "+kind),8000);for(const x of (s.query&&s.query.search)||[]){try{const r=await wsum(x.title);if(ok(r))return out(r);}catch(e){}}}catch(e){}return null;}
async function sparql(q){const d=await fj("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(q),30000);return(d.results&&d.results.bindings)||[];}

const GIT={"Comedy":"Commedia","Drama":"Drammatico","Romance":"Sentimentale","Horror":"Horror","Action":"Azione","Adventure":"Avventura","Fantasy":"Fantasy","Science-Fiction":"Fantascienza","Sci-Fi":"Fantascienza","Mystery":"Mistero","Thriller":"Thriller","Suspense":"Suspense","Slice of Life":"Vita quotidiana","Psychological":"Psicologico","Family":"Famiglia","Crime":"Crimine"};

const mainstream=(cat,m)=>m.sl!=null?Math.max(0,Math.min(1,Math.log10(Math.max(2,m.sl))/2.6)):m.rating?Math.max(0,Math.min(1,(m.rating-4)/5)):.4;

function score(cat,m,a){const g=m.genres||[],gs=G[cat==="cartoni"?(m.sl!=null?"film":"serie"):gkey(cat,a)],ms=mainstream(cat,m),e=+a.effort;const heavy=g.some(x=>gs.heavy.indexOf(x)>=0)||(m.rating||0)>=8.3,light=g.some(x=>gs.light.indexOf(x)>=0);return 45*hit(g,gs.mood[a.mood])+20*(e===2?(heavy?1:.3):e===0?(light?1:.3):.75)+20*Math.max(0,1-Math.abs((1-ms)*100-a.risk)/70)+15*(m.sl!=null?ms:m.rating?Math.max(0,Math.min(1,(m.rating-5)/4)):.5)+Math.random()*6;}

const cleanHtml=h=>{try{return (new DOMParser().parseFromString(String(h||"").replace(/<br\s*\/?>/gi," "),"text/html").body.textContent||"").replace(/\s+/g," ").trim();}catch(e){return "";}};
const AL_OK=["Action","Adventure","Comedy","Drama","Fantasy","Horror","Mystery","Romance","Sci-Fi","Slice of Life","Psychological","Thriller"];
async function animeAniList(a){
  const wn=without("anime",a);

  if(!want.length)want=["Comedy"];

  const pop=a.risk<30?40000:a.risk<60?15000:a.risk<80?6000:2500;
  const maxPage=a.risk<30?3:a.risk<60?6:a.risk<80?10:16;
  const q="query($p:Int,$g:String,$f:[MediaFormat],$pop:Int,$el:Int,$eg:Int){Page(page:$p,perPage:25){media(type:ANIME,isAdult:false,genre:$g,format_in:$f,popularity_greater:$pop,episodes_lesser:$el,episodes_greater:$eg,sort:SCORE_DESC){id title{romaji english}startDate{year}genres averageScore duration episodes format coverImage{large}description(asHtml:false)}}}";

async function animeJikan(a){

    try{

const pickFrom=(r,sur)=>{const p=r.filter(x=>S.seen.indexOf(x.m.id)<0);if(!p.length)return null;return sur?pick(p.slice(0,10)):p[0];};

let RUN=0;
async function run(surprise,fresh){
  const my=++RUN;
  const stop=loading();const wait=sleep(1200);
  try{
    S.a=buildA();
    let ranked=null,cand=null;
    if(!fresh&&!surprise)cand=pickFrom(S.cands,false);
    if(!cand){
      const a=surprise?Object.assign({},S.a,{risk:Math.max(S.a.risk+30,85)}):S.a;
      ranked=await rank(a);
      if(!surprise)S.cands=ranked;
      cand=pickFrom(ranked,surprise)||pick(ranked);
    }
    let d,tries=0;
    for(;;){
      S.seen.push(cand.m.id);d=await detailsOf(cand.m);
      if(cand.m.sl==null||d.it||tries++>=4)break;

function fbPoster(t,y){const h=Array.from(t).reduce((a,ch)=>((a*31+ch.charCodeAt(0))%360),0);return '<div class="poster fb" style="background:linear-gradient(135deg,hsl('+h+' 68% 42%),hsl('+((h+55)%360)+' 58% 30%))"><small>Stasera</small><h3>'+esc(t)+'</h3><small>'+esc(y||'')+'</small></div>';}
function why(r,sur){
  const a=S.a,d=r.d,m=r.m,g=m.genres||[],gs=G[S.cat==="cartoni"?(m.sl!=null?"film":"serie"):gkey(S.cat,a)],o=[];

  else o.push('Non è il genere più ovvio per chi cerca '+MOOD_TXT[a.mood]+(d.glist&&d.glist.length?" ("+d.glist.slice(0,3).join(', ')+")":"")+': lo propongo per gli altri criteri.');

}

  const poster=d.poster?'<div class="poster"><img src="'+esc(d.poster)+'" alt="Copertina di '+esc(d.title)+'" referrerpolicy="no-referrer"></div>':fbPoster(d.title,d.year);
  const h='<div class="res">'+
    '<div class="hero">'+poster+'<div class="meta"><h2>'+esc(d.title)+'</h2><div class="chips">'+
      (d.year?'<span class="chip">'+esc(d.year)+'</span>':'')+
      (S.cat==='anime'||S.cat==='cartoni'?'<span class="chip">'+(d.movie?'Film':'Serie')+'</span>':'')+
      (d.runtime?'<span class="chip">'+d.runtime+' min</span>':'')+
      (d.rv?'<span class="chip r">★ '+(+d.rv).toFixed(1)+'</span>':'')+
    '</div><div class="compat"><b>Compatibilità '+p+'%</b><div class="meter"><span style="width:'+p+'%"></span></div></div></div></div>'+
    '<section class="block"><h3>Perché fa per te</h3><ul class="why">'+why(r,sur).slice(0,3).map(x=>'<li><b>✓</b><span>'+esc(x)+'</span></li>').join('')+'</ul></section>'+
    '<section class="block"><h3>Trama</h3><p class="clamp" id="plot" style="cursor:pointer">'+esc(d.overview||'Trama non disponibile.')+'</p></section>'+
  '</div>';
  swap(h);
  const pl=$('plot');if(pl)pl.onclick=()=>pl.classList.toggle('clamp');
  setBar(barHtml(bb('rst','← Modifica'),bb('sur','🎲 Sorprendi'),bb('oth','Un altro','primary')),{
    oth:()=>{tap();run(false,false);},
    sur:()=>{tap();run(true,false);},
    rst:()=>{tap();home();}});
}
