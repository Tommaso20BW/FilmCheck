  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bandb:0px;
  --ease:cubic-bezier(.2,.85,.25,1);
  --fd:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --fb:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
body{margin:0;height:100%;font:16px/1.45 var(--fb);color:var(--fg);background:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
a{color:inherit;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sfondo ambientale */
body::before,body::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:110vmax;height:110vmax;border-radius:50%;}
body::before{left:-60vmax;top:-10vmax;background:radial-gradient(closest-side,rgba(143,98,248,.24),transparent)}
body::after{right:-60vmax;bottom:-75vmax;background:radial-gradient(closest-side,rgba(255,61,82,.17),transparent)}

/* backdrop sfocato (solo nel risultato) */
#bd{position:absolute;left:0;right:0;top:0;height:62%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
#bd.on{opacity:1}
#bd::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(110px + var(--sat));z-index:2;background:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.6) 40%,transparent 100%)}
#bd i{position:absolute;inset:-10%;background-size:cover;background-position:center top;filter:blur(22px) brightness(.6);transform:scale(1.2) translateZ(0)}

/* struttura */
#app{position:fixed;left:0;right:0;top:0;bottom:0;z-index:1;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow-x:clip}
.top{flex:none;padding-top:calc(var(--sat) + 6px);position:relative;z-index:5}
/* barra alta: trasparente, nessun riquadro, un'unica linea continua di progresso */
.top-in{height:52px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 6px}
.slot{display:flex;align-items:center;min-width:0}
.slot.r{justify-content:flex-end;padding-right:12px}
.tb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .1s,background .2s}
.tb:active{transform:scale(.88);background:rgba(255,255,255,.12)}
.tb svg{width:24px;height:24px}
.cnt{font:700 .8rem var(--fd);letter-spacing:.08em;color:var(--mut);white-space:nowrap}
.cnt b{color:var(--fg);font-weight:800}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:.86rem;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em}

.mark svg{display:none}
.prog{height:3px;margin:2px var(--gut) 8px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;transition:opacity .3s}
.prog.off{opacity:0}
.prog b{display:block;height:100%;width:0;border-radius:inherit;background:var(--grad);box-shadow:0 0 10px rgba(255,61,82,.6);transition:width .6s var(--ease)}

/* il contenuto sfuma sotto la barra: nessun taglio netto */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px var(--gut) 20px;
  -webkit-mask-image:linear-gradient(transparent,#000 14px);mask-image:linear-gradient(transparent,#000 14px)}
#stage::-webkit-scrollbar{display:none}
.ghost{position:absolute;z-index:1;box-sizing:border-box;overflow:hidden;padding:10px var(--gut) 20px;pointer-events:none;will-change:transform;-webkit-mask-image:linear-gradient(transparent,#000 14px);mask-image:linear-gradient(transparent,#000 14px)}

/* dock inferiore: resta SOPRA la zona della home-indicator, così i tasti si toccano sempre */
#dock{flex:none;position:relative;z-index:6;padding:12px var(--gut) 16px}
.dock-in{display:flex;gap:8px}
.dock-in .btn{padding:0 6px;font-size:.95rem;border-radius:999px}
.dock-in .btn.v{flex-direction:column;gap:3px;font-size:.8rem;line-height:1.1}
.dock-in .btn.v svg{width:21px;height:21px}
.btn.primary{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(255,61,82,.3)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 3.8s 1.2s ease-in-out 2;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.btn{position:relative;overflow:hidden;flex:1;min-width:0;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 14px;
  border:1px solid var(--line2);background:var(--s2);font-weight:700;font-size:1rem;white-space:nowrap;text-decoration:none;color:var(--fg);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(1.2)}
.btn svg{width:20px;height:20px;flex:none}
.dock-in:not(.out) .btn{animation:btnIn .6s cubic-bezier(.22,1,.36,1) backwards;animation-delay:.07s}
.dock-in:not(.out) .btn:nth-child(2){animation-delay:.12s}
.dock-in:not(.out) .btn:nth-child(3){animation-delay:.17s}
.dock-in.out{pointer-events:none}
@keyframes btnIn{from{opacity:0;transform:translateY(14px) scale(.96)}}

/* banner installazione (dentro al dock) */
.ib{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 12px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--line)}
.ib[hidden]{display:none}
.ib p{margin:0;flex:1;font-size:.82rem}
.ib .btn{flex:none;height:40px;border-radius:12px;font-size:.82rem;padding:0 14px}

/* scelta */
.page{min-height:100%;display:flex;flex-direction:column;gap:18px}
.page h1{margin:4px 0 0;flex:none;font-family:var(--fd);font-weight:800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.02;letter-spacing:-.04em}
/* UN SOLO layout per tutte le domande: elenco a righe che riempie lo schermo */
.opts{flex:1;display:grid;gap:10px;grid-template-columns:1fr;grid-auto-rows:minmax(60px,1fr)}
.opt{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;padding:8px 16px 8px 12px;text-align:left;min-height:60px;
  border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:transform .1s,border-color .15s,background .15s,box-shadow .2s}
.opt:active{transform:scale(.97)}
.opt .em{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:1.7rem;line-height:1}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .t{font-weight:700;font-size:1.08rem;line-height:1.15}
.opt .s{font-size:.8rem;line-height:1.25;color:var(--mut)}
.opt .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:background .15s,border-color .15s}
/* 8 opzioni (voglie): righe più compatte, così ci stanno tutte senza scorrere */
.opts.n8{gap:8px;grid-auto-rows:minmax(48px,1fr)}
.opts.n8 .opt{min-height:48px;padding:5px 14px 5px 10px;gap:12px}
.opts.n8 .opt .em{width:34px;height:34px;font-size:1.45rem}
.opts.n8 .opt .t{font-size:1rem}
.opts.n8 .opt .s{font-size:.76rem}
.opt.on{border-color:var(--red);background:linear-gradient(135deg,rgba(255,61,82,.26),rgba(143,98,248,.22));box-shadow:0 0 0 1px var(--red) inset,0 10px 30px rgba(255,61,82,.2)}
.opt.on .ck{border-color:transparent;background:var(--grad)}
.opt.on .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media (hover:hover){.opt:hover{border-color:var(--line2)}}

/* caricamento / errore */
.load{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.spin{position:relative;width:84px;height:84px}
.spin i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,var(--red) 80%,#fff);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:sp 1s linear infinite}
.spin i+i{inset:14px;background:conic-gradient(from 0deg,transparent 0 30%,var(--vio) 85%,#fff);animation:sp 1.5s linear infinite reverse}
.spin b{position:absolute;inset:33px;border-radius:50%;background:radial-gradient(circle,var(--gold),var(--red));box-shadow:0 0 30px var(--red);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.65);opacity:.7}50%{transform:scale(1.2);opacity:1}}
@keyframes sp{to{transform:rotate(360deg)}}
.load p{margin:0;font-family:var(--fd);font-weight:700;font-size:1.3rem}
.err{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.err h2{margin:0;font-family:var(--fd);font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-.03em}
.err p,.err small{margin:0;color:var(--mut)}

/* risultato */
.res{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.poster{position:relative;width:min(54vw,224px);aspect-ratio:2/3;border-radius:var(--r2);overflow:hidden;background:var(--s2);border:1px solid var(--line2);cursor:zoom-in;
  box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 40px rgba(143,98,248,.25);touch-action:manipulation;transition:transform .15s}
.poster:active{transform:scale(.97)}

function swap(h,anim,dx){
  const old=stage.innerHTML,app=$("app");
  document.querySelectorAll(".ghost").forEach(g=>g.remove());
  const fade=dx==="fade",move=anim!==false&&!RM()&&!fade;
  let ghost=null;
  if(move&&old.trim()){
    const ar=app.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    ghost=document.createElement("div");ghost.className="ghost";ghost.setAttribute("aria-hidden","true");
    ghost.style.cssText="left:"+(sr.left-ar.left)+"px;top:"+(sr.top-ar.top)+"px;width:"+sr.width+"px;height:"+sr.height+"px";
    ghost.innerHTML=old.replace(/ id="[^"]*"/g,"");
    app.insertBefore(ghost,stage);ghost.scrollTop=stage.scrollTop;
  }
  stage.innerHTML=h;stage.classList.remove("out");
  if(anim===false)return;
  stage.classList.remove("in");void stage.offsetWidth;stage.classList.add("in");stage.scrollTop=0;
  if(FIRST){   // prima pagina all'apertura: nessuno scorrimento, solo sfocatura incrociata
    FIRST=false;
    if(!RM()&&stage.animate){
      // solo opacity + transform (compositati dalla GPU): niente blur animato, quindi scorre fluido
      const E="cubic-bezier(.22,1,.36,1)";
      const rise=(el,i,y)=>el.animate([{opacity:0,transform:"translate3d(0,"+y+"px,0) scale(.97)"},{opacity:1,transform:"none"}],{duration:1100,delay:120+i*90,easing:E,fill:"backwards"});
      const h1=stage.querySelector("h1");if(h1)rise(h1,0,20);
      stage.querySelectorAll(".opt").forEach((el,i)=>rise(el,i+1,30));
      ["top","dock"].forEach(k=>{const e=k==="top"?document.querySelector(".top"):$("dock");if(e&&e.animate)e.animate([{opacity:0},{opacity:1}],{duration:1000,delay:k==="top"?0:450,easing:"ease-out",fill:"backwards"});});
    }
    return;
  }
  FIRST=false;
  if(fade){if(!RM()&&stage.animate)stage.animate([{opacity:0},{opacity:1}],{duration:380,easing:"ease-out"});return;}
  if(!move)return;
  const d=dx==null?100:dx,o={duration:650,easing:"cubic-bezier(.45,.05,.2,1)"};
  stage.animate([{transform:"translate3d("+d+"%,0,0)"},{transform:"none"}],o);
  if(ghost){const g=ghost;g.animate([{transform:"none"},{transform:"translate3d("+(-d)+"%,0,0)"}],Object.assign({fill:"forwards"},o)).onfinish=()=>g.remove();setTimeout(()=>g.remove(),1000);}
}

/* Ricerca solo TMDB: prima la ricerca generale, poi film e serie separati */
async function searchTitles(q){
  const P={query:q,include_adult:"false",page:1};
  let err=null;
  try{
    const r=await tm("/3/search/multi",P);
    return (r.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv");
  }catch(e){err=e;}
  try{
    const r=await Promise.all([tm("/3/search/movie",P).catch(()=>null),tm("/3/search/tv",P).catch(()=>null)]);
    if(r[0]||r[1]){
      const m=((r[0]&&r[0].results)||[]).map(x=>Object.assign({media_type:"movie"},x)),t=((r[1]&&r[1].results)||[]).map(x=>Object.assign({media_type:"tv"},x));
      return m.concat(t).sort((x,y)=>(y.popularity||0)-(x.popularity||0));
    }
  }catch(e){}
  throw err||new Error("ricerca TMDB non disponibile");
}

// TMDB è l'unica fonte: le altre (Wikidata, TVmaze, AniList, Jikan) servono solo se TMDB non risponde proprio
async function viaTmdb(fn,fallback,a){
  if(!tmdbOn())return fallback();
  let l;
  try{l=await fn();}
  catch(e){if(e&&e.message==="EMPTY")throw e;return fallback();}   // errore di rete/proxy = TMDB "morto"
  if(l&&l.length)return l;
  throw new Error("EMPTY");                                          // TMDB vivo ma senza risultati: niente altre fonti
}

const pickFrom=(r,sur)=>{const p=r.filter(x=>S.seen.indexOf(x.m.id)<0);if(!p.length)return null;return sur?pick(p.slice(0,10)):p[0];};

let RUN=0;
async function run(surprise,fresh){
  const my=++RUN;
  const stop=loading();const wait=sleep(1200);
  try{
    S.a=buildA();
    let ranked=null,cand=null;
    if(!fresh&&!surprise)cand=pickFrom(S.cands,false);
    if(!cand){
      const a=surprise?Object.assign({},S.a,{risk:Math.max(S.a.risk+30,85)}):S.a;
      ranked=await rank(a);
      if(!surprise)S.cands=ranked;
      cand=pickFrom(ranked,surprise)||pick(ranked);
    }
    let d,tries=0;
    for(;;){
      S.seen.push(cand.m.id);d=await detailsOf(cand.m);
      if(cand.m.sl==null||d.it||tries++>=4)break;
      const pool=ranked||S.cands,nx=pickFrom(pool,false);
      if(!nx)break;cand=nx;
    }
    await wait;stop();if(my!==RUN)return;show({d,m:cand.m,s:cand.s},surprise);
  }catch(e){await wait;stop();if(my!==RUN)return;showError(e);}
}

/* ---------- Link diretti alle piattaforme (via Wikidata: ID esterni → URL del titolo) ---------- */
const PROVRE=[
  ["netflix",/netflix/i,/(^|\.)netflix\.com$/],
  ["disney",/disney/i,/(^|\.)disneyplus\.com$/],
  ["apple",/apple tv/i,/(^|\.)tv\.apple\.com$/],
  ["prime",/prime video|amazon/i,/(^|\.)(primevideo\.com|amazon\.[a-z.]+)$/],
  ["paramount",/paramount/i,/(^|\.)paramountplus\.com$/],
  ["raiplay",/raiplay/i,/(^|\.)raiplay\.it$/]
];
const pkey=n=>{const x=PROVRE.find(p=>p[1].test(n||""));return x?x[0]:"";};
async function wdLinks(tid,movie){
  const q='SELECT ?pl ?v ?fu WHERE{?i wdt:'+(movie?'P4947':'P4983')+' "'+tid+'". ?i ?p ?v. ?pr wikibase:directClaim ?p; wikibase:propertyType wikibase:ExternalId; wdt:P1630 ?fu; rdfs:label ?pl. FILTER(LANG(?pl)="en") FILTER(REGEX(?pl,"Netflix|Disney|Apple TV|Prime Video|Amazon (Prime|video)|Paramount|RaiPlay","i"))} LIMIT 30';
  const rows=await Promise.race([sparql(q),sleep(9000).then(()=>[])]);
  const out={};
  rows.forEach(b=>{
    const lab=b.pl.value,k=pkey(lab);
    if(!k||out[k]||/person|actor|director|character|episode|season/i.test(lab))return;
    const url=b.fu.value.replace("$1",b.v.value);
    try{
      const u=new URL(url),re=PROVRE.find(p=>p[0]===k)[2];
      if(u.protocol==="https:"&&re.test(u.hostname))out[k]=url;
    }catch(e){}
  });
  return out;
}

function provUrl(name,title,fb){
  const q=encodeURIComponent(title||""),n=String(name||"").toLowerCase();
  if(/netflix/.test(n))return "https://www.netflix.com/search?q="+q;
  if(/prime video|amazon/.test(n))return "https://www.primevideo.com/search/?phrase="+q;
  if(/disney/.test(n))return "https://www.disneyplus.com/it-it/search?q="+q;
  if(/apple tv/.test(n))return "https://tv.apple.com/it/search?term="+q;
  if(/paramount/.test(n))return "https://www.paramountplus.com/it/search/?q="+q;
  if(/^now\b/.test(n))return "https://www.nowtv.it/watch/search?q="+q;
  if(/raiplay/.test(n))return "https://www.raiplay.it/ricerca.html?q="+q;
  if(/infinity/.test(n))return "https://www.mediasetinfinity.mediaset.it/search?q="+q;
  if(/youtube/.test(n))return "https://www.youtube.com/results?search_query="+q;
  if(/google play/.test(n))return "https://play.google.com/store/search?c=movies&q="+q;
  return fb||("https://www.justwatch.com/it/cerca?q="+q);
}
// stesso servizio venduto anche come "canale" dentro Prime Video / Apple TV (es. Paramount+, Paramount+ Amazon Channel, Paramount Plus Apple TV Channel): un solo logo
const CH_RE=/\s+(Apple\s*TV|Amazon|Prime\s*Video)(\s+Amazon)?\s+Channel$/i;

const provKey=n=>{let k=provBase(n).toLowerCase().replace(/\+/g,"plus").replace(/with ads|con pubblicit[aà]/g,"").replace(/[^a-z0-9]+/g,"");if(/^(amazon)?primevideo$/.test(k))k="primevideo";return k;};

function openYt(e,key){
  const web="https://www.youtube.com/watch?v="+key,ua=navigator.userAgent||"";
  const android=/android/i.test(ua);
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(android){
    e.preventDefault();
    location.href="intent://www.youtube.com/watch?v="+key+"#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url="+encodeURIComponent(web)+";end";
    return;
  }
  if(ios&&navigator.standalone===true){
    e.preventDefault();
    const t=Date.now();
    location.href="youtube://www.youtube.com/watch?v="+key;
    setTimeout(()=>{if(!document.hidden&&Date.now()-t<2500){try{window.open(web,"_blank");}catch(x){}}},1000);
    return;
  }
  /* iOS Safari e desktop: il link https normale (iOS lo passa all'app tramite universal link) */
}

/* ---------- Locandina grande (lightbox con animazione di ingrandimento) ---------- */
let LB=null,PEND=null,OA=null;
const EASE="cubic-bezier(.25,.8,.25,1)";
const SH1="0 24px 50px rgba(0,0,0,.6),0 0 40px rgba(143,98,248,.25)",SH0="0 24px 50px rgba(0,0,0,0),0 0 40px rgba(143,98,248,0)";

function rad(el){const r=parseFloat(getComputedStyle(el).borderTopLeftRadius);return isNaN(r)?16:r;}
// misura la locandina "a riposo" (ignora l'effetto di pressione scale(.97))
function rectOf(el){const t=el.style.transition,f=el.style.transform;el.style.transition="none";el.style.transform="none";const r=el.getBoundingClientRect();el.style.transform=f;el.style.transition=t;return r;}

// campiona l'animazione: a ogni istante raggio e cornice sono divisi per la scala, quindi a schermo restano costanti (uguali a locandina piccola)
function kfs(f,t,R,N,edge,clip,opening,M){const o=[];for(let i=0;i<=N;i++){const p=i/N,s=f.s+(t.s-f.s)*p,x=f.x+(t.x-f.x)*p,y=f.y+(t.y-f.y)*p;

// parte della locandina visibile (tagliata dal contenitore con scroll): la card in animazione deve avere lo stesso taglio
// lo stage sfuma i primi 14px in alto: se la locandina è lì vicino, la card in animazione sfuma allo stesso modo
function fadeM(sr,T){const st=$("stage").getBoundingClientRect().top;return sr.top<st+14?{st:st,ty:T.y}:null;}
function visClip(el,sr){let t=sr.top,b=sr.bottom,l=sr.left,r=sr.right;
  for(let n=el.parentElement;n&&n!==document.documentElement;n=n.parentElement){const cs=getComputedStyle(n);
    if(/(hidden|auto|scroll|clip)/.test(cs.overflowY+cs.overflowX)){const q=n.getBoundingClientRect();t=Math.max(t,q.top);b=Math.min(b,q.bottom);l=Math.max(l,q.left);r=Math.min(r,q.right);}}
  const z=v=>Math.max(0,v);return{t:z(t-sr.top),b:z(sr.bottom-b),l:z(l-sr.left),r:z(sr.right-r)};}
function fromTo(sr,T){const k=sr.width/T.w;return "translate("+(sr.left-T.x)+"px,"+(sr.top-T.y)+"px) scale("+k+")";}

function openLb(el){
  if(LB)return;
  if(PEND)PEND();
  const lb=$("lb"),card=$("lbc"),sr=rectOf(el);
  const vw=innerWidth,vh=innerHeight,padX=20,padT=76+SAT(),padB=64;
  const maxW=vw-padX*2,maxH=vh-padT-padB;

  const R=rad(el),k=sr.width/T.w,ik=1/k;

  const sh="0 "+(24*ik)+"px "+(50*ik)+"px rgba(0,0,0,.6),0 0 "+(40*ik)+"px rgba(143,98,248,.25)";
  card.style.cssText="left:"+T.x+"px;top:"+T.y+"px;width:"+T.w+"px;height:"+T.h+"px;border-radius:"+R+"px;box-shadow:"+sh;
  const im=el.querySelector("img");
  if(im)card.style.cssText+=";box-sizing:border-box;padding:1px;background:var(--s2)";
  let ring=null,edge=null;
  if(im){
    card.innerHTML='<img alt="" referrerpolicy="no-referrer">';
    const ci=card.firstChild;ci.src=im.currentSrc||im.src;
    const bu=bigUrl(im.currentSrc||im.src);
    if(bu!==ci.src){const pre=new Image();pre.referrerPolicy="no-referrer";pre.onload=()=>{const go=()=>{if(LB&&LB.card===card)ci.src=bu;};(OA&&OA.finished?OA.finished.then(go,go):Promise.resolve().then(go));};pre.src=bu;}
    // "cornice": bordo sottile + icona zoom della locandina piccola. Visibile solo quando la card è piccola.
    ring=document.createElement("div");
    ring.style.cssText="position:absolute;left:0;top:0;width:"+(sr.width-2)+"px;height:"+(sr.height-2)+"px;transform:scale("+ik+");transform-origin:0 0;border-radius:"+R+"px;pointer-events:none";
    card.appendChild(ring);
    edge=document.createElement("div");
    edge.style.cssText="position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;z-index:3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)";

(function(){

  });

    if(!drag)return;drag=false;

function polish(p,r){
  const pn=$('pn');
  if(pn){
    if(RM())pn.textContent=p;
    else{const t0=performance.now(),D=950,W=350;(function f(t){const k=Math.max(0,Math.min(1,(t-t0-W)/D)),e=1-Math.pow(1-k,3);pn.textContent=Math.round(p*e);if(t-t0<W+D)requestAnimationFrame(f);else pn.textContent=p;})(t0);}
  }
  const fg=stage.querySelector('.fgc');
  if(fg)requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.strokeDashoffset=String(169.65*(1-p/100));}));
  [['.chips>*'],['.why li'],['.pv']].forEach(q=>stage.querySelectorAll(q[0]).forEach((el,i)=>el.style.setProperty('--c',i)));
  stage.querySelectorAll('.poster img').forEach(im=>{const ok=()=>im.classList.add('ld');if(im.complete)ok();else{im.addEventListener('load',ok);im.addEventListener('error',ok);}});
  const pe=stage.querySelector('.poster');
  if(pe){pe.onclick=()=>{tap();openLb(pe);};pe.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLb(pe);}};}
  const pl=$('plot'),pm=$('pmore');
  const pc=$('plotcard');
  if(pl&&pm&&pc){
    const cs=getComputedStyle(pl),lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5,CH=Math.round(lh*4);
    if(pl.scrollHeight<=CH+2){pl.classList.remove('clamp');pl.style.height='';pm.remove();pc.classList.remove('tap');pc.removeAttribute('role');pc.removeAttribute('tabindex');pc.removeAttribute('aria-expanded');}
    else{
      pl.style.height=CH+'px';
      pl.addEventListener('transitionend',e=>{if(e.target===pl&&e.propertyName==='height'&&!pl.classList.contains('clamp'))pl.style.height='auto';});
      const toggle=()=>{
        if(window.getSelection&&String(window.getSelection()).length>0)return;
        const opening=pl.classList.contains('clamp');
        const cur=pl.getBoundingClientRect().height;
        pl.style.height=cur+'px';void pl.offsetHeight;          // parte da dove si trova ora
        pl.classList.toggle('clamp',!opening);
        pl.style.height=(opening?pl.scrollHeight:CH)+'px';
        pm.textContent=opening?'Riduci':'Leggi tutto';pc.setAttribute('aria-expanded',opening);
      };
      pc.onclick=toggle;
      pc.onkeydown=e=>{if(e.target===pc&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle();}};
    }
  }
}

// Nel file ci sono solo sale + impronta PBKDF2 delle credenziali: nome utente e password non sono scritti in chiaro.
const AUTH_SALT="stasera-v1-e6a19200dd53b736",AUTH_HASH="9e9b0a27b4792394b2150ac7fb5694b5ddc96498063b88f8ec2bdfa2d253fd32",AUTH_KEY="stasera_auth";
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
async function authHash(u,p){
  const enc=new TextEncoder(),k=await crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(AUTH_SALT),iterations:200000,hash:"SHA-256"},k,256));
}
const isAuthed=()=>{try{return localStorage.getItem(AUTH_KEY)===AUTH_HASH;}catch(e){return false;}};
