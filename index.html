<title>Stasera Cosa Guardo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  /* palette: sala cinema buia, velluto rosso, neon viola, titoli dorati */
  --bg:#0c0a11; --surface:#16121e; --surface-2:#1f1929; --line:#2f2740;
  --fg:#f4effa; --muted:#a89fba; --red:#ff3d52; --violet:#9061f9; --gold:#f5c451;
  --film:#ff3d52; --serie:#5ec8ff; --anime:#9061f9;
  --font-display:"Bricolage Grotesque","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.5;
  background-image:radial-gradient(900px 500px at 85% -10%, rgba(144,97,249,.16), transparent 60%), radial-gradient(700px 420px at -10% 0%, rgba(255,61,82,.12), transparent 60%);
  background-repeat:no-repeat;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; line-height:1.1;}
button,input{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
a{color:var(--gold);}

.top{display:flex; flex-direction:column; gap:12px;}
.brand{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.brand b{font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.14em; text-transform:uppercase;}
.brand b i{font-style:normal; color:var(--red);}
.catpill{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); letter-spacing:.06em;}
.catpill span.dot{width:8px; height:8px; border-radius:50%; background:var(--accent, var(--red));}
.count{font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; letter-spacing:.06em;}
.bar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.bar>span{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg, var(--red), var(--violet)); transition:width .4s ease;}

.stage{animation:rise .35s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.q{font-size:clamp(26px,6.5vw,38px); font-weight:800; letter-spacing:-.02em; margin-bottom:8px;}
.hint{color:var(--muted); margin:0 0 18px;}

.catgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.catcard{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:22px 18px; display:flex; flex-direction:column; gap:10px; text-align:left; transition:border-color .15s, transform .15s;}
.catcard:hover{transform:translateY(-2px);}
.catcard .ic{font-size:34px; line-height:1;}
.catcard strong{font-family:var(--font-display); font-size:19px; font-weight:800;}
.catcard small{color:var(--muted); font-size:13.5px;}
.catcard.film:hover, .catcard.film[aria-pressed="true"]{border-color:var(--film); background:linear-gradient(135deg, rgba(255,61,82,.14), transparent);}
.catcard.serie:hover, .catcard.serie[aria-pressed="true"]{border-color:var(--serie); background:linear-gradient(135deg, rgba(94,200,255,.14), transparent);}
.catcard.anime:hover, .catcard.anime[aria-pressed="true"]{border-color:var(--anime); background:linear-gradient(135deg, rgba(144,97,249,.16), transparent);}

.opts{display:grid; gap:10px; grid-template-columns:minmax(0,1fr);}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.opt{display:flex; align-items:center; gap:14px; text-align:left; min-width:0; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:16px; min-height:64px; transition:border-color .15s, background .15s, transform .15s;}
.opts.two .opt{flex-direction:column; align-items:flex-start; gap:10px; padding:18px 16px;}
.opt:hover{border-color:var(--violet); transform:translateY(-1px);}
.opt[aria-pressed="true"]{border-color:var(--red); background:linear-gradient(135deg, rgba(255,61,82,.16), rgba(144,97,249,.14));}
.emo{font-size:28px; line-height:1; flex:none;}
.opts.two .emo{font-size:32px;}
.lab{min-width:0; overflow-wrap:anywhere;}
.lab strong{display:block; font-weight:600;}
.lab small{display:block; color:var(--muted); font-size:14px; margin-top:2px;}
.nav{display:flex; gap:10px; margin-top:18px; align-items:center; flex-wrap:wrap;}
.btn{border-radius:14px; padding:14px 20px; font-weight:600; min-height:48px; background:var(--surface-2); border:1.5px solid var(--line); transition:transform .15s, border-color .15s;}
.btn:hover{border-color:var(--violet); transform:translateY(-1px);}
.btn.primary{background:linear-gradient(135deg, var(--red), #c42ddb 120%); border-color:transparent; color:#fff;}
.btn.primary:hover{border-color:transparent; filter:brightness(1.08);}
.btn.cta{flex:1 1 220px; font-family:var(--font-display); font-weight:800; letter-spacing:.08em; text-transform:uppercase;}
.btn.ghost{background:transparent;}

.slider-box{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:22px 18px; display:flex; flex-direction:column; gap:16px;}
.risk-num{font-family:var(--font-display); font-weight:800; font-size:56px; line-height:1; font-variant-numeric:tabular-nums;}
.risk-num sup{font-size:22px; color:var(--muted); vertical-align:top; margin-left:2px;}
.risk-txt{color:var(--gold); font-weight:600; min-height:3em;}
input[type=range]{width:100%; accent-color:var(--red); height:32px; margin:0;}
.ends{display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px;}

.loading{min-height:340px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center;}
.loading p{font-family:var(--font-display); font-size:22px; font-weight:700; margin:0; min-height:1.4em;}
.clap{width:110px; height:110px;}
.clap .arm{transform-origin:14px 38px; animation:clap .9s ease-in-out infinite;}
@keyframes clap{0%,55%,100%{transform:rotate(-22deg);} 70%{transform:rotate(0deg);}}

.errbox{background:var(--surface); border:1.5px solid rgba(255,61,82,.5); border-radius:16px; padding:20px 18px; display:flex; flex-direction:column; gap:14px;}

.res{display:flex; flex-direction:column; gap:18px;}
.tag{align-self:flex-start; font-size:13px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--gold); border:1px solid rgba(245,196,81,.4); border-radius:99px; padding:4px 12px;}
.hero{display:grid; grid-template-columns:minmax(0,190px) minmax(0,1fr); gap:18px; align-items:start;}
.poster{position:relative; width:100%; aspect-ratio:2/3; border-radius:12px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.12); background:var(--surface-2);}
.poster img{width:100%; height:100%; object-fit:cover; display:block;}
.poster.fallback{display:flex; flex-direction:column; justify-content:space-between; padding:14px 12px;}
.poster.fallback small{font-size:10px; letter-spacing:.3em; text-transform:uppercase; opacity:.8;}
.poster.fallback h3{font-size:clamp(18px,5vw,24px); font-weight:800; text-transform:uppercase; line-height:1; overflow-wrap:anywhere;}
.poster.fallback em{font-style:normal; font-family:var(--font-display); font-weight:700; font-size:18px; opacity:.9;}
.meta{display:flex; flex-direction:column; gap:10px; min-width:0;}
.meta h2{font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-.02em; overflow-wrap:anywhere;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:4px 12px; font-size:14px; font-variant-numeric:tabular-nums;}
.chip.rating{color:var(--gold); border-color:rgba(245,196,81,.35);}
.compat{display:flex; flex-direction:column; gap:6px;}
.compat b{font-family:var(--font-display); font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold);}
.compat .meter{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.compat .meter span{display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--red)); border-radius:99px;}
.block{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:16px 18px;}
.block h3{font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:8px;}
.block p{margin:0; max-width:65ch;}
.block.verdict{background:linear-gradient(135deg, rgba(255,61,82,.14), rgba(144,97,249,.16)); border-color:rgba(255,61,82,.4);}
.block.verdict p{font-family:var(--font-display); font-size:19px; font-weight:700; line-height:1.3;}
.src{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
.actions{display:flex; flex-direction:column; gap:10px;}
.actions .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
footer{color:var(--muted); font-size:12.5px; text-align:center; display:flex; flex-direction:column; gap:6px; margin-top:8px;}
footer button{background:none; border:0; color:var(--muted); text-decoration:underline; padding:0; font-size:12.5px;}

@media (max-width:520px){
  .hero{grid-template-columns:minmax(0,130px) minmax(0,1fr); gap:14px;}
  .poster.fallback{padding:10px 9px;}
  .poster.fallback h3{font-size:15px;}
}
@media (prefers-reduced-motion:reduce){
  .stage{animation:none;}
  .clap .arm{animation:none; transform:rotate(-12deg);}
  .bar>span, .opt, .btn, .catcard{transition:none;}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">

<div class="wrap">
  <header class="top">
    <div class="brand">
      <b>Stasera cosa <i>guardo</i></b>
      <span class="catpill" id="catpill" hidden><span class="dot" id="catdot"></span><span id="catname"></span></span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="bar" role="progressbar" aria-label="Avanzamento del quiz" aria-valuemin="0" aria-valuemax="7" id="barwrap"><span id="barfill"></span></div>
  </header>
  <main id="stage" class="stage"></main>
  <footer>
    <span>Fonti pubbliche e senza chiavi API: Wikidata/Wikipedia per i film, TVmaze per le serie TV, Jikan (MyAnimeList) per gli anime.</span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     CATEGORIE: Film (Wikidata+Wikipedia), Serie TV (TVmaze), Anime (Jikan)
     Nessuna API key: tutte le fonti sono pubbliche e aperte.
     ============================================================ */

  var CATS = {
    film:  { id: "film",  label: "Film",    ic: "🎬", sub: "da un secolo di cinema", accent: "var(--film)" },
    serie: { id: "serie", label: "Serie TV", ic: "📺", sub: "da tutto il piccolo schermo", accent: "var(--serie)" },
    anime: { id: "anime", label: "Anime",    ic: "⛩️", sub: "da tutto il catalogo MyAnimeList", accent: "var(--anime)" }
  };

  var STEPS = [
    { id: "vibe", q: "Che vibe hai stasera?", two: true, o: [
      ["love", "❤️", "Voglio innamorarmi"], ["laugh", "😂", "Voglio ridere"], ["cry", "😭", "Voglio piangere"], ["scare", "😱", "Voglio avere paura"],
      ["shock", "🤯", "Voglio rimanere sconvolta/o"], ["think", "🧠", "Voglio qualcosa che mi faccia pensare"], ["well", "✨", "Voglio semplicemente stare bene"], ["wild", "🔥", "Voglio qualcosa di completamente folle"] ] },
    { id: "effort", q: "Quanto vuoi impegnarti emotivamente?", o: [
      ["0", "🛋️", "Zero cervello", "Voglio solo rilassarmi e divertirmi."],
      ["1", "🍿", "Medio", "Voglio una bella storia, ma senza soffrire troppo."],
      ["2", "🧠", "Voglio soffrire", "Fammi uscire da questa storia completamente diversa/o."] ] },
    { id: "time", q: "Quanto tempo hai?", byCat: {
        film:  [["short","⏱️","Meno di 90 minuti"], ["mid","🎬","90–120 minuti"], ["long","🍿","Più di 2 ore"], ["any","🔥","Non mi interessa"]],
        serie: [["short","⏱️","Un episodio veloce"], ["mid","🎬","Un paio di episodi"], ["long","🍿","Mi preparo al binge"], ["any","🔥","Non mi interessa"]],
        anime: [["short","⏱️","Una mini-serie breve"], ["mid","🎬","Una stagione normale"], ["long","🍿","Un'opera lunghissima"], ["any","🔥","Non mi interessa"]]
      } },
    { id: "who", q: "Con chi guardi?", o: [
      ["solo", "👤", "Da sola/o"], ["partner", "❤️", "Con il partner"], ["friends", "👯", "Con amici"], ["family", "👨‍👩‍👧‍👦", "Con la famiglia"],
      ["convince", "😈", "Con qualcuno che devo convincere"] ] },
    { id: "kind", q: "Che tipo di storia vuoi?", o: [
      ["hook", "🔥", "Qualcosa che mi tenga incollata/o"], ["love", "💋", "Una grande storia d'amore"], ["disturb", "🚨", "Qualcosa di disturbante"], ["twist", "🤠", "Un colpo di scena assurdo"],
      ["sexy", "👀", "Qualcosa di sexy"], ["smart", "😂", "Una commedia intelligente"], ["tears", "🥺", "Qualcosa che mi faccia piangere"], ["must", "🏆", "Qualcosa che devo assolutamente recuperare"] ] },
    { id: "risk", q: "Quanto vuoi uscire dalla tua comfort zone?", slider: true },
    { id: "avoid", q: "Cosa non vuoi assolutamente?", multi: true, byCat: {
        film:  [["horror","🚫","Horror"], ["romance","🚫","Romance"], ["long","🚫","Film troppo lungo"], ["sad","🚫","Troppo triste"], ["old","🚫","Troppo vecchio"], ["violence","🚫","Troppa violenza"], ["sex","🚫","Troppo sesso"], ["none","✅","Nessuna preferenza"]],
        serie: [["horror","🚫","Horror"], ["romance","🚫","Romance"], ["long","🚫","Troppe puntate"], ["sad","🚫","Troppo triste"], ["old","🚫","Troppo vecchia"], ["violence","🚫","Troppa violenza"], ["sex","🚫","Troppo sesso"], ["none","✅","Nessuna preferenza"]],
        anime: [["horror","🚫","Horror"], ["romance","🚫","Romance"], ["long","🚫","Troppi episodi"], ["sad","🚫","Troppo triste"], ["old","🚫","Troppo vecchio"], ["violence","🚫","Troppa violenza"], ["sex","🚫","Fanservice/Ecchi"], ["none","✅","Nessuna preferenza"]]
      } }
  ];
  var TOTAL = STEPS.length;
  var LOAD_TXT = { film: ["Sfoglio l'archivio di Wikidata...", "Incrocio i generi...", "Ci siamo quasi..."], serie: ["Sfoglio il palinsesto...", "Controllo le stagioni...", "Ci siamo quasi..."], anime: ["Sfoglio il catalogo MyAnimeList...", "Controllo gli episodi...", "Ci siamo quasi..."] };

  var VIBE_TXT = { love: "innamorarti", laugh: "ridere", cry: "piangere", scare: "avere paura", shock: "rimanere sconvolta/o", think: "pensare", well: "stare bene", wild: "qualcosa di completamente folle" };
  var KIND_TXT = { hook: "una storia che ti tenga incollata/o", love: "una grande storia d'amore", disturb: "qualcosa di disturbante", twist: "un colpo di scena assurdo", sexy: "qualcosa di sexy", smart: "una commedia intelligente", tears: "qualcosa che ti faccia piangere", must: "un titolo da recuperare assolutamente" };
  var WHO_TXT = { solo: "da sola/o", partner: "in coppia", friends: "con gli amici", family: "con la famiglia", convince: "con chi va convinto" };

  function riskLabel(n) {
    if (n <= 15) return "Voglio andare sul sicuro.";
    if (n <= 35) return "Una piccola sorpresa va bene.";
    if (n <= 60) return "Sorprendimi, ma con giudizio.";
    if (n <= 80) return "Fammi uscire dai binari.";
    return "Portami dove non sono mai stata/o.";
  }

  /* ============================================================
     GENERI per categoria (tassonomie diverse per ogni fonte)
     ============================================================ */

  var GENRES = {
    film: {
      vibe: { love:["romance film","romantic drama"], laugh:["comedy film","romantic comedy","black comedy"], cry:["drama film","tearjerker film"],
        scare:["horror film","slasher film"], shock:["thriller film","psychological thriller","mystery film"], think:["science fiction film","mystery film","drama film"],
        well:["comedy film","adventure film","animated film","family film"], wild:["action film","science fiction film","fantasy film","comedy film"] },
      kind: { hook:["thriller film","action film","adventure film"], love:["romance film"], disturb:["horror film","thriller film"], twist:["mystery film","thriller film"],
        sexy:["romance film","erotic film"], smart:["comedy film"], tears:["drama film","romance film"], must:["drama film"] },
      avoid: { horror:["horror film"], romance:["romance film"], violence:["horror film","war film"], sex:["erotic film"] },
      heavy: ["drama film","mystery film","war film"], light: ["comedy film","action film","animated film","family film"]
    },
    serie: {
      vibe: { love:["Romance"], laugh:["Comedy"], cry:["Drama","Romance"], scare:["Horror"], shock:["Thriller","Mystery"],
        think:["Science-Fiction","Mystery","Drama"], well:["Comedy","Family","Adventure"], wild:["Action","Science-Fiction","Fantasy","Comedy"] },
      kind: { hook:["Thriller","Action","Crime"], love:["Romance"], disturb:["Horror","Thriller"], twist:["Mystery","Thriller"],
        sexy:["Romance"], smart:["Comedy"], tears:["Drama","Romance"], must:["Drama","Crime"] },
      avoid: { horror:["Horror"], romance:["Romance"], violence:["Horror","War","Crime"], sex:["Romance"] },
      heavy: ["Drama","Mystery","War"], light: ["Comedy","Family","Adventure"]
    },
    anime: {
      vibe: { love:["Romance"], laugh:["Comedy"], cry:["Drama"], scare:["Horror"], shock:["Thriller","Suspense","Mystery"],
        think:["Mystery","Psychological","Sci-Fi"], well:["Comedy","Slice of Life","Adventure"], wild:["Action","Sci-Fi","Fantasy","Supernatural"] },
      kind: { hook:["Action","Thriller","Suspense"], love:["Romance"], disturb:["Horror","Psychological"], twist:["Mystery","Suspense"],
        sexy:["Romance","Ecchi"], smart:["Comedy"], tears:["Drama","Romance"], must:["Action","Drama"] },
      avoid: { horror:["Horror"], romance:["Romance"], violence:["Horror","Gore"], sex:["Ecchi","Hentai"] },
      heavy: ["Drama","Psychological","Mystery"], light: ["Comedy","Slice of Life","Adventure"]
    }
  };

  var S = { cat: null, step: 0, a: { vibe: null, effort: null, time: null, who: null, kind: null, risk: 50, avoid: [] }, cands: [], seen: [], cur: null };
  var stage = document.getElementById("stage");
  var countEl = document.getElementById("count");
  var fill = document.getElementById("barfill");
  var barwrap = document.getElementById("barwrap");
  var catpill = document.getElementById("catpill");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function rand(n) { return Math.floor(Math.random() * n); }
  function pick(arr) { return arr[rand(arr.length)]; }
  function uniq(arr) { var seen = {}; return arr.filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; }); }
  function setProgress(n, label) { fill.style.width = (n / TOTAL * 100) + "%"; barwrap.setAttribute("aria-valuenow", n); countEl.textContent = label || ""; }
  function swap(html) { stage.classList.remove("stage"); void stage.offsetWidth; stage.classList.add("stage"); stage.innerHTML = html; }
  function stripHtml(s) { var d = document.createElement("div"); d.innerHTML = s || ""; return d.textContent || ""; }
  function fetchJson(url, opts, timeoutMs) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, timeoutMs || 12000);
    opts = opts || {};
    opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) { clearTimeout(t); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); },
      function (e) { clearTimeout(t); throw e; });
  }

  /* ============================================================
     SCHERMATA CATEGORIA
     ============================================================ */
  function renderCatPicker() {
    catpill.hidden = true;
    setProgress(0, "");
    var h = '<h1 class="q">Cosa guardiamo stasera?</h1><p class="hint">Scegli il tipo di titolo e poi rispondi a qualche domanda veloce.</p>' +
      '<div class="catgrid" id="catgrid">';
    ["film", "serie", "anime"].forEach(function (k) {
      var c = CATS[k];
      h += '<button type="button" class="catcard ' + k + '" data-v="' + k + '" aria-pressed="false" style="--accent:' + c.accent + '"><span class="ic" aria-hidden="true">' + c.ic + '</span><strong>' + c.label + '</strong><small>' + esc(c.sub) + '</small></button>';
    });
    h += "</div>";
    swap(h);
    document.getElementById("catgrid").onclick = function (e) {
      var b = e.target.closest(".catcard"); if (!b) return;
      S.cat = b.getAttribute("data-v");
      S.step = 0; S.a = { vibe: null, effort: null, time: null, who: null, kind: null, risk: 50, avoid: [] };
      S.cands = []; S.seen = []; S.cur = null;
      renderStep();
    };
  }

  /* ============================================================
     QUIZ
     ============================================================ */
  function renderStep() {
    var cat = CATS[S.cat];
    catpill.hidden = false;
    document.getElementById("catdot").style.background = cat.accent;
    document.getElementById("catname").textContent = cat.label;
    var st = STEPS[S.step];
    setProgress(S.step + 1, (S.step + 1) + "/" + TOTAL);
    var opts = st.byCat ? st.byCat[S.cat] : st.o;
    var h = '<h1 class="q">' + esc(st.q) + "</h1>";
    if (st.slider) {
      var r = S.a.risk;

  /* ============================================================
     ARRICCHIMENTO IN ITALIANO (Wikipedia, senza chiave)
     ============================================================ */
  function wikiSummary(title) {
    var t = title.trim().replace(/\s+/g, "_");
    return fetchJson("https://it.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t), {}, 8000);
  }
  function wikiSearchTitles(q) {
    var url = "https://it.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=4&srsearch=" + encodeURIComponent(q);
    return fetchJson(url, {}, 8000).then(function (r) { return (r.query && r.query.search || []).map(function (x) { return x.title; }); }, function () { return []; });
  }
  function enrichItalian(searchTitle) {
    return wikiSummary(searchTitle).then(function (r) {
      if (r && r.extract && r.type !== "disambiguation") return { extract: r.extract, thumb: r.thumbnail && r.thumbnail.source };
      return wikiSearchTitles(searchTitle).then(tryList);
    }, function () { return wikiSearchTitles(searchTitle).then(tryList); });
    function tryList(titles) {
      if (!titles.length) return null;
      var t0 = titles[0];
      return wikiSummary(t0).then(function (r2) {
        if (r2 && r2.extract && r2.type !== "disambiguation") return { extract: r2.extract, thumb: r2.thumbnail && r2.thumbnail.source };
        return null;
      }, function () { return null; });
    }
  }

  /* ============================================================
     FONTE: FILM — Wikidata (SPARQL) + Wikipedia
     ============================================================ */
  function sparql(query) {
    return fetch("https://query.wikidata.org/sparql", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/sparql-results+json" },
      body: "query=" + encodeURIComponent(query)
    }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function filmFilters(a) {
    var g = GENRES.film, without = [];
    a.avoid.forEach(function (k) { if (g.avoid[k]) without = without.concat(g.avoid[k]); });
    if (a.who === "family") without = without.concat(["horror film", "erotic film", "war film"]);
    var rtMin, rtMax;
    if (a.time === "short") rtMax = 95; else if (a.time === "mid") { rtMin = 85; rtMax = 125; } else if (a.time === "long") rtMin = 115;
    if (a.avoid.indexOf("long") >= 0) rtMax = Math.min(rtMax || 999, 130);
    return { without: uniq(without), rtMin: rtMin, rtMax: rtMax, yearMin: a.avoid.indexOf("old") >= 0 ? 1995 : undefined };
  }
  function filmGenreSet(a) {
    var g = GENRES.film;
    return uniq((g.vibe[a.vibe] || []).concat(g.kind[a.kind] || []));
  }
  function filmDiscover(a, surprise, relax) {
    var f = filmFilters(a);
    var genres = filmGenreSet(a).filter(function (x) { return f.without.indexOf(x) < 0; });
    if (!genres.length) genres = ["drama film", "comedy film"];
    var risk = surprise ? Math.max(a.risk + 30, 85) : a.risk;
    var minLinks = risk < 30 ? 40 : risk < 60 ? 18 : risk < 80 ? 8 : 3;
    if (relax) minLinks = Math.max(2, Math.floor(minLinks / 3));
    var values = genres.map(function (x) { return '"' + x.replace(/"/g, '') + '"@en'; }).join(" ");
    var yearFilter = f.yearMin ? ("FILTER(!BOUND(?year) || ?year >= " + f.yearMin + ") ") : "";
    var rtFilter = (f.rtMin || f.rtMax) ? ("FILTER(!BOUND(?runtime) || (" + (f.rtMin ? "?runtime >= " + f.rtMin : "true") + " && " + (f.rtMax ? "?runtime <= " + f.rtMax : "true") + ")) ") : "";
    var q = "SELECT DISTINCT ?film ?filmLabel ?year ?sitelinks ?image ?runtime WHERE { " +
      "VALUES ?gl { " + values + " } ?genre rdfs:label ?gl . " +
      "?film wdt:P31 wd:Q11424 ; wdt:P136 ?genre ; wikibase:sitelinks ?sitelinks . " +
      "FILTER(?sitelinks >= " + minLinks + ") " +
      "OPTIONAL { ?film wdt:P577 ?date . BIND(YEAR(?date) AS ?year) } " +
      "OPTIONAL { ?film wdt:P18 ?image } " +
      "OPTIONAL { ?film wdt:P2047 ?runtime } " +
      yearFilter + rtFilter +
      "SERVICE wikibase:label { bd:serviceParam wikibase:language \"it,en\" } " +
      "} ORDER BY DESC(?sitelinks) LIMIT 60";
    return sparql(q).then(function (d) {
      var rows = (d.results && d.results.bindings) || [];
      return rows.map(function (b) {
        var qid = b.film.value.split("/").pop();
        return {
          id: qid, title: b.filmLabel ? b.filmLabel.value : qid,
          year: b.year ? b.year.value : "",
          sitelinks: b.sitelinks ? +b.sitelinks.value : 0,
          image: b.image ? b.image.value : null,
          runtime: b.runtime ? Math.round(+b.runtime.value) : null,
          genres: genres
        };
      }).filter(function (m) { return !/^Q\d+$/.test(m.title); });
    });
  }
  function filmDetails(c) {
    var posterPromise = c.image ? Promise.resolve(c.image + "?width=500") : Promise.resolve(null);
    return enrichItalian(c.title).then(function (wiki) {
      return posterPromise.then(function (img) {
        return {
          title: c.title, year: c.year, runtime: c.runtime,
          overview: (wiki && wiki.extract) || "Trama non ancora disponibile su Wikipedia in italiano.",
          overviewIsItalian: !!(wiki && wiki.extract),
          poster: (wiki && wiki.thumb) || img,
          ratingLabel: null, ratingVal: null,
          popLabel: "Wikipedia", popVal: c.sitelinks,
          genresText: null
        };
      });
    });
  }

  /* ============================================================
     FONTE: SERIE TV — TVmaze
     ============================================================ */
  function tvGenreSet(a) {
    var g = GENRES.serie;
    return uniq((g.vibe[a.vibe] || []).concat(g.kind[a.kind] || []));
  }
  function tvFilters(a) {
    var g = GENRES.serie, without = [];
    a.avoid.forEach(function (k) { if (g.avoid[k]) without = without.concat(g.avoid[k]); });
    if (a.who === "family") without = without.concat(["Horror", "Adult"]);
    return { without: uniq(without), yearMin: a.avoid.indexOf("old") >= 0 ? 1995 : undefined };
  }
  function tvDiscover(a, surprise, relax) {
    var f = tvFilters(a);
    var wanted = tvGenreSet(a).filter(function (x) { return f.without.indexOf(x) < 0; });
    if (!wanted.length) wanted = ["Drama", "Comedy"];
    var pagesToTry = relax ? 10 : 6;
    var pages = []; for (var i = 0; i < pagesToTry; i++) pages.push(rand(380));
    pages = uniq(pages);
    var jobs = pages.map(function (p) {
      return fetchJson("https://api.tvmaze.com/shows?page=" + p, {}, 9000).then(function (list) { return list || []; }, function () { return []; });
    });
    return Promise.all(jobs).then(function (lists) {
      var all = [].concat.apply([], lists);
      var minRating = surprise ? 0 : (relax ? 5.5 : 6.5);
      return all.filter(function (s) {
        if (!s.genres || !s.genres.length) return false;
        var overlap = s.genres.some(function (g) { return wanted.indexOf(g) >= 0; });
        if (!overlap) return false;
        var bad = s.genres.some(function (g) { return f.without.indexOf(g) >= 0; });
        if (bad) return false;
        if (f.yearMin && s.premiered && +s.premiered.slice(0, 4) < f.yearMin) return false;
        if (s.rating && s.rating.average && s.rating.average < minRating) return false;
        if (s.language && s.language !== "English" && s.language !== "Italian" && a.risk < 60 && !surprise) return false;
        return true;
      }).map(function (s) {
        return { id: s.id, title: s.name, year: s.premiered ? s.premiered.slice(0, 4) : "", genres: s.genres,
          rating: s.rating && s.rating.average, runtime: s.averageRuntime || s.runtime,
          image: s.image && (s.image.original || s.image.medium), summary: stripHtml(s.summary), status: s.status };
      });
    });
  }
  function tvDetails(c) {
    return enrichItalian(c.title).then(function (wiki) {
      return {
        title: c.title, year: c.year, runtime: c.runtime,
        overview: (wiki && wiki.extract) || c.summary || "Trama non disponibile.",
        overviewIsItalian: !!(wiki && wiki.extract),
        poster: (wiki && wiki.thumb) || c.image,
        ratingLabel: "TVmaze", ratingVal: c.rating,
        popLabel: null, popVal: null,
        genresText: (c.genres || []).join(" · ")
      };
    });
  }

  /* ============================================================
     FONTE: ANIME — Jikan (MyAnimeList)
     ============================================================ */
  var jikanGenreMap = null;
  function jikanGenres() {
    if (jikanGenreMap) return Promise.resolve(jikanGenreMap);
    return fetchJson("https://api.jikan.moe/v4/genres/anime", {}, 9000).then(function (r) {
      var map = {};
      (r.data || []).forEach(function (g) { map[g.name] = g.mal_id; });
      jikanGenreMap = map;
      return map;
    });
  }
  function animeGenreSet(a) {
    var g = GENRES.anime;
    return uniq((g.vibe[a.vibe] || []).concat(g.kind[a.kind] || []));
  }
  function animeFilters(a) {
    var g = GENRES.anime, without = [];
    a.avoid.forEach(function (k) { if (g.avoid[k]) without = without.concat(g.avoid[k]); });
    var epMax;
    if (a.time === "short") epMax = 13; else if (a.time === "mid") epMax = 26; else if (a.time === "long") epMax = undefined;
    if (a.avoid.indexOf("long") >= 0) epMax = Math.min(epMax || 9999, 26);
    return { without: uniq(without), epMax: epMax, yearMin: a.avoid.indexOf("old") >= 0 ? 1995 : undefined };
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function animeDiscover(a, surprise, relax) {
    var f = animeFilters(a);
    return jikanGenres().then(function (map) {
      var wanted = animeGenreSet(a).filter(function (x) { return f.without.indexOf(x) < 0 && map[x]; }).map(function (x) { return map[x]; });
      if (!wanted.length) wanted = [map["Drama"], map["Comedy"]].filter(Boolean);
      var without = f.without.filter(function (x) { return map[x]; }).map(function (x) { return map[x]; });
      var minScore = surprise ? 0 : (relax ? 6 : 7);
      var pages = relax ? [1, 2, 3] : [1 + rand(2), 3 + rand(2)];
      var jobs = pages.map(function (pg, idx) {
        return sleep(idx * 420).then(function () {
          var url = new URL("https://api.jikan.moe/v4/anime");
          url.searchParams.set("genres", wanted.join(","));
          if (without.length) url.searchParams.set("genres_exclude", without.join(","));
          url.searchParams.set("order_by", "score"); url.searchParams.set("sort", "desc");
          url.searchParams.set("min_score", minScore); url.searchParams.set("page", pg); url.searchParams.set("limit", "24");
          url.searchParams.set("sfw", "true");
          return fetchJson(url.toString(), {}, 10000).then(function (r) { return r.data || []; }, function () { return []; });
        });
      });
      return Promise.all(jobs).then(function (lists) {
        var all = [].concat.apply([], lists);
        return all.filter(function (m) {
          if (f.epMax && m.episodes && m.episodes > f.epMax) return false;
          if (f.yearMin && m.aired && m.aired.prop && m.aired.prop.from && m.aired.prop.from.year && m.aired.prop.from.year < f.yearMin) return false;
          return true;
        }).map(function (m) {
          return { id: m.mal_id, title: m.title, year: m.aired && m.aired.prop && m.aired.prop.from ? m.aired.prop.from.year : "",
            genres: (m.genres || []).map(function (g) { return g.name; }), rating: m.score, episodes: m.episodes,
            image: m.images && m.images.jpg && (m.images.jpg.large_image_url || m.images.jpg.image_url), synopsis: m.synopsis };
        });
      });
    });
  }
  function animeDetails(c) {
    return enrichItalian(c.title).then(function (wiki) {
      return {
        title: c.title, year: c.year, runtime: null, episodes: c.episodes,
        overview: (wiki && wiki.extract) || c.synopsis || "Trama non disponibile.",
        overviewIsItalian: !!(wiki && wiki.extract),
        poster: (wiki && wiki.thumb) || c.image,
        ratingLabel: "MyAnimeList", ratingVal: c.rating,
        popLabel: null, popVal: null,
        genresText: (c.genres || []).join(" · ")
      };
    });
  }

  var SOURCES = {
    film:  { discover: filmDiscover,  details: filmDetails,  heavy: GENRES.film.heavy,  light: GENRES.film.light },
    serie: { discover: tvDiscover,    details: tvDetails,    heavy: GENRES.serie.heavy, light: GENRES.serie.light },
    anime: { discover: animeDiscover, details: animeDetails, heavy: GENRES.anime.heavy, light: GENRES.anime.light }
  };

  /* ============================================================
     PUNTEGGIO (generico, adattato per categoria)
     ============================================================ */
  function hit(genresOfCand, wantedList) {
    if (!genresOfCand || !wantedList || !wantedList.length) return 0;
    var any = genresOfCand.some(function (g) { return wantedList.indexOf(g) >= 0; });
    return any ? 1 : 0;
  }
  function mainstreamProxy(cat, m) {
    if (cat === "film") return Math.max(0, Math.min(1, Math.log10(Math.max(2, m.sitelinks)) / 2.6));
    if (cat === "anime") return Math.max(0, Math.min(1, Math.log10(Math.max(10, (m.rating || 5) * 1000)) / 5));
    return m.rating ? Math.max(0, Math.min(1, (m.rating - 3) / 6)) : 0.4;
  }
  function score(cat, m, a) {
    var src = SOURCES[cat];
    var gset = GENRES[cat];
    var g = m.genres || [];
    var s = 0;
    s += 35 * hit(g, gset.vibe[a.vibe]);
    s += 25 * hit(g, gset.kind[a.kind]);
    var e = +a.effort;
    var heavy = g.some(function (x) { return src.heavy.indexOf(x) >= 0; }) || (m.rating || 0) >= 8.3;
    var light = g.some(function (x) { return src.light.indexOf(x) >= 0; });
    s += 15 * (e === 2 ? (heavy ? 1 : 0.3) : e === 0 ? (light ? 1 : 0.3) : 0.75);
    var mainstream = mainstreamProxy(cat, m);
    s += 15 * Math.max(0, 1 - Math.abs((1 - mainstream) * 100 - a.risk) / 70);
    s += 10 * (cat === "film" ? Math.max(0, Math.min(1, mainstream)) : m.rating ? Math.max(0, Math.min(1, (m.rating - 5) / 4)) : 0.5);
    return s;
  }
  function pctOf(s) { return Math.round(Math.min(98, 52 + 46 * Math.pow(Math.max(0, s) / 100, 1.3))); }

  /* ============================================================
     RICERCA / FLUSSO
     ============================================================ */
  function newCands(surprise) {
    var src = SOURCES[S.cat];
    return src.discover(S.a, surprise, false).then(function (c) {
      if (c.length >= 5) return c;
      return src.discover(S.a, surprise, true).then(function (c2) { return c.concat(c2); });
    }).then(function (c) {
      var seen = {}; c = c.filter(function (m) { if (seen[m.id]) return false; seen[m.id] = 1; return true; });
      if (!c.length) throw new Error("EMPTY");
      var ranked = c.map(function (m) { return { m: m, s: score(S.cat, m, S.a) }; }).sort(function (x, y) { return y.s - x.s; });
      return ranked;
    });
  }
  function pickFrom(ranked, surprise) {
    var pool = ranked.filter(function (x) { return S.seen.indexOf(x.m.id) < 0; });
    if (!pool.length) return null;
    if (surprise) { pool = pool.slice(0, 10); return pick(pool); }
    return pool[0];
  }
  function run(surprise, fresh) {
    var stop = showLoading();
    var wait = new Promise(function (r) { setTimeout(r, 2200); });
    var src = SOURCES[S.cat];
    var job = Promise.resolve().then(function () {
      var cand = !fresh && !surprise ? pickFrom(S.cands, false) : null;
      if (cand) return cand;
      return newCands(surprise).then(function (ranked) {
        if (!surprise) S.cands = ranked;
        return pickFrom(ranked, surprise) || pick(ranked);
      });
    }).then(function (cand) {
      S.seen.push(cand.m.id);
      return src.details(cand.m).then(function (d) { return { d: d, m: cand.m, s: cand.s }; });
    });
    Promise.all([job, wait]).then(function (r) { stop(); showResult(r[0], surprise); }, function (e) { stop(); showError(e); });
  }
  function startSearch() { S.seen = []; S.cands = []; run(false, true); }

  /* ============================================================
     RISULTATO
     ============================================================ */
  function hue(str) { var h = 0; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360; return h; }
  function fallbackPoster(t, y) {
    var h = hue(t);
    return '<div class="poster fallback" role="img" aria-label="Copertina non disponibile" style="background:linear-gradient(165deg,hsl(' + h + ' 72% 42%),hsl(' + ((h + 55) % 360) + ' 60% 14%) 85%)"><small>Stasera</small><h3>' + esc(t) + "</h3><em>" + esc(y) + "</em></div>";
  }
  function why(cat, r, surprise) {
    var a = S.a, gset = GENRES[cat], g = r.m.genres || [], out = [];
    if (surprise) out.push("È una scelta volutamente fuori dai tuoi binari, come hai chiesto.");
    if (hit(g, gset.vibe[a.vibe])) out.push("Stasera volevi " + VIBE_TXT[a.vibe] + " e questo titolo punta dritto lì.");
    else out.push("Non è la scelta più ovvia per chi vuole " + VIBE_TXT[a.vibe] + ", ma si sposa bene con il resto delle tue risposte.");
    if (hit(g, gset.kind[a.kind])) out.push("Cercavi " + KIND_TXT[a.kind] + ": ci siamo.");
    var e = +a.effort;
    if (e === 2) out.push("Hai chiesto qualcosa che ti lasci addosso qualcosa.");
    else if (e === 0) out.push("Per spegnere il cervello e divertirti, è una scelta leggera da seguire.");
    else out.push("Ha il giusto equilibrio tra storia e leggerezza che cercavi.");
    out.push("Funziona bene " + WHO_TXT[a.who] + ".");
    return out.join(" ");
  }
  function verdict(cat, d) {
    if (cat === "film") {
      var n = (d.popVal || 0).toLocaleString("it-IT");
      return "Un film abbastanza noto da avere pagine Wikipedia in " + n + " lingue diverse.";
    }
    var v = d.ratingVal;
    if (!v) return "Un titolo che vale la pena scoprire, anche se non ha ancora un voto consolidato.";
    var lead = v >= 8 ? "Uno dei titoli più amati dal pubblico" : v >= 7 ? "Un titolo che piace davvero" : "Un titolo che divide, nel modo giusto";
    return lead + ": " + v.toFixed(1) + " su 10 (" + d.ratingLabel + ").";
  }
  function showResult(r, surprise) {
    S.cur = r;
    var cat = S.cat, d = r.d, pct = pctOf(r.s); if (surprise) pct = Math.max(60, pct - 6); r.pct = pct;
    setProgress(TOTAL, ""); countEl.textContent = "Fatto";
    var posterHtml = d.poster ? '<div class="poster"><img id="pimg" src="' + esc(d.poster) + '" alt="Copertina di ' + esc(d.title) + '"></div>' : fallbackPoster(d.title, d.year);
    var chips = "";
    if (d.year) chips += '<span class="chip">' + esc(d.year) + "</span>";
    if (d.runtime) chips += '<span class="chip">' + d.runtime + " min/ep</span>";
    if (d.episodes) chips += '<span class="chip">' + d.episodes + " episodi</span>";
    if (d.ratingVal) chips += '<span class="chip rating">' + d.ratingLabel + " " + (+d.ratingVal).toFixed(1) + "</span>";
    if (cat === "film") chips += '<span class="chip rating">Wikipedia ×' + d.popVal + "</span>";
    var h = '<div class="res">' + (surprise ? '<span class="tag">🎲 Fuori dalla tua comfort zone</span>' : "") +
      '<div class="hero">' + posterHtml + '<div class="meta"><h2>' + esc(d.title) + '</h2><div class="chips">' + chips + "</div>" +
      (d.genresText ? '<div class="chips"><span class="chip">' + esc(d.genresText) + "</span></div>" : "") +
      '<div class="compat"><b>⭐ Compatibilità ' + pct + '%</b><div class="meter"><span style="width:' + pct + '%"></span></div></div></div></div>' +
      '<section class="block"><h3>Perché fa per te</h3><p>' + esc(why(cat, r, surprise)) + "</p></section>" +
      '<section class="block"><h3>Trama</h3><p>' + esc(d.overview) + '</p><p class="src">' + (d.overviewIsItalian ? "📖 Fonte: Wikipedia in italiano" : "📖 Sinossi originale (non ancora tradotta su Wikipedia)") + "</p></section>" +
      '<section class="block verdict"><h3>Il verdetto</h3><p>“' + esc(verdict(cat, d)) + "”</p></section>" +
      '<div class="actions"><div class="row"><button type="button" class="btn" id="surprise">🎲 Sorprendimi</button><button type="button" class="btn" id="another">🔄 Un altro titolo</button><button type="button" class="btn" id="restart">' + CATS[cat].ic + ' Cambia categoria</button></div></div></div>';
    swap(h);
    window.scrollTo(0, 0);
    var img = document.getElementById("pimg");
    if (img) img.onerror = function () { img.parentNode.outerHTML = fallbackPoster(d.title, d.year); };
    document.getElementById("another").onclick = function () { run(false, false); };
    document.getElementById("surprise").onclick = function () { run(true, false); };
    document.getElementById("restart").onclick = function () { renderCatPicker(); };
  }

  renderCatPicker();
})();
</script>
