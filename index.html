<style>
:root{
  --bg:#0b0911;--panel:#15121f;--panel-2:#1c1829;--line:#2a2540;
  --fg:#f4effa;--mut:#9d96ae;--red:#ff3d52;--vio:#9061f9;--gold:#f5c451;
  --r:16px;
  --fd:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --fb:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none}
/* il corpo è fisso a tutto schermo: la barra azioni resta sempre in basso e cliccabile */
body{
  margin:0;position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  font:16px/1.45 var(--fb);color:var(--fg);
  background:radial-gradient(800px 420px at 90% -10%,rgba(144,97,249,.22),transparent 60%) no-repeat,
             radial-gradient(600px 360px at -10% 105%,rgba(255,61,82,.14),transparent 65%) no-repeat,var(--bg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* struttura app: header / contenuto / barra azioni */
.top{flex:none;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 10px}
.brand{font-family:var(--fd);font-weight:800;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--red)}
#stage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  width:100%;max-width:560px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right))}
#barhost{flex:none;position:relative;z-index:20}
.bar{border-top:1px solid var(--line);background:rgba(11,9,17,.97);
  padding:12px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:10px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}

/* pagina di scelta: una domanda, opzioni in elenco; riempie lo spazio, se non basta scorre */
.page{min-height:100%;display:flex;flex-direction:column;gap:14px}
.prog{flex:none;display:flex;gap:5px}
.prog i{position:relative;overflow:hidden;flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--red),var(--vio));transform:scaleX(0);transform-origin:left;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.prog i.on::after{transform:scaleX(1)}
.page h1{margin:0;flex:none;font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,6.5vw,2.3rem);line-height:1.05;letter-spacing:-.035em}
.list{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}

/* UN SOLO tipo di riga di scelta */
.row{
  flex:1 1 0;min-height:52px;max-height:104px;width:100%;
  display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left;
  border-radius:var(--r);border:1px solid var(--line);background:var(--panel);
  transition:background .15s,border-color .15s,transform .08s;
}
.row .e{flex:none;width:38px;display:grid;place-items:center;font-size:1.75rem;line-height:1}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;font-size:1.05rem;line-height:1.2}
.row .s{font-size:.8rem;color:var(--mut);line-height:1.25}
.row .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);transition:border-color .15s,background .15s}
.list:not(.many) .row{max-height:116px}
.row:active{filter:brightness(1.25)}
.row.on{background:linear-gradient(135deg,rgba(255,61,82,.22),rgba(144,97,249,.20));border-color:var(--red)}
.row.on .ck{border-color:var(--red);background:radial-gradient(circle,var(--red) 0 42%,transparent 48%)}
@media (hover:hover){.row:hover{border-color:rgba(255,255,255,.24)}}
@media (max-height:780px){.list.many .s{display:none}.list.many .row{min-height:46px}.list.many .e{width:32px;font-size:1.45rem}.page{gap:10px}}
@media (max-height:700px){.top{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}.row{min-height:46px}}
@media (min-width:900px){#stage{max-width:620px}.brand{font-size:1.05rem}}

/* bottoni azione */
.btn{
  min-width:0;min-height:54px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;
  font-weight:700;font-size:clamp(.82rem,4.2vw,.98rem);text-align:center;white-space:nowrap;overflow:hidden;transition:transform .08s,filter .15s;
}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:linear-gradient(135deg,var(--red),#b92fd8);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(255,61,82,.28)}
.btn.ico{font-size:1.4rem;padding:0}

/* caricamento / errore */
.load{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.spin{position:relative;width:78px;height:78px}
.spin i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,var(--red) 80%,#fff);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:sp 1s linear infinite}
.spin i+i{inset:13px;background:conic-gradient(from 0deg,transparent 0 30%,var(--vio) 85%,#fff);animation:sp 1.5s linear infinite reverse}
.spin b{position:absolute;inset:31px;border-radius:50%;background:radial-gradient(circle,var(--gold),var(--red));box-shadow:0 0 30px var(--red);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.65);opacity:.7}50%{transform:scale(1.2);opacity:1}}
@keyframes sp{to{transform:rotate(360deg)}}
.load p{margin:0;font-family:var(--fd);font-weight:700;font-size:1.3rem}
.err{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 4px}
.err h2{margin:0;font-family:var(--fd);font-size:1.9rem;line-height:1.05}
.err p,.err small{margin:0;color:var(--mut)}

/* risultato */
.res{display:flex;flex-direction:column;gap:12px}
.hero{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:start}
.poster{width:100%;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster.fb{display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;border:0}
.poster.fb h3{margin:0;font-family:var(--fd);font-size:1rem;line-height:1.1}
.poster.fb small{opacity:.8;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.meta{display:flex;flex-direction:column;gap:10px;min-width:0}
.meta h2{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.05;letter-spacing:-.03em;word-break:break-word}
.tag{margin:-4px 0 0;font-size:.82rem;color:var(--mut);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.74rem;color:var(--mut);font-weight:600}
.chip.r{color:var(--gold);border-color:rgba(245,196,81,.4)}
a.chip.lnk{color:var(--fg);text-decoration:none;border-color:rgba(255,61,82,.5);background:rgba(255,61,82,.12)}
.compat b{font:700 .74rem var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.meter{height:8px;margin-top:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:inherit}
.block{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.block h3{margin:0 0 8px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.block p{margin:0;font-size:.93rem}
.block p.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.why li{display:flex;gap:10px;align-items:flex-start}
.why li b{color:var(--gold)}
.pg+.pg{margin-top:12px}
.pg small{display:block;margin-bottom:6px;font-size:.72rem;color:var(--mut);font-weight:600}
.pl{display:flex;flex-wrap:wrap;gap:10px}
.pv{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pv img{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}
.pv em{font-style:normal;font-size:.62rem;line-height:1.15;color:var(--mut);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
a.more{display:inline-block;margin-top:12px;font-size:.8rem;color:var(--gold);text-decoration:none;font-weight:600}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0;font-size:.88rem}
.info dt{color:var(--mut)}
.info dd{margin:0}
.attr{margin:0;font-size:.62rem;line-height:1.4;color:var(--mut);opacity:.65;text-align:center;padding:2px 8px 8px}


/* banner installazione */
.ib{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--panel-2);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.ib[hidden]{display:none}
.ib p{margin:0;flex:1;font-size:.82rem}
.ib .btn{min-height:42px;font-size:.82rem;padding:0 12px}

 
/* ===== animazioni (solo transform/opacity: fluide anche su mobile) ===== */
body::before,body::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:110vmax;height:110vmax;border-radius:50%;will-change:transform}
body::before{left:-60vmax;top:-70vmax;background:radial-gradient(closest-side,rgba(144,97,249,.22),transparent);animation:drift1 22s ease-in-out infinite alternate}
body::after{right:-60vmax;bottom:-75vmax;background:radial-gradient(closest-side,rgba(255,61,82,.16),transparent);animation:drift2 28s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(30vmax,18vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-26vmax,-20vmax,0) scale(1.2)}}

.in{animation:rise .42s cubic-bezier(.2,.9,.25,1) backwards}
@keyframes rise{from{opacity:0;transform:translate3d(var(--dx,0px),var(--dy,16px),0) scale(.985)}}
.out{animation:outx .18s ease-in forwards}
@keyframes outx{to{opacity:0;transform:translate3d(-26px,0,0) scale(.99)}}
@keyframes rise2{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes rowIn{from{opacity:0;transform:translateX(26px) scale(.96)}}
@keyframes chipIn{from{opacity:0;transform:translateY(6px) scale(.6)}}
@keyframes ckpop{from{transform:scale(.4);opacity:0}}
@keyframes sel{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,61,82,.55)}40%{transform:scale(1.025)}100%{transform:scale(1);box-shadow:0 0 0 14px rgba(255,61,82,0)}}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes psweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes sweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
@keyframes posterIn{from{opacity:0;transform:perspective(600px) rotateY(-30deg) translateX(-22px) scale(.86)}}

.in .page h1{animation:rowIn .5s cubic-bezier(.2,.9,.25,1) .04s backwards}
.in .row{animation:rowIn .5s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i,0)*55ms + 70ms)}
.in .row.hit{animation:sel .5s ease-out;animation-delay:0s}
.row:active{transform:scale(.975)}
.row.on .ck{animation:ckpop .4s cubic-bezier(.3,1.6,.5,1)}

.btn{position:relative}
.btn:active{transform:scale(.95)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 3.6s 1.2s ease-in-out infinite;pointer-events:none}
.bar-in .btn{animation:rise2 .5s cubic-bezier(.2,.9,.25,1) backwards}
.bar-in .btn:nth-child(2){animation-delay:.06s}.bar-in .btn:nth-child(3){animation-delay:.12s}

.load p{animation:none}
.in .res>*{animation:rise2 .6s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--k,0)*80ms + 40ms)}
.res>:nth-child(1){--k:0}.res>:nth-child(2){--k:1}.res>:nth-child(3){--k:2}.res>:nth-child(4){--k:3}.res>:nth-child(5){--k:4}.res>:nth-child(6){--k:5}.res>:nth-child(7){--k:6}.res>:nth-child(8){--k:7}.res>:nth-child(9){--k:8}
.poster{position:relative;touch-action:pan-y;will-change:transform;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.in .poster{animation:posterIn .85s .08s cubic-bezier(.2,.9,.25,1) backwards}
.poster::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-120%);animation:psweep 1.1s .7s ease-out forwards}
.poster::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.3),transparent 55%)}
.poster.tl{box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 28px rgba(144,97,249,.35)}
.poster.tl::after{opacity:1}
.poster img{opacity:0;transform:scale(1.1);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.poster img.ld{opacity:1;transform:none}
.in .chip{animation:chipIn .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.3s + var(--c,0)*60ms)}
.in .meter span{transform-origin:left;animation:fillx 1s .35s cubic-bezier(.2,.8,.2,1) backwards}
.in .why li{animation:rise2 .5s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(.45s + var(--c,0)*100ms)}
.in .why li b{display:inline-block;animation:ckpop .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:inherit}
.in .pv{animation:chipIn .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.5s + var(--c,0)*45ms)}

a.pv{color:inherit;text-decoration:none}a.pv:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>

      (d.cert?'<span class="chip">'+esc(d.cert)+'</span>':'')+
      (d.rv?'<span class="chip r">★ '+(+d.rv).toFixed(1)+'</span>':'')+
      (d.trailer?'<a class="chip lnk" href="'+esc(d.trailer)+'" target="_blank" rel="noopener">▶ Trailer</a>':'')+
    '</div><div class="compat"><b>Compatibilità <span id="pn">0</span>%</b><div class="meter"><span style="width:'+p+'%"></span></div></div></div></div>'+
    '<section class="block"><h3>Perché fa per te</h3><ul class="why">'+why(r,sur).slice(0,4).map(x=>'<li><b>✓</b><span>'+esc(x)+'</span></li>').join('')+'</ul></section>'+
    provHtml(d)+
    '<section class="block"><h3>Trama</h3><p class="clamp" id="plot" style="cursor:pointer">'+esc(d.overview||'Trama non disponibile.')+'</p></section>'+
    infoHtml(d)+
    (d.tmdbUrl?'<a class="more" style="text-align:center" href="'+esc(d.tmdbUrl)+'" target="_blank" rel="noopener">Scheda completa su TMDB ↗</a>':'')+
    '<p class="attr">'+esc(attrTxt(d))+'</p>'+
  '</div>';
  swap(h);polish(p);
  const pl=$('plot');if(pl)pl.onclick=()=>pl.classList.toggle('clamp');
  setBar(barHtml(bb('rst','← Modifica'),bb('sur','🎲 Sorprendi'),bb('oth','Un altro','primary')),{
    oth:()=>{tap();run(false,false);},
    sur:()=>{tap();run(true,false);},
    rst:()=>{tap();home();}});
}

/* ---------- Icona app (iOS) ---------- */
try{
  const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  x.fillStyle="#ff3d52";x.fillRect(0,0,180,180);
  x.fillStyle="#fff";x.beginPath();x.moveTo(68,48);x.lineTo(136,90);x.lineTo(68,132);x.closePath();x.fill();
  $("apple").href=c.toDataURL("image/png");
}catch(e){}

/* ---------- Avvio e installazione ---------- */
home();
let dp=null;const ib=$("ib");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;try{if(!localStorage.getItem("stasera_ix"))ib.hidden=false;}catch(x){ib.hidden=false;}});
$("ibtn").onclick=()=>{ib.hidden=true;if(dp){dp.prompt();dp=null;}};
$("ix").onclick=()=>{ib.hidden=true;try{localStorage.setItem("stasera_ix","1");}catch(x){}};
try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;if(ios&&!stand&&!localStorage.getItem("stasera_ix")){ib.querySelector("p").innerHTML="Per usarla come app: tocca <b>Condividi</b> ⬆️ e poi <b>Aggiungi a Home</b>.";$("ibtn").hidden=true;ib.hidden=false;}}catch(e){}
addEventListener("appinstalled",()=>{ib.hidden=true;});
})();
</script>
