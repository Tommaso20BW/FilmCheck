<style>
:root{
  --bg:#0b0911;
  --panel:#14121d;
  --panel-2:#1b1726;
  --line:#2d2740;
  --fg:#f4effa;
  --mut:#a7a0b7;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font:16px/1.45 var(--fb);color:var(--fg);

             radial-gradient(700px 400px at 0% 100%,rgba(255,61,82,.12),transparent 65%) no-repeat,var(--bg);
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;

}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}
.brand{font-family:var(--fd);font-weight:800;font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--red)}
h1{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.02;letter-spacing:-.035em}
.sub{margin:6px 0 0;color:var(--mut);font-size:.95rem}

/* sezioni */
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{margin:0 2px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* bottone di scelta: UNICO componente per tutte le scelte */
.opt{
  min-height:var(--h);border-radius:var(--r);border:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;

}
.opt .e{font-size:1.35rem;line-height:1}
.opt .t{font-size:.76rem;font-weight:600;color:var(--fg);word-break:break-word}
.opt:active{transform:scale(.97)}
.opt.on{background:linear-gradient(135deg,rgba(255,61,82,.22),rgba(144,97,249,.20));border-color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,61,82,.35)}

  padding:14px max(14px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));

.bar-in{max-width:560px;margin:0 auto;display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:1fr}
.btn{
  min-height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 14px;font-weight:700;font-size:1rem;text-align:center;transition:transform .1s,filter .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--red),#c42ddb 130%);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(255,61,82,.28)}
.bar-in.home{grid-template-columns:76px 1fr}
.bar-in.home .btn:first-child{font-size:1.4rem;padding:0}

.load{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}

@keyframes sp{to{transform:rotate(360deg)}}
.load p{margin:0;font-family:var(--fd);font-weight:700;font-size:1.3rem}

.err h2{margin:0;font-family:var(--fd);font-size:1.9rem;line-height:1.05}
.err p,.err small{margin:0;color:var(--mut)}

.poster.fb{display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;border:0}
.poster.fb h3{margin:0;font-family:var(--fd);font-size:1.15rem;line-height:1.1}
.poster.fb small{opacity:.8;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.meta{display:flex;flex-direction:column;gap:10px;min-width:0}
.meta h2{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(1.5rem,6.5vw,2.1rem);line-height:1.05;letter-spacing:-.03em;word-break:break-word}

.compat b{font:700 .78rem var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.meter{height:8px;margin-top:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:inherit}
.block{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}

.block p{margin:0;font-size:.95rem;-webkit-user-select:text;user-select:text}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.why li{display:flex;gap:10px;align-items:flex-start}
.why li b{color:var(--gold)}
.in{animation:rise .25s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* banner installazione */
.ib{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:9;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r);background:var(--panel-2);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}

.ib .btn{min-height:44px;font-size:.85rem;padding:0 12px}

@media (max-width:360px){.opt .t{font-size:.7rem}.hero{grid-template-columns:104px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.in,.spin{animation:none}.opt,.btn{transition:none}}
</style>

<script>

  $('retry-btn').onclick=()=>{S.seen=[];S.cands=[];run(false,true);};

/* ---------- Fonti dati (logica invariata) ---------- */
const KW=/film|serie|anime|televisiv|animazione|manga|telefilm|sitcom/i;

function fj(url,ms,opts){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);return fetch(url,Object.assign({signal:c.signal},opts||{})).then(r=>{clearTimeout(t);if(r.status===429){const e=new Error("429");e.retry=1;throw e;}if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).catch(e=>{clearTimeout(t);throw e;});}

async function wdFilms(a,strict,anim){const wn=without("film",a);let genres=(G.film.mood[a.mood]||["drama film"]).filter(x=>wn.indexOf(x)<0&&x!=="animated film");if(!anim&&!genres.length)genres=["drama film","comedy film"];const useMood=anim?(strict&&genres.length>0):true;const minL=Math.max(2,Math.round((a.risk<30?40:a.risk<60?18:a.risk<80?8:3)/(strict?1:3)/(anim?2:1)));const AN='?film wdt:P136 ?ga. ?ga rdfs:label "animated film"@en. ';const q="SELECT ?film ?filmLabel ?sl ?d ?rt ?img WHERE{"+(useMood?"VALUES ?gl{"+VALS(genres)+"} ?g rdfs:label ?gl. ?film wdt:P136 ?g. ":"")+"?film wdt:P31 wd:Q11424; wikibase:sitelinks ?sl. FILTER(?sl>="+minL+") "+(anim?AN+"FILTER NOT EXISTS{?film wdt:P495 wd:Q17} ":"FILTER NOT EXISTS{"+AN+"} ")+(strict&&wn.length?"FILTER NOT EXISTS{?film wdt:P136 ?b. ?b rdfs:label ?bl. VALUES ?bl{"+VALS(wn)+"}} ":"")+"OPTIONAL{?film wdt:P577 ?d} OPTIONAL{?film wdt:P2047 ?rt} OPTIONAL{?film wdt:P18 ?img} SERVICE wikibase:label{bd:serviceParam wikibase:language \"it,en\"}} LIMIT 200";const seen={},out=[];(await sparql(q)).forEach(b=>{const id=b.film.value.split("/").pop(),t=b.filmLabel&&b.filmLabel.value;if(seen[id]||!t||/^Q\d+$/.test(t))return;seen[id]=1;out.push({id,title:t,year:b.d?b.d.value.slice(0,4):"",sl:+b.sl.value,runtime:b.rt?Math.round(+b.rt.value):null,img:b.img?b.img.value.replace(/^http:/,"https:")+"?width=500":null,genres:useMood?genres:[],movie:true});});return out;}
async function wpFilms(a,anim){const wn=without("film",a),term=anim?'"film d\'animazione" -giapponese':MOOD_TXT[a.mood]+(wn.indexOf("horror film")>=0?" -horror":"");const url="https://it.wikipedia.org/w/api.php?action=query&generator=search&format=json&origin=*&gsrnamespace=0&gsrlimit=30&gsroffset="+rand(200)+"&gsrsearch="+encodeURIComponent('hastemplate:Film "è un film" '+term)+"&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=4&exlimit=30&piprop=thumbnail&pithumbsize=500";const d=await fj(url,12000),p=d.query&&d.query.pages?Object.values(d.query.pages):[];return p.filter(x=>x.extract&&/film/i.test(x.extract.slice(0,200))).map(x=>({id:"wp"+x.pageid,title:x.title.replace(/\s*\(film.*\)$/,""),year:(x.extract.match(/\b(19|20)\d\d\b/)||[""])[0],sl:10,runtime:null,genres:[],movie:true,pre:{extract:x.extract,thumb:x.thumbnail&&x.thumbnail.source}}));}
async function filmDiscover(a,anim){let list=[],err=null;try{list=await wdFilms(a,true,anim);const rtMin=a.time==="mid"?85:a.time==="long"?115:0,rtMax=a.time==="short"?95:a.time==="mid"?125:999,ym=0;list=tier(list,[m=>(!m.runtime||(m.runtime>=rtMin&&m.runtime<=rtMax))&&(!ym||!m.year||+m.year>=ym),()=>true]);}catch(e){err=e;}if(list.length<5){try{list=list.concat(await wdFilms(a,false,anim));}catch(e){err=err||e;}}if(list.length<3){try{list=list.concat(await wpFilms(a,anim));}catch(e){err=err||e;}}if(!list.length&&err)throw err;return list;}
async function wdMeta(id){if(!/^Q\d+$/.test(id))return{};try{const q='SELECT ?gl ?dl WHERE{OPTIONAL{wd:'+id+' wdt:P136 ?g. ?g rdfs:label ?gl. FILTER(LANG(?gl)="it")} OPTIONAL{wd:'+id+' wdt:P57 ?dr. ?dr rdfs:label ?dl. FILTER(LANG(?dl)="en")}}';const rows=await Promise.race([sparql(q),sleep(8000).then(()=>{throw new Error("t");})]);const gl=[],dr=[];rows.forEach(b=>{if(b.gl)gl.push(b.gl.value.replace(/^film\s+(di\s+|d['’]\s*)?/i,""));if(b.dl)dr.push(b.dl.value);});return{glist:uniq(gl).slice(0,4),dir:uniq(dr).slice(0,2).join(", ")};}catch(e){return{};}}
async function filmDetails(c){const [w,meta]=await Promise.all([c.pre?Promise.resolve(c.pre):enrich(c.title,"film"),wdMeta(c.id)]);const gl=meta.glist&&meta.glist.length?meta.glist:uniq((c.genres||[]).map(x=>x));return{movie:true,title:c.title,year:c.year,runtime:c.runtime,dir:meta.dir||"",glist:gl,gt:gl.join(" · "),overview:(w&&w.extract)||"Trama non ancora disponibile su Wikipedia in italiano.",it:!!(w&&w.extract),poster:(w&&w.thumb)||c.img,rl:"Wikidata",rv:null,pop:c.sl};}

async function tvDiscover(a,anim){const wn=without("serie",a),want=G.serie.mood[a.mood]||["Drama","Comedy"],ym=0;const pages=uniq(Array.from({length:anim?14:6},()=>rand(240)));const lists=await Promise.all(pages.map(p=>fjr("https://api.tvmaze.com/shows?page="+p,9000).catch(()=>[])));const all=[].concat(...lists);if(!all.length)throw new Error("rete/TVmaze non raggiungibile");const items=all.filter(s=>(anim?s.type==="Animation":s.type!=="Animation")&&(s.genres||[]).indexOf("Anime")<0&&(anim||(s.genres&&s.genres.length))).map(s=>({id:s.id,src:"tv",anim:anim,title:s.name,year:s.premiered?s.premiered.slice(0,4):"",genres:s.genres||[],rating:s.rating&&s.rating.average||0,runtime:s.averageRuntime||30,image:s.image&&s.image.original||null,summary:strip(s.summary||""),lang:s.language||""}));const ov=m=>m.genres.some(x=>want.indexOf(x)>=0),bad=m=>m.genres.some(x=>wn.indexOf(x)>=0);return tier(items,[m=>ov(m)&&!bad(m)&&(!ym||!m.year||+m.year>=ym)&&m.rating>=6.5&&(anim||a.risk>=60||m.lang==="English"||m.lang==="Italian"),m=>ov(m)&&!bad(m)&&(!m.rating||m.rating>=5.5),m=>ov(m)&&!bad(m),m=>ov(m),()=>true]);}
async function tvDetails(c){const w=await enrich(c.title,c.anim?"serie animata":"serie televisiva");return{title:c.title,year:c.year,runtime:c.runtime,overview:(w&&w.extract)||c.summary||"Trama non disponibile.",it:!!(w&&w.extract),poster:c.image||(w&&w.thumb),rl:"TVmaze",rv:c.rating,glist:itg(c.genres),gt:itg(c.genres).join(" · ")};}

const GIT={"Comedy":"Commedia","Drama":"Drammatico","Romance":"Sentimentale","Horror":"Horror","Action":"Azione","Adventure":"Avventura","Fantasy":"Fantasy","Science-Fiction":"Fantascienza","Sci-Fi":"Fantascienza","Mystery":"Mistero","Thriller":"Thriller","Suspense":"Suspense","Slice of Life":"Vita quotidiana","Psychological":"Psicologico","Family":"Famiglia","Crime":"Crimine"};
const itg=a=>uniq((a||[]).map(x=>GIT[x]||x));
function fmtMin(m){return m>=60?Math.floor(m/60)+" h"+(m%60?" "+String(m%60).padStart(2,'0'):""):m+" min";}
const mainstream=(cat,m)=>m.sl!=null?Math.max(0,Math.min(1,Math.log10(Math.max(2,m.sl))/2.6)):m.rating?Math.max(0,Math.min(1,(m.rating-4)/5)):.4;
const hit=(g,w)=>g&&w&&g.some(x=>w.indexOf(x)>=0)?1:0;
function score(cat,m,a){const g=m.genres||[],gs=G[gkey(cat,a)],ms=mainstream(cat,m),e=+a.effort;const heavy=g.some(x=>gs.heavy.indexOf(x)>=0)||(m.rating||0)>=8.3,light=g.some(x=>gs.light.indexOf(x)>=0);return 45*hit(g,gs.mood[a.mood])+20*(e===2?(heavy?1:.3):e===0?(light?1:.3):.75)+20*Math.max(0,1-Math.abs((1-ms)*100-a.risk)/70)+15*(m.sl!=null?ms:m.rating?Math.max(0,Math.min(1,(m.rating-5)/4)):.5)+Math.random()*6;}
const pct=s=>Math.round(Math.min(98,52+46*Math.pow(Math.max(0,s)/100,1.3)));

function parseDur(d){if(!d)return null;const h=/(\d+)\s*hr/.exec(d),m=/(\d+)\s*min/.exec(d);const v=(h?+h[1]*60:0)+(m?+m[1]:0);return v||null;}
async function animeDiscover(a){
  const wn=without("anime",a);
  let want=(G.anime.mood[a.mood]||["Drama"]).filter(x=>!wn.includes(x));if(!want.length)want=["Comedy"];
  const subs=a.fmt==="movie"?["movie"]:a.fmt==="any"?["tv","movie"]:["tv"];
  const ex=wn.map(x=>JID[x]).filter(Boolean).join(",");
  const items=[];
  for(const s of subs){
    try{
      const g=JID[pick(want)]||4;
      const url="https://api.jikan.moe/v4/anime?genres="+g+(ex?"&genres_exclude="+ex:"")+"&type="+s+"&limit=15&page="+(1+rand(3))+"&order_by=score&sort=desc&min_score=6.3&sfw=true";
      const r=await fjr(url,12000);
      for(const m of (r.data||[])) items.push({id:m.mal_id,src:"anime",movie:s==="movie",title:m.title_english||m.title,year:m.aired&&m.aired.prop&&m.aired.prop.from?m.aired.prop.from.year:'',genres:(m.genres||[]).map(x=>x.name).concat((m.themes||[]).map(x=>x.name)),rating:m.score||0,runtime:s==="movie"?parseDur(m.duration):null,episodes:m.episodes||null,image:(m.images&&m.images.jpg&&m.images.jpg.large_image_url)||null,summary:m.synopsis||""});
    }catch(e){}
    if(subs.length>1) await sleep(450);
  }
  return items.slice(0,30);
}
async function animeDetails(c){const w=await enrich(c.title,c.movie?"film anime":"anime");return{movie:!!c.movie,title:c.title,year:c.year,runtime:c.runtime,episodes:c.episodes,overview:(w&&w.extract)||c.summary||"Trama non disponibile.",it:!!(w&&w.extract),poster:c.image||(w&&w.thumb),rl:"Jikan",rv:c.rating,glist:itg(c.genres),gt:itg(c.genres).join(" · ")};}
const detailsOf=c=>c.sl!=null?filmDetails(c):c.src==="tv"?tvDetails(c):animeDetails(c);
const SRC={film:a=>filmDiscover(a,false),serie:a=>tvDiscover(a,false),anime:a=>animeDiscover(a),cartoni:a=>filmDiscover(a,true)};
async function rank(a){const list=await SRC[S.cat](a);if(!list||!list.length)throw new Error("EMPTY");return list.map(m=>({m,s:score(S.cat,m,a)})).sort((x,y)=>y.s-x.s);}
const pickFrom=(r,sur)=>{const p=r.filter(x=>S.seen.indexOf(x.m.id)<0);if(!p.length)return null;return sur?pick(p.slice(0,10)):p[0];};

async function run(surprise,fresh){
  const stop=loading();const wait=sleep(1200);
  try{
    S.a=buildA();
    let ranked=null,cand=null;
    if(!fresh&&!surprise)cand=pickFrom(S.cands,false);
    if(!cand){
      const a=surprise?Object.assign({},S.a,{risk:Math.max(S.a.risk+30,85)}):S.a;
      ranked=await rank(a);
      if(!surprise)S.cands=ranked;
      cand=pickFrom(ranked,surprise)||pick(ranked);
    }
    let d,tries=0;
    for(;;){
      S.seen.push(cand.m.id);d=await detailsOf(cand.m);
      if(cand.m.sl==null||d.it||tries++>=4)break;
      const pool=ranked||S.cands,nx=pickFrom(pool,false);
      if(!nx)break;cand=nx;
    }
    await wait;stop();show({d,m:cand.m,s:cand.s},surprise);
  }catch(e){await wait;stop();showError(e);}
}

function fbPoster(t,y){const h=Array.from(t).reduce((a,ch)=>((a*31+ch.charCodeAt(0))%360),0);return '<div class="poster fb" style="background:linear-gradient(135deg,hsl('+h+' 68% 42%),hsl('+((h+55)%360)+' 58% 30%))"><small>Stasera</small><h3>'+esc(t)+'</h3><small>'+esc(y||'')+'</small></div>';}
function why(r,sur){
  const a=S.a,d=r.d,m=r.m,g=m.genres||[],gs=G[gkey(S.cat,a)],o=[];
  if(sur)o.push('È una scelta volutamente fuori dalla tua comfort zone.');
  if(hit(g,gs.mood[a.mood]))o.push('Cercavi '+MOOD_TXT[a.mood]+(d.glist&&d.glist.length?" e i suoi generi ("+d.glist.slice(0,3).join(', ')+") vanno in quella direzione.":"."));
  else o.push('Non è il genere più ovvio per chi cerca '+MOOD_TXT[a.mood]+(d.glist&&d.glist.length?" ("+d.glist.slice(0,3).join(', ')+")":"")+': lo propongo per gli altri criteri.');
  if(d.runtime)o.push('Dura '+fmtMin(d.runtime)+'.');
  if(!d.runtime&&d.episodes)o.push(d.episodes+' episodi.');
  if(d.rv)o.push('Voto '+(+d.rv).toFixed(1)+' / 10.');
  if(a.risk>=70)o.push('È abbastanza fuori dagli schemi da risultare interessante.');
  return o.slice(0,4);
}
function show(r,sur){

  const poster=d.poster?'<div class="poster"><img src="'+esc(d.poster)+'" alt="Copertina di '+esc(d.title)+'" referrerpolicy="no-referrer"></div>':fbPoster(d.title,d.year);
  const h='<div style="display:flex;flex-direction:column;gap:14px">'+
    '<div class="hero">'+poster+'<div class="meta"><h2>'+esc(d.title)+'</h2><div class="chips">'+
      (d.year?'<span class="chip">'+esc(d.year)+'</span>':'')+
      (S.cat==='anime'||S.cat==='cartoni'?'<span class="chip">'+(d.movie?'Film':'Serie')+'</span>':'')+
      (d.runtime?'<span class="chip">'+d.runtime+' min</span>':'')+
      (d.rv?'<span class="chip r">★ '+(+d.rv).toFixed(1)+'</span>':'')+

    '<section class="block"><h3>Perché fa per te</h3><ul class="why">'+why(r,sur).map(x=>'<li><b>✓</b><span>'+esc(x)+'</span></li>').join('')+'</ul></section>'+
    '<section class="block"><h3>Trama</h3><p>'+esc(d.overview||'Trama non disponibile.')+'</p></section>'+
  '</div>';
  swap(h);
  setBar('<div class="bar"><div class="bar-in"><button type="button" class="btn" id="rst">← Modifica</button><button type="button" class="btn" id="sur">🎲 Sorprendi</button><button type="button" class="btn primary" id="oth">Un altro</button></div></div>');
  $('oth').onclick=()=>run(false,false);
